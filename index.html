/* ===== Liquid Glass layer ===== */
/* =====================================================================
   EducMind · LIQUID GLASS (iOS / iPadOS / macOS 26 – 27)
   Lớp thiết kế này được nối vào cuối <style> gốc nên toàn bộ hành vi,
   bố cục và luồng nghiệp vụ của ứng dụng được giữ nguyên.
   Thứ tự chất liệu: 1) Chrome  ·  2) Content  ·  3) Controls
   ===================================================================== */

/* ---------------------------------------------------------------------
   0 · TOKENS
   ------------------------------------------------------------------ */
:root{
  color-scheme:light;

  /* — Vật liệu 3 tầng — */
  --lg-blur-chrome:blur(36px) saturate(200%) brightness(1.07);
  --lg-blur-content:blur(24px) saturate(200%) brightness(1.05);
  --lg-blur-control:blur(18px) saturate(165%) brightness(1.03);
  --lg-blur-sheet:blur(48px) saturate(180%) brightness(1.03);

  /* Lớp 1 · chrome (thanh trên, đảo điều hướng, HUD) */
  --lg-chrome-a:rgba(255,255,255,.66);
  --lg-chrome-b:rgba(255,255,255,.36);
  --lg-chrome-rim:inset 0 1px 0 rgba(255,255,255,.95),inset 0 0 0 1px rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.22);
  --lg-chrome-shadow:0 0 0 1px rgba(15,23,42,.06),0 1px 1.5px rgba(16,24,40,.05),0 12px 30px -18px rgba(16,24,40,.3),0 40px 80px -50px rgba(16,24,40,.42);

  /* Lớp 2 · content (panel, card, bảng, hộp thoại) */
  --lg-content-a:rgba(255,255,255,.6);
  --lg-content-b:rgba(255,255,255,.38);
  --lg-content-rim:inset 0 1px 0 rgba(255,255,255,.9),inset 0 0 0 1px rgba(255,255,255,.5),inset 0 -1px 0 rgba(255,255,255,.2);
  --lg-content-shadow:0 0 0 1px rgba(15,23,42,.055),0 1px 2px rgba(16,24,40,.05),0 10px 26px -16px rgba(16,24,40,.22),0 34px 64px -46px rgba(16,24,40,.36);

  /* Lớp 3 · controls (nút, ô nhập, chip, tab) */
  --lg-control-a:rgba(255,255,255,.66);
  --lg-control-b:rgba(255,255,255,.4);
  --lg-control-hover-a:rgba(255,255,255,.9);
  --lg-control-hover-b:rgba(255,255,255,.62);
  --lg-control-rim:inset 0 1px 0 rgba(255,255,255,.95),inset 0 0 0 1px rgba(255,255,255,.42),inset 0 -1px 0 rgba(0,0,0,.03);
  --lg-control-shadow:0 0 0 1px rgba(15,23,42,.05),0 1px 1.5px rgba(16,24,40,.06),0 6px 14px -10px rgba(16,24,40,.26);

  /* Tấm kính dày cho hộp thoại */
  --lg-sheet-a:color-mix(in srgb,#ffffff 88%,transparent);
  --lg-sheet-b:color-mix(in srgb,#ffffff 70%,transparent);

  /* Kính lồng trong kính (thẻ nằm trong panel) */
  --lg-nested-a:rgba(255,255,255,.58);
  --lg-nested-b:rgba(255,255,255,.34);
  --lg-nested-rim:inset 0 1px 0 rgba(255,255,255,.92),inset 0 0 0 1px rgba(255,255,255,.5);

  /* Lớp lõm (track, ô nhập bên trong panel) */
  --lg-inset:rgba(15,23,42,.045);
  --lg-inset-rim:inset 0 1px 2px rgba(16,24,40,.07),inset 0 0 0 1px rgba(16,24,40,.045);

  /* Ánh sáng phản chiếu + viền quang học */
  --lg-spec-1:rgba(255,255,255,.92);
  --lg-spec-2:rgba(255,255,255,.34);
  --lg-spec-3:rgba(255,255,255,0);
  --lg-edge:rgba(15,23,42,.10);
  --lg-inner-glow:rgba(255,255,255,.55);

  /* Điều hướng (đảo nổi) */
  --lg-nav-ink:rgba(22,27,38,.82);
  --lg-nav-ink-strong:#0b1220;
  --lg-nav-ic:rgba(22,27,38,.52);
  --lg-nav-hover:rgba(255,255,255,.62);
  --lg-nav-active-a:rgba(255,255,255,.96);
  --lg-nav-active-b:rgba(255,255,255,.62);
  --lg-nav-active-ink:var(--brand-ink);
  --lg-nav-active-rim:inset 0 1px 0 #fff,inset 0 0 0 1px rgba(255,255,255,.7),0 1px 1.5px rgba(16,24,40,.08),0 8px 18px -12px rgba(11,60,120,.5);
  --lg-nav-section:rgba(70,80,100,.62);

  /* Quầng sáng nền */
  --lg-aurora-1:color-mix(in srgb,#2f7bff 40%,transparent);
  --lg-aurora-2:color-mix(in srgb,#8a5cff 30%,transparent);
  --lg-aurora-3:color-mix(in srgb,#00c2b2 28%,transparent);
  --lg-aurora-4:color-mix(in srgb,#ff6ea9 20%,transparent);
  --lg-aurora-5:color-mix(in srgb,#7ad7ff 26%,transparent);
  --lg-aurora-base:linear-gradient(168deg,#f2f6ff 0%,#e9eefb 34%,#f4eefb 68%,#ebf7f6 100%);
  --lg-aurora-opacity:.9;

  /* Token gốc được tái định nghĩa để mọi thành phần cũ nhận chất liệu mới */
  --bg:#eef1f8;
  --surface:#ffffff;
  --fill:rgba(15,23,42,.05);
  --fill-2:rgba(15,23,42,.08);
  --line:rgba(15,23,42,.09);
  --line-strong:rgba(15,23,42,.16);
  --track:rgba(15,23,42,.08);
  --glass:rgba(255,255,255,.62);
  --glass-line:rgba(15,23,42,.08);
  --btn-light:rgba(15,23,42,.05);
  --btn-light-hover:rgba(15,23,42,.09);
  --brand-soft:color-mix(in srgb,var(--brand) 12%,#fff);
  --shadow:var(--lg-content-rim),var(--lg-content-shadow);
  --shadow-lg:0 1px 2px rgba(16,24,40,.06),0 28px 60px -24px rgba(16,24,40,.28),0 60px 120px -60px rgba(16,24,40,.4);
  --radius:26px;
  --radius-sm:18px;
  --radius-control:16px;
  --ease:cubic-bezier(.22,.9,.28,1);
  --ease-spring:cubic-bezier(.34,1.42,.5,1);
}

:root[data-theme="dark"]{
  color-scheme:dark;

  --lg-blur-chrome:blur(38px) saturate(180%) brightness(1.1);
  --lg-blur-content:blur(28px) saturate(165%) brightness(1.08);
  --lg-blur-control:blur(20px) saturate(150%) brightness(1.06);

  --lg-chrome-a:rgba(32,34,42,.66);
  --lg-chrome-b:rgba(20,22,28,.5);
  --lg-chrome-rim:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 1px rgba(255,255,255,.09),inset 0 -1px 0 rgba(255,255,255,.06);
  --lg-chrome-shadow:0 0 0 1px rgba(255,255,255,.08),0 1px 1.5px rgba(0,0,0,.5),0 16px 40px -22px rgba(0,0,0,.85);

  --lg-content-a:rgba(30,32,40,.62);
  --lg-content-b:rgba(22,24,30,.5);
  --lg-content-rim:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(255,255,255,.08),inset 0 -1px 0 rgba(255,255,255,.05);
  --lg-content-shadow:0 0 0 1px rgba(255,255,255,.07),0 1px 2px rgba(0,0,0,.5),0 14px 34px -18px rgba(0,0,0,.8);

  --lg-control-a:rgba(48,50,60,.6);
  --lg-control-b:rgba(30,32,40,.5);
  --lg-control-hover-a:rgba(70,72,84,.72);
  --lg-control-hover-b:rgba(44,46,56,.6);
  --lg-control-rim:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 1px rgba(255,255,255,.1),inset 0 -1px 0 rgba(0,0,0,.2);
  --lg-control-shadow:0 0 0 1px rgba(255,255,255,.06),0 1px 1.5px rgba(0,0,0,.45),0 8px 18px -12px rgba(0,0,0,.7);

  --lg-sheet-a:color-mix(in srgb,#23252d 92%,transparent);
  --lg-sheet-b:color-mix(in srgb,#191b21 88%,transparent);
  --lg-nested-a:rgba(255,255,255,.085);
  --lg-nested-b:rgba(255,255,255,.035);
  --lg-nested-rim:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 1px rgba(255,255,255,.07);

  --lg-inset:rgba(0,0,0,.32);
  --lg-inset-rim:inset 0 1px 2px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.06);

  --lg-spec-1:rgba(255,255,255,.3);
  --lg-spec-2:rgba(255,255,255,.045);
  --lg-spec-3:rgba(255,255,255,0);
  --lg-edge:rgba(255,255,255,.11);
  --lg-inner-glow:rgba(255,255,255,.12);

  --lg-nav-ink:rgba(232,238,255,.86);
  --lg-nav-ink-strong:#fff;
  --lg-nav-ic:rgba(214,226,255,.62);
  --lg-nav-hover:rgba(255,255,255,.09);
  --lg-nav-active-a:rgba(255,255,255,.26);
  --lg-nav-active-b:rgba(255,255,255,.12);
  --lg-nav-active-ink:#fff;
  --lg-nav-active-rim:inset 0 1px 0 rgba(255,255,255,.4),inset 0 0 0 1px rgba(255,255,255,.2),0 1px 2px rgba(0,0,0,.4),0 10px 22px -14px rgba(0,0,0,.8);
  --lg-nav-section:rgba(190,205,235,.5);

  --lg-aurora-1:color-mix(in srgb,#1a63ff 52%,transparent);
  --lg-aurora-2:color-mix(in srgb,#7a3cff 46%,transparent);
  --lg-aurora-3:color-mix(in srgb,#00b3a4 28%,transparent);
  --lg-aurora-4:color-mix(in srgb,#ff4d8d 22%,transparent);
  --lg-aurora-5:color-mix(in srgb,#2bb8ff 26%,transparent);
  --lg-aurora-base:linear-gradient(168deg,#05070d 0%,#080b14 40%,#0a0710 72%,#04090b 100%);
  --lg-aurora-opacity:.9;

  --bg:#05070c;
  --surface:#16181e;
  --fill:rgba(255,255,255,.07);
  --fill-2:rgba(255,255,255,.11);
  --line:rgba(255,255,255,.1);
  --line-strong:rgba(255,255,255,.2);
  --track:rgba(255,255,255,.14);
  --glass:rgba(28,30,38,.6);
  --glass-line:rgba(255,255,255,.12);
  --btn-light:rgba(255,255,255,.09);
  --btn-light-hover:rgba(255,255,255,.15);
  --brand-soft:color-mix(in srgb,var(--brand) 22%,transparent);
  --shadow:var(--lg-content-rim),var(--lg-content-shadow);
  --shadow-lg:0 1px 2px rgba(0,0,0,.6),0 34px 70px -28px rgba(0,0,0,.9);
}

}

/* ---------------------------------------------------------------------
   1 · KHÔNG GIAN NỀN: ánh sáng thích ứng + khúc xạ quang học
   ------------------------------------------------------------------ */
/* Nền canvas do <html> giữ; <body>
<svg id="lg-defs" aria-hidden="true" focusable="false" width="0" height="0"
     style="position:absolute;width:0;height:0;overflow:hidden;pointer-events:none">
  <defs>
    <!-- Khúc xạ quang học: nhiễu fractal làm lệch điểm ảnh của quầng sáng nền -->
    <filter id="lg-refract" x="-15%" y="-15%" width="130%" height="130%"
            color-interpolation-filters="sRGB" filterUnits="objectBoundingBox">
      <feTurbulence type="fractalNoise" baseFrequency="0.0042 0.0071" numOctaves="3" seed="19" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="7" result="smooth"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.6" result="src"/>
      <feDisplacementMap in="src" in2="smooth" scale="58"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>
 để trong suốt để quầng sáng ở z-index âm
   không bị nền của body che mất (thứ tự vẽ của CSS). */
html{background:var(--lg-aurora-base);-webkit-tap-highlight-color:transparent}
body{background:transparent;color:var(--ink)}

/* Quầng sáng không gian: chuyển động rất chậm, bị khúc xạ qua bộ lọc SVG */
body::before{
  content:"";
  position:fixed;inset:-18vmax;
  z-index:-2;pointer-events:none;
  background-image:
    radial-gradient(30% 36% at 8% 4%,var(--lg-aurora-1),transparent 60%),
    radial-gradient(28% 32% at 92% 8%,var(--lg-aurora-2),transparent 58%),
    radial-gradient(34% 36% at 84% 90%,var(--lg-aurora-3),transparent 62%),
    radial-gradient(26% 28% at 10% 86%,var(--lg-aurora-4),transparent 58%),
    radial-gradient(30% 30% at 46% 22%,var(--lg-aurora-5),transparent 66%),
    radial-gradient(26% 26% at 62% 74%,color-mix(in srgb,var(--brand) 26%,transparent),transparent 66%),
    var(--lg-aurora-base);
  background-repeat:no-repeat;
  opacity:var(--lg-aurora-opacity);
  filter:url(#lg-refract) saturate(120%);
  transform:translate3d(0,0,0) scale(1.02);
  animation:lgDrift 64s var(--ease) infinite alternate;
  will-change:transform;
}
@keyframes lgDrift{
  0%{transform:translate3d(-1.5%,-1%,0) scale(1.04)}
  50%{transform:translate3d(1.2%,1.4%,0) scale(1.07)}
  100%{transform:translate3d(-.8%,1.8%,0) scale(1.05)}
}

/* Hạt thuỷ tinh rất nhẹ, tạo cảm giác “vật liệu” thay vì màu phẳng */
html::after{
  content:"";
  position:fixed;inset:0;z-index:9000;pointer-events:none;
  opacity:.05;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='180' height='180'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='180' height='180' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");
  background-size:180px 180px;
}
:root[data-theme="dark"] html::after{opacity:.06}

/* Lớp ảnh nền người dùng (layer 4) và ảnh nền đăng nhập vẫn được ưu tiên */
#app .layout::before{background-color:transparent}

/* ---------------------------------------------------------------------
   2 · CHROME · thanh trên
   ------------------------------------------------------------------ */
.top{
  background-color:transparent;
  background-image:
    radial-gradient(60% 180% at var(--lg-mx,18%) var(--lg-my,-60%),var(--lg-spec-1),var(--lg-spec-3) 62%),
    linear-gradient(180deg,var(--lg-chrome-a),var(--lg-chrome-b));
  -webkit-backdrop-filter:var(--lg-blur-chrome);
  backdrop-filter:var(--lg-blur-chrome);
  box-shadow:inset 0 -1px 0 var(--lg-edge),inset 0 1px 0 var(--lg-spec-2),0 10px 30px -24px rgba(15,23,42,.6);
  border-bottom:0;
  transition:box-shadow .4s var(--ease),background-color .4s var(--ease);
}
html[data-lg-scrolled="1"] .top{
  box-shadow:inset 0 -1px 0 var(--lg-edge),inset 0 1px 0 var(--lg-spec-2),0 14px 34px -22px rgba(15,23,42,.55),0 2px 60px -30px rgba(15,23,42,.35);
}
.top .user{
  color:var(--muted);
  font-weight:500;
}
.top .user .avatar{box-shadow:var(--lg-control-rim),0 2px 6px -3px rgba(15,23,42,.4)}

/* ---------------------------------------------------------------------
   3 · CHROME · đảo điều hướng (sidebar)
   ------------------------------------------------------------------ */
.layout>.side,
.teacher-layout .side,
.layout:not(.teacher-layout) .side{
  background-color:transparent;
  background-image:
    radial-gradient(120% 60% at 12% -10%,var(--lg-spec-2),var(--lg-spec-3) 60%),
    linear-gradient(158deg,var(--lg-chrome-a) 0%,var(--lg-chrome-b) 62%,color-mix(in srgb,var(--lg-chrome-b) 88%,var(--lg-aurora-2)) 100%);
  color:var(--ink);
  border:1px solid var(--lg-edge);
  -webkit-backdrop-filter:var(--lg-blur-chrome);
  backdrop-filter:var(--lg-blur-chrome);
  box-shadow:var(--lg-chrome-rim),var(--lg-chrome-shadow);
  transition:box-shadow .5s var(--ease),background-color .5s var(--ease),transform .5s var(--ease);
}
@media(min-width:901px){
  .layout>.side{
    border-radius:30px;
    box-shadow:var(--lg-chrome-rim),var(--lg-chrome-shadow),0 0 0 1px rgba(255,255,255,.12);
  }
  .layout.sidebar-collapsed>.side{border-radius:26px}
}

/* Nhãn nhóm */
#app .layout>.side .grp h2{
  color:var(--lg-nav-section)!important;
  font:700 .6875rem/1.2 var(--font-head)!important;
  letter-spacing:.085em!important;
  text-transform:uppercase;
}

/* Mục điều hướng: viên thuỷ tinh, chữ thích ứng sáng/tối */
#app .layout>.side .items .nav{
  color:var(--lg-nav-ink)!important;
  border-radius:14px;
  transition:background-color .22s var(--ease),color .22s var(--ease),box-shadow .3s var(--ease),transform .34s var(--ease-spring);
}
#app .layout>.side .items .nav .ic,
#app .teacher-navgrid .nav .ic{color:var(--lg-nav-ic)!important;transition:color .22s var(--ease),transform .34s var(--ease-spring)}
#app .layout>.side .items .nav:hover{
  background:var(--lg-nav-hover)!important;
  color:var(--lg-nav-ink-strong)!important;
  box-shadow:inset 0 1px 0 var(--lg-spec-2);
}
#app .layout>.side .items .nav:hover .ic{color:var(--lg-nav-ink-strong)!important;transform:translateY(-.5px) scale(1.04)}
#app .layout>.side .items .nav:active{transform:scale(.975)}

/* Trạng thái đang chọn: viên kính nổi, có vành sáng quang học */
#app .layout>.side .items .nav[aria-current="page"]{
  background-image:linear-gradient(180deg,var(--lg-nav-active-a),var(--lg-nav-active-b))!important;
  background-color:transparent!important;
  color:var(--lg-nav-active-ink)!important;
  box-shadow:var(--lg-nav-active-rim)!important;
  font-weight:650;
}
#app .layout>.side .items .nav[aria-current="page"] .ic{color:var(--lg-nav-active-ink)!important}

/* Thanh điều hướng ngang trên máy tính bảng / điện thoại */
@media(max-width:900px){
  .layout>.side,.teacher-layout .side,.layout:not(.teacher-layout) .side{
    border-radius:24px;
    margin:10px 12px 0;
    padding:8px!important;
    width:auto!important;
    background-image:
      radial-gradient(90% 160% at 10% -40%,var(--lg-spec-2),var(--lg-spec-3) 60%),
      linear-gradient(180deg,var(--lg-chrome-a),var(--lg-chrome-b));
  }
  /* Dock điều hướng: lưới 3 cột, mọi ô cùng chiều cao, không lệch hàng */
  #app .layout>.side,
  #app .layout.teacher-layout>.side,
  #app .layout.sidebar-collapsed>.side{
    display:grid!important;
    grid-template-columns:repeat(3,minmax(0,1fr))!important;
    grid-auto-rows:1fr!important;
    align-items:stretch!important;
    gap:6px!important;
    padding-right:54px!important;
    height:auto!important;min-height:0!important;max-height:none!important;
    overflow:visible!important;
  }
  #app .layout>.side .grp,
  #app .layout>.side .items,
  #app .layout>.side .teacher-navgrid{display:contents!important}
  #app .layout>.side .grp h2{display:none!important}
  #app .layout>.side .nav,
  #app .layout.teacher-layout>.side .nav,
  #app .layout.sidebar-collapsed>.side .nav{
    display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;
    width:100%!important;min-width:0!important;
    height:auto!important;min-height:56px!important;
    padding:8px 4px!important;gap:4px!important;
    border-radius:14px!important;
    font-size:.685rem!important;line-height:1.16!important;
    text-align:center;white-space:normal!important;
  }
  #app .layout>.side .nav span{display:block!important;white-space:normal}
  #app .layout>.side .nav .ic{transform:none}
  #app .layout>.side .items .nav[aria-current="page"]{box-shadow:var(--lg-nav-active-rim)!important}
}

/* Nút thu gọn: viên kính tròn */
#app .layout>.side-toggle{
  background-color:transparent;
  background-image:linear-gradient(180deg,var(--lg-chrome-a),var(--lg-chrome-b));
  -webkit-backdrop-filter:var(--lg-blur-chrome);
  backdrop-filter:var(--lg-blur-chrome);
  border:1px solid var(--lg-edge);
  border-radius:14px;
  color:var(--ink);
  box-shadow:var(--lg-control-rim),var(--lg-control-shadow);
  transition:transform .3s var(--ease-spring),box-shadow .3s var(--ease);
}
#app .layout>.side-toggle:hover{transform:scale(1.06);box-shadow:var(--lg-control-rim),0 10px 22px -12px rgba(15,23,42,.5)}
#app .layout>.side-toggle:active{transform:scale(.94)}

/* ---------------------------------------------------------------------
   4 · CONTENT · panel, card, bảng, đầu trang
   ------------------------------------------------------------------ */
.card,.panel,.tablewrap,.upbox,.srccard,.asg-builder,.grp-list,.mdlist{
  background-color:transparent;
  background-image:
    radial-gradient(320px circle at var(--lg-mx,50%) var(--lg-my,0%),var(--lg-spec-2),var(--lg-spec-3) 68%),
    linear-gradient(168deg,var(--lg-content-a),var(--lg-content-b));
  -webkit-backdrop-filter:var(--lg-blur-content);
  backdrop-filter:var(--lg-blur-content);
  box-shadow:var(--lg-content-rim),var(--lg-content-shadow);
  border:0;
  transition:box-shadow .45s var(--ease),transform .45s var(--ease);
}
.card,.panel{border-radius:var(--radius)}
.tablewrap{border-radius:20px}
.panel>.panel,.panel .panel,.panel .card,.card .card{
  background-image:
    radial-gradient(240px circle at var(--lg-mx,50%) var(--lg-my,0%),var(--lg-spec-2),var(--lg-spec-3) 70%),
    linear-gradient(180deg,var(--lg-nested-a),var(--lg-nested-b));
  background-color:transparent;
  -webkit-backdrop-filter:none;backdrop-filter:none;
  box-shadow:var(--lg-nested-rim);
  border-radius:18px;
}
.panel .tablewrap{box-shadow:inset 0 0 0 1px var(--lg-edge);background-image:none;background-color:var(--lg-inset);-webkit-backdrop-filter:none;backdrop-filter:none}

/* Đầu trang: một viên kính duy nhất chứa tiêu đề và bộ chọn lớp */
#main .head{
  display:flex;align-items:center;justify-content:space-between;gap:18px;
  padding:16px 20px!important;
  margin:0 0 22px!important;
  border-radius:24px;
  background-image:
    radial-gradient(360px circle at var(--lg-mx,26%) var(--lg-my,0%),var(--lg-spec-2),var(--lg-spec-3) 64%),
    linear-gradient(160deg,var(--lg-chrome-a),var(--lg-chrome-b));
  background-color:transparent;
  -webkit-backdrop-filter:var(--lg-blur-content);
  backdrop-filter:var(--lg-blur-content);
  box-shadow:var(--lg-content-rim),var(--lg-content-shadow);
  border:1px solid var(--lg-edge);
}
#main .head>div:first-child{
  background:none!important;
  box-shadow:none!important;
  border:0!important;
  padding:0!important;
  border-radius:0!important;
}
#main .head h1{
  font-size:clamp(1.55rem,1.15rem + 1.05vw,2rem);
  letter-spacing:-.026em;
  line-height:1.1;
  margin:0;
  color:var(--ink);
}
#main .head .sub{font-size:.875rem;margin:4px 0 0}

/* Bộ chọn lớp: viên kính nhỏ, phẳng, không viền nặng */
.head .selectbox.class-select,.selectbox{
  background-image:linear-gradient(180deg,var(--lg-control-a),var(--lg-control-b));
  background-color:transparent;
  -webkit-backdrop-filter:var(--lg-blur-control);
  backdrop-filter:var(--lg-blur-control);
  box-shadow:var(--lg-control-rim),var(--lg-control-shadow);
  border:1px solid var(--lg-edge);
}
.head .selectbox.class-select label{color:var(--muted);font-size:.625rem;font-weight:700;letter-spacing:.1em}
.head .selectbox.class-select select{font-weight:650;color:var(--ink)}
.selectbox select{background:transparent!important;box-shadow:none!important}

/* Bảng: kính trong, đầu bảng mờ đục vừa đủ đọc */
table{background:transparent}
th{
  background-image:linear-gradient(180deg,color-mix(in srgb,var(--lg-control-a) 92%,transparent),color-mix(in srgb,var(--lg-control-b) 88%,transparent));
  background-color:transparent;
  color:var(--muted);
  font-weight:650;
  letter-spacing:.02em;
  -webkit-backdrop-filter:blur(12px) saturate(150%);
  backdrop-filter:blur(12px) saturate(150%);
  box-shadow:inset 0 -1px 0 var(--lg-edge);
}
td,th{box-shadow:0 .5px 0 var(--line)}
.sticky-first th:first-child,.sticky-first td:first-child{background-color:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%)}
tbody tr{transition:background-color .2s var(--ease)}
tbody tr:hover td{background-color:color-mix(in srgb,var(--brand) 4%,transparent)}

/* Hộp thoại: tấm kính dày */
.ov{
  background:color-mix(in srgb,#0b1220 24%,transparent);
  -webkit-backdrop-filter:blur(24px) saturate(155%);
  backdrop-filter:blur(24px) saturate(155%);
}
.dlg{
  background-color:transparent;
  background-image:
    radial-gradient(420px circle at var(--lg-mx,50%) var(--lg-my,0%),var(--lg-spec-1),var(--lg-spec-3) 66%),
    linear-gradient(168deg,var(--lg-sheet-a),var(--lg-sheet-b));
  -webkit-backdrop-filter:var(--lg-blur-sheet);
  backdrop-filter:var(--lg-blur-sheet);
  border:1px solid var(--lg-edge);
  box-shadow:var(--lg-content-rim),0 2px 6px rgba(15,23,42,.1),0 40px 90px -34px rgba(15,23,42,.5);
  border-radius:30px;
}
.ov.dlg-shift-right .dlg{position:relative;left:clamp(50px,5vw,80px)}
@media(max-width:720px){.ov.dlg-shift-right .dlg{left:0}}
.ov .tablewrap{background-image:none;background-color:var(--lg-inset);-webkit-backdrop-filter:none;backdrop-filter:none}

/* Toast: HUD nổi */
.toast{
  background-color:transparent;
  background-image:linear-gradient(180deg,var(--lg-chrome-a),var(--lg-chrome-b));
  color:var(--ink);
  border:1px solid var(--lg-edge);
  -webkit-backdrop-filter:var(--lg-blur-chrome);
  backdrop-filter:var(--lg-blur-chrome);
  box-shadow:var(--lg-chrome-rim),var(--lg-chrome-shadow);
  border-radius:20px;
  font-weight:550;
}
:root[data-theme="dark"] .toast{background-image:linear-gradient(180deg,var(--lg-chrome-a),var(--lg-chrome-b))}

/* ---------------------------------------------------------------------
   5 · CONTROLS · nút, chip, ô nhập, tab
   ------------------------------------------------------------------ */
.btn{
  border-radius:var(--radius-control);
  transition:transform .34s var(--ease-spring),box-shadow .3s var(--ease),background-color .3s var(--ease),filter .3s var(--ease);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.34),0 1px 1.5px rgba(15,23,42,.16),0 8px 18px -12px rgba(15,23,42,.5);
  background-image:linear-gradient(180deg,color-mix(in srgb,var(--brand) 92%,#fff),color-mix(in srgb,var(--brand) 88%,#000 6%));
}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:scale(.97)}

/* Nút phụ / nhẹ: kính trong */
.btn.light,.btn.neutral,.btn.plain,.chip,.pill,.seg,.folder-tabs>button,.date-btn,.theme-btn,.notif-btn,.icon-only{
  -webkit-backdrop-filter:var(--lg-blur-control);
  backdrop-filter:var(--lg-blur-control);
}
.btn.light,.btn.neutral,.btn.plain{
  background-color:transparent;
  background-image:linear-gradient(180deg,var(--lg-control-a),var(--lg-control-b));
  color:var(--ink);
  border:1px solid var(--lg-edge);
  box-shadow:var(--lg-control-rim),var(--lg-control-shadow);
  font-weight:600;
}
.btn.light:hover,.btn.neutral:hover,.btn.plain:hover{
  background-image:linear-gradient(180deg,var(--lg-control-hover-a),var(--lg-control-hover-b));
  filter:none;
  box-shadow:var(--lg-control-rim),0 8px 20px -12px rgba(15,23,42,.45);
}

/* Viên chip / pill */
.chip,.pill{
  background-color:transparent;
  background-image:linear-gradient(180deg,var(--lg-control-a),var(--lg-control-b));
  box-shadow:var(--lg-control-rim),0 1px 2px rgba(15,23,42,.05);
  border:1px solid var(--lg-edge);
  border-radius:999px;
}
.chip:hover{background-image:linear-gradient(180deg,var(--lg-control-hover-a),var(--lg-control-hover-b));color:var(--ink)}
.chip.on,.chip[aria-pressed="true"],.chip.selected{
  color:#fff;
  background-image:linear-gradient(180deg,color-mix(in srgb,var(--brand) 92%,#fff),var(--brand));
  border-color:transparent;
}
:root[data-theme="dark"] .chip.on,:root[data-theme="dark"] .chip[aria-pressed="true"],:root[data-theme="dark"] .chip.selected{color:#04121f}

/* Ô nhập: rãnh kính lõm, có vành sáng khi focus */
input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="color"]):not([type="file"]),
select,textarea{
  background-color:transparent;
  background-image:linear-gradient(180deg,color-mix(in srgb,var(--lg-inset) 88%,transparent),color-mix(in srgb,var(--lg-inset) 55%,transparent));
  box-shadow:var(--lg-inset-rim);
  border:1px solid var(--lg-edge);
  border-radius:var(--radius-control);
  transition:box-shadow .25s var(--ease),border-color .25s var(--ease),background-color .25s var(--ease);
}
input:focus,select:focus,textarea:focus{
  border-color:color-mix(in srgb,var(--brand) 55%,transparent);
  box-shadow:var(--lg-inset-rim),0 0 0 4px color-mix(in srgb,var(--brand) 18%,transparent);
  outline:none;
}
input[type="file"]{
  padding:7px 9px;
  font-size:.8125rem;
  color:var(--muted);
  cursor:pointer;
}
input[type="file"]::file-selector-button{
  margin-right:10px;
  border:0;
  padding:7px 13px;
  border-radius:10px;
  font:600 .78rem/1.2 var(--font-body);
  color:var(--ink);
  background-image:linear-gradient(180deg,var(--lg-control-hover-a),var(--lg-control-hover-b));
  box-shadow:var(--lg-control-rim),0 1px 2px rgba(15,23,42,.08);
  cursor:pointer;
  transition:transform .25s var(--ease-spring),filter .25s var(--ease);
}
input[type="file"]::file-selector-button:hover{filter:brightness(1.04)}
input[type="file"]::file-selector-button:active{transform:scale(.97)}
::selection{background:color-mix(in srgb,var(--brand) 26%,transparent)}

/* Thanh phân đoạn (segmented control kiểu iOS 26) */
.seg,.folder-tabs{
  border-radius:var(--radius-control)!important;
  background-color:transparent;
  background-image:linear-gradient(180deg,color-mix(in srgb,var(--lg-inset) 78%,transparent),color-mix(in srgb,var(--lg-inset) 46%,transparent));
  box-shadow:var(--lg-inset-rim);
  border:1px solid var(--lg-edge);
  padding:4px;
  gap:4px;
}
.seg>button,.folder-tabs>button,
.seg.seg-page>button,.seg.seg-page>button:first-child,.seg.seg-page>button:last-child,
.folder-tabs>button:first-child,.folder-tabs>button:last-child,.folder-tabs.split-2>b{
  border-radius:calc(var(--radius-control) - 5px)!important;
  border:0;
  background-color:transparent;
  color:var(--muted);
  font-weight:600;
  transition:background-color .28s var(--ease),color .28s var(--ease),box-shadow .28s var(--ease),transform .3s var(--ease-spring);
}
.seg>button[aria-selected="true"],.seg>button.on,.seg>button[aria-current="page"],
.folder-tabs>button[aria-selected="true"],.folder-tabs>button.on{
  background-image:linear-gradient(180deg,var(--lg-nav-active-a),var(--lg-nav-active-b));
  background-color:transparent;
  color:var(--ink);
  box-shadow:var(--lg-nav-active-rim);
}
.seg>button:hover,.folder-tabs>button:hover{color:var(--ink)}
.seg>button:active{transform:scale(.98)}
/* Trạng thái tab đang chọn: nền và viền thương hiệu nổi bật hơn */
.seg>button[aria-selected="true"],.seg>button.on,.seg>button[aria-current="page"],
.folder-tabs>button[aria-selected="true"],.folder-tabs>button.on,.folder-tabs>button[aria-current="page"]{
  background-color:color-mix(in srgb,var(--brand) 18%,var(--surface))!important;
  background-image:linear-gradient(180deg,color-mix(in srgb,var(--brand) 21%,var(--surface)),color-mix(in srgb,var(--brand) 13%,var(--surface)))!important;
  color:var(--brand-ink)!important;
  box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--brand) 72%,transparent),0 3px 10px color-mix(in srgb,var(--brand) 20%,transparent)!important;
  font-weight:750;
}

/* Thanh tiến trình: rãnh lõm + dải sáng */
.prog,.cdbar,.blitz-progress,.survival-progress,.race-track{background:var(--lg-inset);box-shadow:var(--lg-inset-rim)}
.prog>i,.prog>span,.prog-bar{box-shadow:inset 0 1px 0 rgba(255,255,255,.4);background-image:linear-gradient(180deg,color-mix(in srgb,var(--brand) 82%,#fff),var(--brand))}

/* Avatar + huy hiệu */
.avatar{background-image:linear-gradient(160deg,color-mix(in srgb,var(--brand) 16%,#fff),color-mix(in srgb,var(--brand) 8%,#fff));box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 1px 3px rgba(15,23,42,.12)}
:root[data-theme="dark"] .avatar{background-image:linear-gradient(160deg,rgba(255,255,255,.18),rgba(255,255,255,.06))}
.logo-mark{
  background-image:linear-gradient(150deg,#3b8bff 0%,#0a6fe0 42%,#12b3a0 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 0 0 1px rgba(255,255,255,.24),0 6px 16px -8px rgba(6,90,170,.65);
}

/* ---------------------------------------------------------------------
   6 · NGHIỆP VỤ · lớp học, thư mục, bài học, học sinh
   ------------------------------------------------------------------ */
.classcard{
  background-color:transparent;
  background-image:
    radial-gradient(260px circle at var(--lg-mx,50%) var(--lg-my,0%),var(--lg-spec-2),var(--lg-spec-3) 70%),
    linear-gradient(165deg,var(--lg-content-a),var(--lg-content-b));
  -webkit-backdrop-filter:var(--lg-blur-content);
  backdrop-filter:var(--lg-blur-content);
  box-shadow:var(--lg-content-rim),var(--lg-content-shadow);
  border:1px solid var(--lg-edge);
  border-radius:22px;
  transition:transform .45s var(--ease-spring),box-shadow .4s var(--ease);
}
.classcard:hover{transform:translateY(-3px);box-shadow:var(--lg-content-rim),0 18px 40px -22px rgba(15,23,42,.4)}
.classcard:active{transform:translateY(-1px) scale(.995)}
.classcard-create{
  background-image:none;
  background-color:color-mix(in srgb,var(--lg-inset) 50%,transparent);
  border:1.5px dashed color-mix(in srgb,var(--brand) 32%,var(--lg-edge));
  box-shadow:none;
  -webkit-backdrop-filter:none;backdrop-filter:none;
}
.classcard-create:hover{border-color:color-mix(in srgb,var(--brand) 60%,transparent);transform:translateY(-2px)}

/* Thư mục / chủ đề / bài học */
.topic-block,.lesson-workspace,.folder-wrap,.folder-tile,.folder-lesson-row,.student-lesson,.student-resource,.student-topic-lessons{
  background-color:transparent;
  background-image:linear-gradient(168deg,var(--lg-content-a),var(--lg-content-b));
  -webkit-backdrop-filter:var(--lg-blur-content);
  backdrop-filter:var(--lg-blur-content);
  box-shadow:var(--lg-content-rim),var(--lg-content-shadow);
  border:1px solid var(--lg-edge);
}
.folder-wrap{border-radius:var(--radius)}
.folder-tile{border-radius:20px}
.folder-lesson-row,.student-lesson,.student-resource{
  background-image:linear-gradient(180deg,color-mix(in srgb,var(--lg-control-a) 70%,transparent),color-mix(in srgb,var(--lg-control-b) 60%,transparent));
  box-shadow:var(--lg-control-rim);
  border-radius:16px;
  -webkit-backdrop-filter:none;backdrop-filter:none;
  transition:background-image .3s var(--ease),transform .35s var(--ease-spring),box-shadow .3s var(--ease);
}
.folder-lesson-row:hover,.student-lesson:hover,.student-resource:hover{
  background-image:linear-gradient(180deg,var(--lg-control-hover-a),var(--lg-control-hover-b));
  transform:translateX(2px);
}

/* Thẻ học sinh, bài tập, kết quả, gợi ý, lỗ hổng */
.student-task-card,.student-task-section-head,.student-result-card,.student-rec-card,.student-assignment-summary,.student-gap-page>.panel,.gap-focus-card,.gr-work-head,.gr-work,.ai-card,.asg-builder,.ab-sec,.ab-plan,.analysis-fold,.lesblk,.lesacts{
  background-color:transparent;
  background-image:
    radial-gradient(300px circle at var(--lg-mx,50%) var(--lg-my,0%),var(--lg-spec-2),var(--lg-spec-3) 70%),
    linear-gradient(168deg,var(--lg-content-a),var(--lg-content-b));
  -webkit-backdrop-filter:var(--lg-blur-content);
  backdrop-filter:var(--lg-blur-content);
  box-shadow:var(--lg-content-rim),var(--lg-content-shadow);
  border:1px solid var(--lg-edge);
  border-radius:22px;
}
.student-task-card{transition:transform .4s var(--ease-spring),box-shadow .35s var(--ease)}
.student-task-card:hover{transform:translateY(-2px);box-shadow:var(--lg-content-rim),0 18px 40px -24px rgba(15,23,42,.42)}
.student-rec-primary,.student-task-cta,.student-redo-cta,.gap-target-btn{box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 16px -10px rgba(15,23,42,.5)}
.student-rec-symbol,.student-task-type-icon,.topic-icon-btn{
  background-image:linear-gradient(160deg,color-mix(in srgb,var(--brand) 18%,#fff),color-mix(in srgb,var(--brand) 8%,#fff));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 3px rgba(15,23,42,.1);
}
:root[data-theme="dark"] .student-rec-symbol,:root[data-theme="dark"] .student-task-type-icon,:root[data-theme="dark"] .topic-icon-btn{background-image:linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,.06))}

/* Bảng chấm điểm: ô nhập gọn trong kính */
.grtab input[type="number"],.grtab input[type="text"]{background-color:color-mix(in srgb,var(--lg-inset) 60%,transparent)}

/* ---------------------------------------------------------------------
   7 · CHẤT LIỆU TRÒ CHƠI · race / blitz / survival
   ------------------------------------------------------------------ */
.race-game,.blitz-game,.survival-game,.survival-lobby,.survival-mode-card,.blitz-banner,.race-banner,.race-question,.race-arena,.survival-mission,.survival-zone,.game-choice-card{
  background-color:transparent;
  background-image:
    radial-gradient(420px circle at var(--lg-mx,50%) var(--lg-my,0%),var(--lg-spec-2),var(--lg-spec-3) 70%),
    linear-gradient(168deg,var(--lg-content-a),var(--lg-content-b));
  -webkit-backdrop-filter:var(--lg-blur-content);
  backdrop-filter:var(--lg-blur-content);
  box-shadow:var(--lg-content-rim),var(--lg-content-shadow);
  border:1px solid var(--lg-edge);
  border-radius:24px;
}
.survival-mode{
  background-image:
    radial-gradient(70% 120% at 20% -20%,color-mix(in srgb,#00c2b2 26%,transparent),transparent 62%),
    linear-gradient(168deg,var(--lg-content-a),var(--lg-content-b));
}
.survival-mode-card{transition:transform .42s var(--ease-spring),box-shadow .35s var(--ease)}
.survival-mode-card:hover{transform:translateY(-3px) scale(1.008)}
#main .race-next{
  background-image:linear-gradient(120deg,color-mix(in srgb,#2f7bff 92%,#fff),color-mix(in srgb,#7a4bff 88%,#fff))!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 24px -12px rgba(60,70,190,.7)!important;
  border-radius:var(--radius-control)!important;
}
#main .blitz-next{
  background-image:linear-gradient(120deg,#ff5f9e,#a03ca8)!important;
  color:#fff!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 24px -12px rgba(160,60,168,.7)!important;
}
#main .survival-primary{
  background-image:linear-gradient(120deg,#13c4a3,#0d8ecf)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 24px -12px rgba(6,115,105,.7)!important;
  border-radius:var(--radius-control)!important;
}
.race-option,.race-choice,.survival-radio,.blitz-feedback,.race-feedback{
  background-image:linear-gradient(180deg,var(--lg-control-a),var(--lg-control-b));
  border:1px solid var(--lg-edge);
  box-shadow:var(--lg-control-rim);
  border-radius:16px;
  transition:transform .3s var(--ease-spring),box-shadow .3s var(--ease),background-image .3s var(--ease);
}
.race-option:hover,.race-choice:hover,.survival-radio:hover{transform:translateY(-1px);background-image:linear-gradient(180deg,var(--lg-control-hover-a),var(--lg-control-hover-b))}

/* ---------------------------------------------------------------------
   8 · ĐĂNG NHẬP · giữ nguyên ảnh nền người dùng, thêm ánh sáng thuỷ tinh
   ------------------------------------------------------------------ */
.login-wrap{background-color:transparent;overflow:hidden}
/* Đăng nhập: quầng sáng đậm hơn để tấm kính có chất liệu */
.login-wrap::after{
  content:"";position:absolute;inset:-12vmax;z-index:-1;pointer-events:none;
  background-image:
    radial-gradient(40% 46% at 16% 6%,var(--lg-aurora-1),transparent 62%),
    radial-gradient(36% 42% at 86% 14%,var(--lg-aurora-2),transparent 60%),
    radial-gradient(42% 46% at 76% 88%,var(--lg-aurora-3),transparent 64%),
    radial-gradient(32% 36% at 18% 84%,var(--lg-aurora-4),transparent 60%),
    radial-gradient(28% 30% at 52% 48%,var(--lg-aurora-5),transparent 68%);
  filter:url(#lg-refract) saturate(118%);
  opacity:.9;
}
.login{
  background-image:
    radial-gradient(420px circle at var(--lg-mx,50%) var(--lg-my,0%),rgba(255,255,255,.7),rgba(255,255,255,0) 66%),
    linear-gradient(168deg,rgba(255,255,255,.66),rgba(255,255,255,.44));
  background-color:rgba(255,255,255,.22);
  border:1px solid rgba(255,255,255,.6);
  -webkit-backdrop-filter:var(--lg-blur-sheet);
  backdrop-filter:var(--lg-blur-sheet);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 0 0 1px rgba(255,255,255,.4),0 2px 8px rgba(15,23,42,.06),0 40px 90px -36px rgba(15,23,42,.42);
  border-radius:32px;
}
.login.login-dark{
  background-image:
    radial-gradient(420px circle at var(--lg-mx,50%) var(--lg-my,0%),rgba(255,255,255,.16),rgba(255,255,255,0) 66%),
    linear-gradient(168deg,rgba(34,36,44,.86),rgba(18,20,26,.76));
  background-color:rgba(18,20,26,.4);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 0 1px rgba(255,255,255,.06),0 40px 90px -30px rgba(0,0,0,.85);
}
.login .btn.light{background-image:linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,.44))}
.login.login-dark .btn.light{background-image:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.07))}
.login-bg-trigger,.login-theme-toggle{
  background-image:linear-gradient(180deg,var(--lg-chrome-a),var(--lg-chrome-b));
  background-color:transparent;
  border:1px solid var(--lg-edge);
  -webkit-backdrop-filter:var(--lg-blur-chrome);
  backdrop-filter:var(--lg-blur-chrome);
  box-shadow:var(--lg-chrome-rim),var(--lg-chrome-shadow);
}
.login-bg-panel{
  background-image:linear-gradient(180deg,var(--lg-chrome-a),var(--lg-chrome-b))!important;
  background-color:transparent!important;
  -webkit-backdrop-filter:var(--lg-blur-sheet)!important;
  backdrop-filter:var(--lg-blur-sheet)!important;
  border:1px solid var(--lg-edge);
  box-shadow:var(--lg-chrome-rim),var(--lg-chrome-shadow);
  border-radius:24px;
}
.login-quick-actions>.btn{
  background-image:linear-gradient(180deg,var(--lg-control-a),var(--lg-control-b));
  color:var(--ink);
  border:1px solid var(--lg-edge);
  box-shadow:var(--lg-control-rim),var(--lg-control-shadow);
}
.login .notice,.notice{backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%);border:1px solid var(--lg-edge)}

/* ---------------------------------------------------------------------
   9 · TINH CHỈNH CHUNG
   ------------------------------------------------------------------ */
h1,h2,h3{letter-spacing:-.022em}
.muted,.side-note{color:var(--muted)}
code,.codebadge,.obj-code,.gap-focus-code{background:var(--lg-inset);box-shadow:var(--lg-inset-rim);border-radius:9px}
hr{border:0;height:1px;background:var(--line)}
.side-note{font-size:.75rem;line-height:1.4;opacity:.9}
.dot,.cc-dot{box-shadow:0 0 0 2px color-mix(in srgb,var(--surface) 60%,transparent)}
.badge,.cnt,.nb{backdrop-filter:blur(10px)}

/* Chuyển trang mềm, không khóa thao tác */
.view.enter{animation:lgEnter .44s var(--ease) both}
@keyframes lgEnter{from{opacity:0;transform:translateY(8px) scale(.997)}to{opacity:1;transform:none}}
.ov.enter .dlg{animation:lgSheet .42s var(--ease-spring) both}
@keyframes lgSheet{from{opacity:0;transform:translateY(14px) scale(.975)}to{opacity:1;transform:none}}

/* Vòng focus quang học */
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 62%,transparent);outline-offset:2px}

/* ---------------------------------------------------------------------
   10 · KHẢ NĂNG TIẾP CẬN & TÙY CHỌN HỆ THỐNG
   ------------------------------------------------------------------ */
@media (prefers-reduced-transparency:reduce){
  body::before{display:none}
  html::after{display:none}
  .top,.layout>.side,.card,.panel,.tablewrap,.dlg,.btn.light,.chip,.pill,.seg,.selectbox,.classcard,
  .student-task-card,.race-game,.blitz-game,.survival-game,.login{
    -webkit-backdrop-filter:none!important;backdrop-filter:none!important;
    background-image:none!important;
    background-color:var(--surface)!important;
  }
  .top,.layout>.side{background-color:var(--surface)!important;color:var(--ink)}
  .layout>.side .items .nav{color:var(--ink)!important}
  .layout>.side .items .nav .ic{color:var(--muted)!important}
  .layout>.side .grp h2{color:var(--muted)!important}
  .layout>.side .items .nav[aria-current="page"]{background-color:var(--brand-soft)!important;color:var(--brand-ink)!important;box-shadow:inset 0 0 0 1px var(--line-strong)!important}
  .layout>.side .items .nav[aria-current="page"] .ic{color:var(--brand-ink)!important}
}
@media (prefers-contrast:more){
  :root{--line:rgba(0,0,0,.3);--line-strong:rgba(0,0,0,.55);--lg-edge:rgba(0,0,0,.42);--muted:#3a3a3d}
  :root[data-theme="dark"]{--line:rgba(255,255,255,.4);--line-strong:rgba(255,255,255,.7);--lg-edge:rgba(255,255,255,.45);--muted:#d2d2d7}
  .card,.panel,.tablewrap,.dlg,.top,.layout>.side,.btn.light,.chip,.pill,.seg,.selectbox,.classcard{background-color:color-mix(in srgb,var(--surface) 88%,transparent)}
  .top,.layout>.side{border:1.5px solid var(--lg-edge)}
  body::before{opacity:.35}
}
@media (prefers-reduced-motion:reduce){
  body::before{animation:none}
  .view.enter,.ov.enter .dlg{animation:none}
  .classcard:hover,.student-task-card:hover,.survival-mode-card:hover{transform:none}
  .folder-lesson-row:hover,.student-lesson:hover,.student-resource:hover{transform:none}
}
@media (forced-colors:active){
  .card,.panel,.tablewrap,.dlg,.top,.layout>.side,.btn,.chip,.pill,.seg,.selectbox,.classcard{
    background:Canvas!important;color:CanvasText!important;border:1px solid CanvasText!important;box-shadow:none!important;backdrop-filter:none!important;
  }
}
@media print{
  body::before,html::after,.top,.layout>.side,.side-toggle{display:none!important}
  .card,.panel,.tablewrap,.dlg{background:#fff!important;box-shadow:none!important;backdrop-filter:none!important}
}

/* ---------------------------------------------------------------------
   11 · THIẾT BỊ NHỎ
   ------------------------------------------------------------------ */
@media(max-width:900px){
  #main .head{padding:14px 16px!important;border-radius:20px;flex-wrap:wrap}
  #main .head h1{font-size:1.4rem}
  .ov.enter .dlg{border-radius:28px!important}
  .dlg{border-radius:28px!important}
}
@media(max-width:620px){
  :root{--radius:22px;--radius-control:14px}
  .card,.panel{padding:16px;border-radius:20px}
  .classcard,.student-task-card,.student-rec-card{border-radius:18px}
  #main .head .selectbox.class-select{width:100%;max-width:none}
}

/* Responsive navigation: expanded = labelled grid; collapsed = compact icon rail. Both remain inside one framed nav.side. */

  #app>.layout,#app>.layout.sidebar-collapsed{
    position:relative!important;display:grid!important;grid-template-columns:minmax(0,1fr)!important;
    grid-template-areas:"nav" "content"!important;grid-template-rows:auto 1fr!important;
    width:100%!important;max-width:none!important;gap:0!important;padding:0!important
  }
  #app .layout>.side{
    grid-area:nav!important;position:relative!important;top:auto!important;left:auto!important;right:auto!important;bottom:auto!important;transform:none!important;
    display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;grid-auto-flow:row!important;align-items:stretch!important;justify-items:stretch!important;
    gap:5px!important;width:100%!important;max-width:none!important;height:auto!important;min-height:0!important;max-height:none!important;
    margin:8px 0 12px!important;padding:10px 88px 10px 10px!important;overflow:hidden!important;
    border:1px solid rgba(255,255,255,.16)!important;border-radius:0!important;background:#20365d!important;color:#f5f7ff!important;
    box-shadow:0 8px 24px -14px rgba(5,12,28,.5),inset 0 1px 0 rgba(255,255,255,.1)!important;
    -webkit-backdrop-filter:blur(18px) saturate(150%)!important;backdrop-filter:blur(18px) saturate(150%)!important
  }
  #app .layout>.side>.grp,#app .layout>.side>.grp>.items,
  #app .layout>.side .grp,#app .layout>.side .items{display:contents!important;flex:none!important;width:auto!important;min-width:0!important}
  #app .layout>.side .grp h2,#app .layout>.side .side-note{display:none!important}
  #app .layout:not(.sidebar-collapsed)>.side .nav span{display:block!important}
  #app .layout>.side .nav{
    display:flex!important;flex:initial!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;
    width:100%!important;min-width:0!important;max-width:none!important;height:auto!important;min-height:74px!important;margin:0!important;padding:7px 3px!important;gap:5px!important;
    border-radius:14px!important;color:rgba(245,247,255,.84)!important;text-align:center!important;white-space:normal!important;font-size:clamp(9px,2vw,12px)!important;line-height:1.2!important
  }
  #app .layout>.side .nav span{display:block!important;max-width:100%!important;white-space:normal!important;overflow-wrap:anywhere!important}
  #app .layout>.side .nav .ic{width:20px!important;height:20px!important;flex:none!important;color:inherit!important}
  #app .layout>.side .nav[aria-current="page"]{background:rgba(255,255,255,.19)!important;color:#fff!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)!important}
  #app .layout.sidebar-collapsed>.side{
    display:flex!important;flex-direction:row!important;flex-wrap:nowrap!important;align-items:center!important;justify-content:flex-start!important;
    gap:4px!important;height:76px!important;min-height:76px!important;max-height:76px!important;padding:8px 76px 8px 10px!important
  }
  #app .layout.sidebar-collapsed>.side .nav{
    display:flex!important;flex:1 1 48px!important;width:auto!important;min-width:20px!important;max-width:58px!important;height:54px!important;min-height:54px!important;padding:0!important;gap:0!important;border-radius:14px!important
  }
  #app .layout.sidebar-collapsed>.side .nav span{display:none!important}
  #app .layout.sidebar-collapsed>.side .nav .ic{width:20px!important;height:20px!important}
  #app .layout>.side-toggle{
    grid-area:nav!important;display:grid!important;position:relative!important;top:auto!important;right:auto!important;bottom:auto!important;left:auto!important;
    justify-self:end!important;align-self:center!important;z-index:2147483647!important;width:48px!important;height:48px!important;min-height:48px!important;margin:0 12px 0 0!important;
    border-radius:15px!important;background:#1d1d1f!important;color:#fff!important;border:1px solid rgba(255,255,255,.14)!important;
    box-shadow:0 4px 14px rgba(0,0,0,.28)!important;transform:none!important
  }
  #app .layout>.main{grid-area:content!important;grid-column:1!important;grid-row:2!important;min-width:0!important;padding:0 12px 16px!important}
}
@media(max-width:380px){
  #app .layout>.side{padding-right:66px!important}
  #app .layout.sidebar-collapsed>.side{padding-right:66px!important;gap:2px!important}
  #app .layout.sidebar-collapsed>.side .nav{min-width:18px!important}
  #app .layout.sidebar-collapsed>.side .nav .ic{width:17px!important;height:17px!important}

/* System-wide button feedback: clearer hover, press and keyboard-focus states. */
button:not(:disabled),.btn:not([disabled]),[role="button"]:not([aria-disabled="true"]){
  cursor:pointer;
  transition:transform .16s cubic-bezier(.2,.8,.2,1),filter .16s ease,box-shadow .16s ease,background-color .16s ease,color .16s ease,border-color .16s ease;
}
button:not(:disabled):hover,.btn:not([disabled]):hover,[role="button"]:not([aria-disabled="true"]):hover{
  filter:brightness(1.1) saturate(1.12);
  transform:translateY(-1px);
}
button:not(:disabled):active,.btn:not([disabled]):active,[role="button"]:not([aria-disabled="true"]):active{
  filter:brightness(.94) saturate(1.12);
  transform:scale(.96);
  transition-duration:.07s;
}
button:focus-visible,.btn:focus-visible,[role="button"]:focus-visible{
  outline:3px solid color-mix(in srgb,var(--brand) 78%,#fff);
  outline-offset:2px;
  z-index:2;
}
button:disabled,.btn[disabled],[role="button"][aria-disabled="true"]{cursor:not-allowed;filter:saturate(.55)}
@media(prefers-reduced-motion:reduce){
  button:not(:disabled),.btn:not([disabled]),[role="button"]:not([aria-disabled="true"]){transition:none!important}
  button:not(:disabled):hover,.btn:not([disabled]):hover,[role="button"]:not([aria-disabled="true"]):hover,
  button:not(:disabled):active,.btn:not([disabled]):active,[role="button"]:not([aria-disabled="true"]):active{transform:none!important}
}
/* Mobile navigation follows the active theme: clear dark-on-light or light-on-dark contrast. */
@media(max-width:900px){

function recalcPair(s,j){

  e.forEach(x=>{const k=Math.pow(.5,(today-x.day)/HL);w+=k*x.s;t+=k});

  if(m==null)return;
  if(g.status==='OPEN'){if(m>=T_CLOSE){g.status='RESOLVED';g.at=today}}
  else if(m<T_OPEN&&e.length>=2&&!(g.status==='DISMISSED'&&evSig(e)===g.sig)){g.status='OPEN';g.reason='Mức nắm vững '+pct(m)+'% với '+e.length+' bằng chứng'}
}

  recalcClass(c);a.graded=a.subs.filter(x=>x.score!=null).length;

/* Dữ liệu minh họa: sinh chi tiết trả lời từng câu (qa) khớp với điểm đã có, để chấm lại và phân tích hoạt động thật */
function seedQA(c,a,b,si){
  const p=b.score!=null?Math.max(.2,Math.min(.95,b.score/a.max)):((si*29+7)%10)/14+.3;
  const qa=(a.qs||[]).map((x,i)=>{
    const q=qOf(c,x.qid),w=x.w||1,okk=((si*31+i*17+7)%10)/10<p;let v,txt;
    if(q&&isObj(q)){
      if(q.type==='MULTIPLE_CHOICE'){v=okk?q.ans.slice():q.ans.slice(0,Math.max(1,q.ans.length-1));txt=v.map(m=>q.opts[m]).join('; ')}
      else if(q.opts.length===2){v=okk?q.ans:1-q.ans;txt=q.opts[v]}
      else{v=okk?q.ans:(q.ans+1+((si+i)%Math.max(1,q.opts.length-1)))%q.opts.length;txt=q.opts[v]}
      return {q:q.content,t:q.type,a:txt,w,objs:(q.objs||[]).slice(),got:autoScore(q,w,v),fb:'',ok:autoScore(q,1,v)===1};
    }
    txt=okk?'Em trình bày: '+(c.goals[(q&&q.objs[0])||0]||'nội dung bài học')+' là nội dung trọng tâm, kèm ví dụ minh họa cụ thể.':'Em chưa nhớ rõ nội dung này nên trình bày còn thiếu ý.';
    return {q:q.content,t:q.type,a:txt,w,objs:(q.objs||[]).slice(),got:null,fb:'',ok:null};
  });
  if(b.score!=null){
    let sum=Math.round(qa.reduce((t,x)=>t+(x.got||0),0)*10)/10;
    const E=qa.filter(x=>x.got==null);
    if(E.length){
      let rem=Math.round((b.score-sum)*10)/10;
      E.forEach((x,k)=>{const g=k===E.length-1?rem:Math.max(0,Math.min(x.w,Math.round(rem/E.length*10)/10));x.got=Math.max(0,Math.min(x.w,Math.round(g*10)/10));x.ok=x.got===x.w;rem=Math.round((rem-x.got)*10)/10});
      if(Math.abs(rem)>1e-9){const x=E[E.length-1];x.got=Math.max(0,Math.min(x.w,Math.round((x.got+rem)*10)/10));x.ok=x.got===x.w}
    }else{
      let diff=Math.round((b.score-sum)*10)/10;
      for(const x of qa){if(!diff)break;const ng=Math.max(0,Math.min(x.w,Math.round((x.got+diff)*10)/10)),d=Math.round((ng-x.got)*10)/10;if(d){x.got=ng;x.ok=ng===x.w;diff=Math.round((diff-d)*10)/10}}
    }
  }
  return qa;
}

  const step=e.key==='ArrowLeft'?-1:e.key==='ArrowRight'?1:e.key==='ArrowUp'?-7:e.key==='ArrowDown'?7:0;
  if(!step)return;

function datePopPlace(){
  if(!datePop||!datePop.el)return;
  const txt=document.getElementById(datePop.inputId);
  if(!txt||!document.body.contains(txt)){datePopClose();return}
  const r=txt.getBoundingClientRect(),el=datePop.el;
  const w=el.offsetWidth||272,h=el.offsetHeight||300,pad=8;
  const box=(txt.closest('.datebox')||txt).getBoundingClientRect();
  let left=Math.min(Math.max(pad,box.right-w),Math.max(pad,window.innerWidth-w-pad));
  let top=box.bottom+6;
  if(top+h>window.innerHeight-pad)top=Math.max(pad,box.top-h-6);
  el.style.left=Math.round(left)+'px';el.style.top=Math.round(top)+'px';
}

function editAsg(i){
  const c=selected(),a=c.assignments[i],used=Math.max(0,...a.subs.map(b=>(b.tries||(b.has?1:0))-(b.extra||0)));
  openDlg({title:'Sửa bài tập',text:asgIsQ(a)?'Nội dung câu hỏi của bài tập không sửa ở đây: hãy dùng nút “Soạn câu hỏi” để chọn câu từ Ngân hàng câu hỏi hoặc nhập từ tệp. Ô bên dưới chỉ là lời dặn thêm cho học sinh.':'',fields:[{k:'n',label:'Tiêu đề',val:a.name},{k:'d',label:asgIsQ(a)?'Lời dặn thêm cho học sinh (không bắt buộc — đề bài được dựng từ các câu hỏi đã chọn)':'Đề bài (bắt buộc: nêu rõ yêu cầu và sản phẩm cần nộp)',val:a.desc,area:true},{k:'due',label:'Hạn nộp (dd/mm/yyyy)',val:a.due},{k:'m',label:'Điểm tối đa'+(a.graded?' (đã khóa vì có bài được chấm)':''),val:a.max},{k:'t',label:'Số lần làm tối đa'+(used?' (không thấp hơn '+used+', số lượt học sinh đã dùng)':''),val:a.maxTries==null?'':a.maxTries}],ok:v=>{
    const m=parseFloat(String(v.m).replace(',','.'));
    if(!v.n.trim())return 'Bài tập phải có tiêu đề.';
    if(!asgIsQ(a)&&!v.d.trim())return 'Loại nộp tệp cần có đề bài để học sinh biết phải làm gì.';
    if(!/^\d{2}\/\d{2}\/\d{4}$/.test(v.due.trim()))return 'Hạn nộp cần đúng dạng dd/mm/yyyy.';
    if(!(m>0)&&!asgIsQ(a))return 'Điểm tối đa phải lớn hơn 0.';
    if(asgIsQ(a)&&m!==a.max)return 'Điểm tối đa của bộ câu hỏi tự cộng từ điểm từng câu; hãy chỉnh điểm ở mục Soạn câu hỏi.';
    {const tr=String(v.t).trim();if(!/^\d+$/.test(tr)||+tr<1)return 'Số lần làm tối đa phải là số nguyên từ 1 trở lên.';if(+tr<used)return 'Không đặt thấp hơn số lượt học sinh đã dùng ('+used+' lượt).'}
    if(m!==a.max&&a.graded)return 'Không đổi được điểm tối đa: bài tập đã có bài được chấm, đổi sẽ làm lệch bằng chứng học tập.';
    a.name=v.n.trim();a.desc=v.d.trim();a.due=v.due.trim();if(!asgIsQ(a))a.max=m;a.maxTries=parseInt(v.t,10);a.upd=stamp();toast('Đã lưu bài tập');return null}});
}

function editQuiz(){
  const c=selected(),q=c.quiz,used=Math.max(...c.students.map(s=>s.att.used));
  openDlg({title:'Sửa bài kiểm tra',text:'Lượt đang làm giữ hạn đã chốt lúc bắt đầu, nên rút ngắn thời lượng chỉ ảnh hưởng các lượt bắt đầu sau đó.',fields:[{k:'n',label:'Tiêu đề',val:q.name},{k:'d',label:'Thời lượng (phút)',val:q.dur},{k:'a',label:'Số lần làm tối đa (không thấp hơn '+used+')',val:c.maxAtt}],ok:v=>{
    const d=parseInt(v.d,10),a=parseInt(v.a,10);
    if(!v.n.trim())return 'Bài tập phải có tiêu đề.';
    if(!(d>0))return 'Thời lượng phải lớn hơn 0.';
    if(!(a>=1))return 'Số lần làm tối đa phải từ 1 trở lên.';
    if(a<used)return 'Không đặt thấp hơn số lượt đã làm của học sinh ('+used+' lượt).';
    const shorter=d<q.dur;q.name=v.n.trim();q.dur=d;c.maxAtt=a;q.upd=stamp();
    toast(shorter?'Đã lưu. Lượt đang làm giữ hạn đã chốt, thời lượng mới áp dụng cho lượt sau.':'Đã lưu bài kiểm tra');return null}});
}

function startAssignmentGame(ai,mode,game){
  const c=selected(),s=me(),a=c.assignments[ai],b=a.subs[c.students.indexOf(s)];
  if(!a||!asgIsQ(a)||!['classic','race','survival','blitz'].includes(game)){toast('Không mở được trò chơi này cho bài tập.');return}
  gameLaunch=null;survivalResult=null;
  if(game==='survival'&&mode==='multi'){gameLobby={type:'asg',ai,status:'idle',players:[],selected:[]};render();scanSurvivalPlayers();return}
  gameLobby=null;
  if(!b.redo)b.redo={qs:rdBuild(c,a),ans:{},miss:[],presentation:game,playMode:'solo',gameIndex:0,hp:3,feedback:{}};
  else{b.redo.presentation=game;b.redo.gameIndex=0;b.redo.miss=[];if(game==='survival'){b.redo.playMode='solo';b.redo.hp=Number.isFinite(b.redo.hp)?b.redo.hp:3;b.redo.feedback=b.redo.feedback||{}}}
  workOpen(ai,game);
}
function startSurvivalAssignment(ai,mode){return startAssignmentGame(ai,mode,'survival')}
function openSurvivalLobby(ai){gameLaunch=null;gameLobby={type:'asg',ai,status:'idle',players:[],selected:[]};render();scanSurvivalPlayers()}
async function scanSurvivalPlayers(){
  const L=gameLobby;if(!L||L.status==='loading')return;
  const api=window.EducMindRealtime;
  if(!api||typeof api.listOnlineStudents!=='function'){L.status='unavailable';render();return}
  L.status='loading';L.error='';render();
  try{const c=selected(),s=me(),rows=await api.listOnlineStudents({classId:c.id,excludeEmail:s.email});
    if(gameLobby!==L)return;L.players=(Array.isArray(rows)?rows:[]).filter(x=>x&&x.email!==s.email);L.selected=[];L.status='ready';
  }catch(e){if(gameLobby!==L)return;L.error=e&&e.message||'Không tải được danh sách người đang online.';L.status='error'}
  render();
}
function toggleSurvivalPlayer(email,on){if(!gameLobby)return;const a=gameLobby.selected||[];gameLobby.selected=on?(a.includes(email)?a:a.concat(email)):a.filter(x=>x!==email);render()}
async function inviteSurvivalPlayers(){
  if(!gameLobby||!gameLobby.selected.length){toast('Chọn ít nhất một bạn đang online.');return}
  const api=window.EducMindRealtime;
  if(!api||typeof api.createSurvivalRoom!=='function'){gameLobby.status='unavailable';render();return}
  const c=selected(),s=me(),a=c.assignments[gameLobby.ai];gameLobby.status='sending';render();
  try{gameLobby.room=await api.createSurvivalRoom({classId:c.id,assignmentId:a.aid,hostEmail:s.email,opponentEmails:gameLobby.selected});gameLobby.status='waiting'}
  catch(e){gameLobby.error=e&&e.message||'Không gửi được lời mời.';gameLobby.status='error'}render();
}

function submitWork(ai,ed){
  const c=selected(),s=me(),a=c.assignments[ai],b=a.subs[c.students.indexOf(s)];
  openDlg({title:(ed?'Chỉnh sửa bài nộp: ':'Nộp bài: ')+esc(a.name),text:'Nhập bài làm bằng văn bản, đính kèm một tệp (tối đa 50 MB) hoặc dùng cả hai.',okLabel:ed?'Lưu chỉnh sửa':'Nộp bài',fields:[{k:'t',label:'Bài làm',val:b.text||'',area:true},{k:'f',label:'Tệp đính kèm'+(ed&&b.file?' (hiện có: '+esc(b.file)+')':''),file:true}],ok:v=>{
    const t=v.t.trim(),f=v.f_f;
    if(f){if(f.size>52428800)return 'Tệp vượt giới hạn 50 MB.';const ext=f.name.split('.').pop().toLowerCase();if(!ALLOWED.includes(ext))return 'Định dạng .'+ext+' không được phép.'}
    if(!t&&!f&&!(ed&&b.file))return 'Không thể nộp bài trống: hãy nhập bài làm hoặc đính kèm tệp.';
    if(!inWin(a))return 'Đã quá thời hạn nộp bài.';
    const recKeys=recKeysForTarget(c,s,'assignment',ai);
    b.status=simNow()<=dueMs(a)?'SUBMITTED':'LATE';b.text=t;if(f)b.file=f.name;if(ed)b.edited=true;b.has=true;a.submitted=a.subs.filter(x=>x.has).length;markRecKeys(s,recKeys,'assignment-completed');
    toast(b.status==='LATE'?'Đã nộp, tính là nộp trễ.':ed?'Đã lưu chỉnh sửa.':'Đã nộp bài đúng hạn.');return null}});
}
function delWork(ai){
  const c=selected(),s=me(),a=c.assignments[ai],b=a.subs[c.students.indexOf(s)];
  openDlg({title:'Xóa bài nộp?',text:'Em có thể nộp lại nếu còn trong thời hạn. Tệp đính kèm cũ không còn gắn với bài nộp.',danger:true,okLabel:'Xóa bài nộp',ok:()=>{
    if(b.score!=null)return 'Bài đã được chấm, không thể xóa.';
    if(!inWin(a))return 'Đã quá thời hạn, không thể xóa bài nộp.';
    b.has=false;b.text='';b.file=null;b.edited=false;a.submitted=a.subs.filter(x=>x.has).length;toast('Đã xóa bài nộp. Em có thể nộp lại.');return null}});
}
/* S03: làm bài kiểm tra trực tuyến (câu hỏi mẫu sinh từ mục tiêu) */
const QOPT=['Mô tả đúng nội dung mục tiêu','Chỉ đúng một phần','Không liên quan đến mục tiêu'];
const qs=c=>c.qs||(c.qs=c.goals.map((g,j)=>({text:'Phát biểu nào đúng nhất về mục tiêu “'+g+'”?',ans:j%3,w:2,objs:[j]})).concat([{text:'Tình huống tổng hợp: vận dụng đồng thời hai mục tiêu đầu của lớp.',ans:1,w:2,objs:[0,1]}]));
const optsOf=q=>{const o=[];for(let k=0;k<3;k++)o[(k+q.ans)%3]=QOPT[k];return o};
function gradeAttempt(c,s){
  const cur=s.att.cur,Q=qs(c),al={};let tot=0,max=0;
  Q.forEach((q,qi)=>{const got=cur.a[qi]===q.ans?q.w:0;tot+=got;max+=q.w;q.objs.forEach(j=>{const x=al[j]||(al[j]=[0,0]);x[0]+=got/q.objs.length;x[1]+=q.w/q.objs.length})});
  const r=tot/max,before=s.mastery.slice();s.att.used++;s.att.last=r;s.att.cur=null;s.att.best=Math.max(s.att.best||0,r);
  if(s.att.real==null||r>s.att.real){s.att.real=r;Object.keys(al).forEach(k=>{const j=+k,sc=al[k][0]/al[k][1],e=s.ev[j].find(x=>x.key==='Q');if(e){e.s=sc;e.day=today}else s.ev[j].push({s:sc,day:today,src:'Bài tập',key:'Q'});recalcPair(s,j)})}
  recalcClass(c);
  LOG.unshift('Bài tập của '+s.name+' ('+c.id+') lượt '+s.att.used+': '+pct(r)+'%; mục tiêu: '+Object.keys(al).map(k=>pct(before[k])+'%→'+pct(s.mastery[k])+'%').join(', '));
  return r;
}
function raceTrackHtml(done,total,step){
  const pct=total?Math.round(done/total*100):0,pos=50-pct*.42,span=pct*.42;
  return `<div class='race-arena' role='img' aria-label='Tiến độ kéo co: đội em đã hoàn thành ${done} trên ${total} câu'>
    <div class='race-team-card race-home'><span class='race-team-emoji'>🧑‍🤝‍🧑</span><span class='race-team-name'>ĐỘI EM</span><b class='race-team-count' id='race-home-count'>${done}</b><small>câu đã kéo</small></div>
    <div class='race-tug-zone'><div class='race-road'><span class='race-center-mark'></span><span class='race-fill' id='race-fill' style='left:${pos}%;width:${span}%'></span><span class='race-runner' id='race-runner' style='left:${pos}%' aria-label='Nút dây'>🪢</span></div><div class='race-team-labels'><span>← Kéo về phía đội em</span><span>Đội thử thách →</span></div></div>
    <div class='race-team-card race-rival'><span class='race-team-emoji'>👾</span><span class='race-team-name'>ĐỘI THỬ THÁCH</span><b class='race-team-count' id='race-rival-count'>${total-done}</b><small>câu còn lại</small></div>
  </div><div class='race-track-meta'><span id='race-count'>Chặng ${Math.min(step+1,total)}/${total} · ${done}/${total} câu đã trả lời</span><b id='race-pct'>${pct}%</b></div>`;
}
function raceSync(done,total,step){
  const p=total?Math.round(done/total*100):0,pos=50-p*.42,span=p*.42,fill=document.getElementById('race-fill'),runner=document.getElementById('race-runner'),count=document.getElementById('race-count'),pct=document.getElementById('race-pct'),home=document.getElementById('race-home-count'),rival=document.getElementById('race-rival-count');
  if(fill){fill.style.left=pos+'%';fill.style.width=span+'%'}if(runner)runner.style.left=pos+'%';if(count)count.textContent='Chặng '+Math.min(step+1,total)+'/'+total+' · '+done+'/'+total+' câu đã trả lời';if(pct)pct.textContent=p+'%';if(home)home.textContent=done;if(rival)rival.textContent=Math.max(0,total-done);
}
function raceHint(type){return type==='MULTIPLE_CHOICE'?'Chọn tất cả phương án phù hợp':type==='SHORT_ANSWER'?'Nhập câu trả lời ngắn':type==='ESSAY'?'Viết câu trả lời của em':'Chạm vào một đáp án để chọn'}
function raceAnswerState(q,v){
  if(!q)return 'Hãy chọn câu trả lời để kéo dây.';
  if(q.type==='MULTIPLE_CHOICE'){const n=Array.isArray(v)?v.length:0;return n?n+' phương án đã chọn':'Chưa chọn phương án nào'}
  if(q.type==='SHORT_ANSWER'||q.type==='ESSAY')return String(v||'').trim()?'Đã nhập câu trả lời':'Chưa nhập câu trả lời';
  return v==null?'Chưa chọn đáp án':'Đã chọn một đáp án';
}
function raceSetStatus(text){const el=document.getElementById('race-answer-status');if(el)el.textContent=text}
function raceOptions(opts,value,multi,qi,handler,disabled){
  return `<div class='race-options'>${opts.map((o,oi)=>{const on=multi?(Array.isArray(value)&&value.includes(oi)):value===oi;return `<button type='button' class='race-choice ${on?'selected':''}' data-choice='${oi%4}' ${disabled?'disabled':''} aria-pressed='${on}' onclick='${handler}(${qi},${oi})'><span class='race-key'>${String.fromCharCode(65+oi)}</span><span class='race-option-text'>${esc(o)}</span><span class='race-check' aria-hidden='true'>${on?'✓':'+'}</span></button>`}).join('')}</div>`;
}
function quizRaceSet(qi,v){const s=me();setAns(qi,v);const c=selected(),Q=c.quiz.qs,done=Q.filter(x=>quizHasAnswer(qOf(c,x.qid),s.att.cur.ans[x.qid])).length;raceSync(done,Q.length,s.att.cur.gameIndex||0);raceSetStatus(raceAnswerState(qOf(c,Q[qi].qid),v))}
function quizRaceToggle(qi,oi){const s=me(),c=selected(),id=c.quiz.qs[qi].qid,r=s.att.cur.ans[id]||[];s.att.cur.ans[id]=r.includes(oi)?r.filter(x=>x!==oi):r.concat([oi]);render()}
function quizRaceChoose(qi,oi){quizRaceSet(qi,oi);render()}
function quizHasAnswer(q,v){if(!q)return false;if(q.type==='MULTIPLE_CHOICE')return Array.isArray(v)&&v.length>0;if(q.type==='SHORT_ANSWER'||q.type==='ESSAY')return typeof v==='string'&&v.trim()!=='';return v!==undefined&&v!==null}
function quizRaceMove(dir){const s=me(),c=selected(),att=s.att.cur,Q=c.quiz.qs;if(!att)return;const i=att.gameIndex||0;
  if(dir<0){att.gameIndex=Math.max(0,i-1);render();return}
  const q=qOf(c,Q[i].qid);if(!quizHasAnswer(q,att.ans[Q[i].qid])){toast('Hãy trả lời câu này trước khi tiếp tục.');return}
  if(i>=Q.length-1){finishQuiz();return}att.gameIndex=i+1;render();
}
function quizRaceHtml(c,q,att){
  const Q=q.qs,total=Q.length;if(!total)return `<section class='panel'><h2>${esc(q.name)}</h2><div class='empty'>Bài chưa có câu hỏi.</div></section>`;
  if(!Number.isInteger(att.gameIndex))att.gameIndex=0;att.gameIndex=Math.max(0,Math.min(total-1,att.gameIndex));
  const qi=att.gameIndex,x=Q[qi],qq=qOf(c,x.qid),v=att.ans[x.qid],done=Q.filter(y=>quizHasAnswer(qOf(c,y.qid),att.ans[y.qid])).length;
  let answer='';
  if(qq.type==='MULTIPLE_CHOICE')answer=raceOptions(qq.opts,v,true,qi,'quizRaceToggle',false);
  else if(qq.type==='SHORT_ANSWER')answer=`<input class='race-text' value='${esc(v||'')}' oninput='quizRaceSet(${qi},this.value)' aria-label='Câu trả lời'>`;
  else if(qq.type==='ESSAY')answer=`<textarea class='race-textarea' rows='5' oninput='quizRaceSet(${qi},this.value)' aria-label='Câu trả lời'>${esc(v||'')}</textarea>`;
  else answer=raceOptions(qq.opts,v,false,qi,'quizRaceChoose',false);
  return `<section class='panel race-game' aria-labelledby='race-title'><div class='race-banner'><div class='row between'><span class='race-tag'><span aria-hidden='true'>⚡</span> THỬ THÁCH · ${esc(q.name)}</span><div class='race-timer'>${cdHtml({cur:att})}</div></div><h2 id='race-title'><span aria-hidden='true'>🪢</span> Kéo co tri thức</h2><p>Mỗi câu đã trả lời kéo nút dây một nhịp về phía đội em. Hãy chinh phục đủ ${total} chặng để hoàn thành thử thách!</p>${raceTrackHtml(done,total,qi)}</div><div class='race-content'><div class='race-round-banner'><span class='race-round-number'>${String(qi+1).padStart(2,'0')}</span><span><b>CHẶNG ${qi+1} / ${total}</b><small>${x.w} điểm · ${raceHint(qq.type)}</small></span><span class='race-round-chip'>${done}/${total} xong</span></div><h3 class='race-question'>${esc(qq.content)}</h3>${answer}<div class='race-answer-status' id='race-answer-status' aria-live='polite'>${raceAnswerState(qq,v)}</div><div class='race-nav'><button class='btn light race-prev' type='button' data-noicon='1' aria-label='Câu trước' onclick='quizRaceMove(-1)' ${qi===0?'disabled':''}>${ic('arrowLeft',18)}<span>Câu trước</span></button><span class='muted'>Chọn đáp án rồi kéo tiếp</span><button class='btn race-next' type='button' data-noicon='1' aria-label='${qi===total-1?'Nộp bài':'Câu tiếp theo'}' onclick='quizRaceMove(1)'>${qi===total-1?'Chốt lượt · Nộp bài':'Kéo dây · Câu tiếp theo'}${ic('arrow',18)}</button></div>${clockTool()}</div></section>`;
}
function sQuiz(){
  const c=selected(),s=me(),q=c.quiz,a=s.att;
  if(q.deleted)return `<section class='panel'><h2>Bài kiểm tra</h2><div class='empty'>Hiện chưa có bài kiểm tra nào đang mở.</div></section>`;
  if(a.cur&&simNow()>a.cur.end){gradeAttempt(c,s);taking=false;toast('Hết hạn của lượt làm: hệ thống đã tự nộp các câu đã lưu.')}
  if(a.cur&&taking){
    return `<section class='panel'><h2>${esc(q.name)}</h2><p class='lead'>Lượt ${a.used+1}/${c.maxAtt} · ${q.dur} phút. Câu trả lời được lưu ngay khi chọn; nếu thoát, em quay lại làm tiếp mà không tốn thêm lượt.</p>${qs(c).map((x,qi)=>`<fieldset class='item' style='display:block;border-left:0;border-right:0;border-bottom:0;padding:12px 0'><legend><b>Câu ${qi+1} (${x.w} điểm).</b> ${esc(x.text)}</legend>${optsOf(x).map((o,oi)=>`<label style='display:block;padding:3px 0'><input type='radio' name='q${qi}' ${a.cur.a[qi]===oi?'checked':''} onchange='setAns(${qi},${oi})'> ${o}</label>`).join('')}</fieldset>`).join('')}<div class='row'><button class='btn' onclick='finishQuiz()'>Nộp bài</button><button class='btn light' onclick='taking=false;render()'>Tạm dừng</button></div></section>`;
  }
  const left=c.maxAtt-a.used,off=a.best==null?a.last:a.best;
  return `<section class='panel' aria-labelledby='h-sq'><h2 id='h-sq'>${esc(q.name)}</h2><p class='lead'>${q.dur} phút · tối đa ${c.maxAtt} lượt · em đã làm ${a.used}/${c.maxAtt}.</p><p style='margin:0 0 14px'>Lượt gần nhất: <b>${pct(a.last)}%</b> · Điểm chính thức (lượt cao nhất): <b>${pct(off)}%</b></p><div class='row'>${a.cur?`<button class='btn' onclick='startQuiz()'>Tiếp tục làm bài (không tốn thêm lượt)</button>`:left>0?`<button class='btn' onclick='startQuiz()'>Bắt đầu làm bài</button>`:`<span class='muted'>Em đã dùng hết số lần làm.</span>`}</div>${note('Câu hỏi trong prototype là câu mẫu sinh từ mục tiêu học tập; ngân hàng câu hỏi thật thuộc US-T05.')}</section>`;
}
function startQuiz(){const c=selected(),s=me();if(!s.att.cur){if(s.att.used>=c.maxAtt){toast('Em đã dùng hết số lần làm.');return}const t=simNow();s.att.cur={a:{},start:t,end:t+c.quiz.dur*60000}}taking=true;render()}

function openGapTarget(j,kind){
  const c=selected(),s=me();

  }
  if(kind==='practice'){
    const t=recTarget(c,s,j,'Luyện tập có mục tiêu')||recTarget(c,s,j,'Hoạt động nâng cao');
    if(!t){toast('Chưa có bài tập phù hợp với mục tiêu này.');return}
