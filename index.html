  if(q.deleted||q.status!=='Đã xuất bản'||!scopeLive(c,q))return `<section class='panel'><h2>Bài kiểm tra</h2><div class='empty'>Hiện chưa có bài kiểm tra nào đang mở.</div></section>`;
  if(a.cur&&simNow()>a.cur.end){submitAttempt(c,s);taking=false;toast('Hết hạn của lượt làm: hệ thống đã tự nộp các câu đã lưu.')}
  if(a.cur&&taking){
    if((a.cur.presentation||q.gameMode)==='race')return quizRaceHtml(c,q,a.cur);
    const inp=(x,qi)=>{const qq=qOf(c,x.qid),v=a.cur.ans[x.qid];
      if(qq.type==='MULTIPLE_CHOICE')return qq.opts.map((o,oi)=>`<label style='display:block;padding:3px 0'><input type='checkbox' ${(v||[]).includes(oi)?'checked':''} onchange='togAns(${qi},${oi},this.checked)'> ${esc(o)}</label>`).join('');
      if(qq.type==='SHORT_ANSWER')return `<input style='width:100%' value='${esc(v||'')}' oninput='setAns(${qi},this.value)' aria-label='Câu trả lời'>`;
      if(qq.type==='ESSAY')return `<textarea rows='5' style='width:100%' oninput='setAns(${qi},this.value)' aria-label='Câu trả lời'>${esc(v||'')}</textarea>`;
      return qq.opts.map((o,oi)=>`<label style='display:block;padding:3px 0'><input type='radio' name='q${qi}' ${v===oi?'checked':''} onchange='setAns(${qi},${oi})'> ${esc(o)}</label>`).join('')};
    return `<section class='panel'><h2>${esc(q.name)}</h2><p class='lead'>Lượt ${a.cur.n}/${c.maxAtt} · ${q.dur} phút. Câu trả lời được lưu ngay khi chọn; nếu thoát, em quay lại làm tiếp mà không tốn thêm lượt. Hết thời gian, hệ thống tự nộp các câu đã lưu.</p>${cdHtml(a)}${q.qs.map((x,qi)=>`<fieldset class='item' style='display:block;border-left:0;border-right:0;border-bottom:0;padding:12px 0'><legend><b>Câu ${qi+1} (${x.w} điểm).</b> ${esc(qOf(c,x.qid).content)}</legend>${inp(x,qi)}</fieldset>`).join('')}<div class='row'><button class='btn' onclick='finishQuiz()'>Nộp bài</button><button class='btn light' onclick='taking=false;render()'>Tạm dừng</button></div>${clockTool()}</section>`;
  }
  const o=offOf(c,s),pend=s.atts.filter(t=>t.status==='SUBMITTED').length;
  return `<section class='panel' id='qz' tabindex='-1' aria-labelledby='h-sq'><h2 id='h-sq'>${esc(q.name)}</h2><p class='lead'>${q.dur} phút · tối đa ${c.maxAtt} lượt · mở ${q.open} đến ${q.close} · phạm vi: ${esc(scopeLbl(c,q.scope))} · em đã dùng ${a.used}/${c.maxAtt} lượt.</p>${o!=null?`<p style='margin:0 0 6px'>Điểm chính thức (lượt cao nhất): <b>${o.toFixed(1)}/${qMax(c)}</b></p>`:''}${pend?`<p class='muted' style='margin:0 0 10px'>${pend} lượt đang chờ giáo viên chấm.</p>`:''}<div class='row'>${a.cur?`<button class='btn' onclick='startQuiz()'>Tiếp tục làm bài (không tốn thêm lượt)</button>`:!qWindow(c)?`<span class='muted'>Hiện ngoài thời gian làm bài.</span>`:a.used<c.maxAtt?`<button class='btn' onclick='startQuiz()'>Bắt đầu làm bài</button>`:`<span class='muted'>Em đã dùng hết số lần làm.</span>`}</div>${clockTool()}</section>`;
}
function quizResultsHtml(){
  const c=selected(),s=me(),mx=qMax(c),o=offOf(c,s);
  if(!s.atts.length)return `<section class='panel'><h2>Kết quả bài kiểm tra</h2><p class='muted' style='margin:0'>Em chưa làm bài kiểm tra nào.</p></section>`;
  return `<section class='panel'><h2>Kết quả bài kiểm tra</h2><p class='lead'>${esc(c.quiz.name)}${c.quiz.deleted?' (đã xóa · chỉ đọc)':''}. Điểm chính thức là lượt cao nhất: <b>${o==null?'chưa có':o.toFixed(1)+'/'+mx}</b></p>${s.atts.map(t=>`<details class='item' style='display:block'><summary><b>Lượt ${t.n}</b> · ${t.status==='GRADED'?'Điểm '+t.total.toFixed(1)+'/'+mx:t.status==='SUBMITTED'?'Chờ chấm: còn '+c.quiz.qs.filter(x=>t.sc[x.qid]==null).length+' câu':'Đang làm'}${o!=null&&t.status==='GRADED'&&t.total===o?' · lượt cao nhất':''}</summary>${t.status==='GRADED'&&!t.seed?c.quiz.qs.map((x,i)=>`<div style='padding:3px 0'>Câu ${i+1}: <b>${t.sc[x.qid]}/${x.w}</b>${t.fb[x.qid]?' · Nhận xét: '+esc(t.fb[x.qid]):''}</div>`).join(''):`<p class='muted' style='margin:6px 0 0'>${t.seed?'Dữ liệu minh họa, không có chi tiết từng câu.':'Chi tiết từng câu hiện sau khi lượt được chấm xong.'}</p>`}</details>`).join('')}</section>`;
}
function sResults(){const h=sResultsA(),i=h.indexOf("<section class='panel'><h2>Kết quả bài kiểm tra</h2>");return (i>0?h.slice(0,i):h)+quizResultsHtml()}
/* --- Ngân hàng câu hỏi (US-T05, T11, T12) --- */
let qbLes='all',qbObj='all',qbType='all',qbSrc='all',qbFind='';
function qbSet(k,v){if(k==='les')qbLes=v;else if(k==='obj')qbObj=v;else if(k==='type')qbType=v;else if(k==='src')qbSrc=v;else qbFind=v;render();const h=document.getElementById('h-qb');if(h)h.scrollIntoView({block:'nearest'})}
function qbResetFilters(){qbLes='all';qbObj='all';qbType='all';qbSrc='all';qbFind='';render()}
function questionsPage(){
  const c=selected(),all=c.bank.filter(q=>!q.del),sib=bankClasses(c);
  const lessonOfQ=q=>qbLessonOf(c,q);
  const objsAll=[...new Set(all.flatMap(q=>qCodes(c,q)))].sort();
  const fnd=nz(qbFind);
  const match=q=>{
    const les=lessonOfQ(q);
    if(qbLes==='none'&&les)return false;
    if(qbLes!=='all'&&qbLes!=='none'&&les!==qbLes)return false;
    if(qbObj!=='all'&&!qCodes(c,q).includes(qbObj))return false;
    if(qbType!=='all'&&q.type!==qbType)return false;
    if(qbSrc!=='all'&&(q.src||'MANUAL')!==qbSrc)return false;
    if(fnd&&nz(q.content).indexOf(fnd)<0)return false;
    return true};
  const L=all.filter(match);
  const groups=[];
  c.lessonsData.forEach(l=>{const its=L.filter(q=>lessonOfQ(q)===l.name);if(its.length)groups.push([l.name,its])});
  const none=L.filter(q=>!lessonOfQ(q));if(none.length)groups.push(['Chưa gắn bài học',none]);
  const typeOpts=[['all','Tất cả loại câu hỏi'],...QTK.map(k=>[k,QT[k]])];
  const lesOpts=[['all','Tất cả bài học'],...c.lessonsData.map(l=>[l.name,l.name]),['none','Chưa gắn bài học']];
  const objOpts=[['all','Tất cả mục tiêu'],...objsAll.map(o=>[o,o])];
  const srcOpts=[['all','Mọi nguồn'],['MANUAL','Tự soạn'],['AI','AI tạo']];
  const sel=(id,label,opts,val)=>`<div class='selectbox' style='min-width:0'><label for='${id}'>${label}</label><select id='${id}' onchange="qbSet('${id.replace('qb-','')}',this.value)">${opts.map(([k,v])=>`<option value="${esc(k)}" ${val===k?'selected':''}>${esc(v)}</option>`).join('')}</select></div>`;
  const row=q=>{const i=c.bank.indexOf(q),codes=qCodes(c,q);
    return `<tr><td style='min-width:240px'>${esc(q.content)}${qLocked(c,q)?` <span class='pill plain'>Đã có người làm</span>`:''}</td><td>${codes.length?codes.map(x=>`<code class='obj-code'>${esc(x)}</code>`).join(' '):'<span class="muted">Tổng hợp</span>'}</td><td>${QT[q.type]}</td><td style='white-space:nowrap'>${DF[q.diff]} · ${esc(q.bloom)}</td><td>${(q.src||'MANUAL')==='MANUAL'?'Tự soạn':'AI tạo'}</td><td><span class='row' style='flex-wrap:nowrap'><button class='btn light mini' onclick='editQ(${i})' aria-label='Sửa câu hỏi' title='Sửa câu hỏi'>${ic('edit',16)}</button><button class='btn light mini danger-soft' onclick='delQ(${i})' aria-label='Xoá câu hỏi' title='Xoá câu hỏi'>${ic('trash',16)}</button></span></td></tr>`};
  const tables=groups.map(([title,its])=>`<div class='qb-group'><div class='row between' style='margin:14px 0 6px'><b style='font-size:.9rem'>${esc(title)}</b><span class='pill plain'>${its.length} câu hỏi</span></div><div class='tablewrap'><table><thead><tr><th scope='col'>Nội dung câu hỏi</th><th scope='col' style='width:120px'>Mục tiêu</th><th scope='col' style='width:130px'>Loại</th><th scope='col' style='width:170px;white-space:nowrap'>Độ khó · Bloom</th><th scope='col' style='width:100px'>Nguồn</th><th scope='col' style='width:96px'><span class='sr'>Thao tác</span></th></tr></thead><tbody>${its.map(row).join('')}</tbody></table></div></div>`).join('');
  return `<section class='panel' aria-labelledby='h-qb'>
    <div class='row between' style='flex-wrap:wrap;gap:10px'><div><h2 id='h-qb'>Ngân hàng câu hỏi · Khối ${esc(String(c.grade))}</h2></div><div class='row' style='flex-wrap:nowrap'><button class='btn light' onclick='importFile("questions")' aria-label='Nhập từ Excel/Word' title='Nhập từ Excel/Word'>${ic('upload',16)}</button><button class='btn' onclick='editQ(-1)' aria-label='Thêm câu hỏi' title='Thêm câu hỏi'>${ic('plus',16)}</button></div></div>
    <div class='qb-filters'>${sel('qb-les','Bài học',lesOpts,qbLes)}${sel('qb-obj','Mục tiêu',objOpts,qbObj)}${sel('qb-type','Loại câu hỏi',typeOpts,qbType)}${sel('qb-src','Nguồn',srcOpts,qbSrc)}
      <div class='selectbox' style='min-width:0'><label for='qb-find'>Tìm nội dung</label><input id='qb-find' value='${esc(qbFind)}' placeholder='Nhập từ khoá…' onchange="qbSet('find',this.value)" onkeydown="if(event.key==='Enter')qbSet('find',this.value)"></div>
      <button class='btn light' data-noicon onclick='qbResetFilters()'>Xoá lọc</button>
    </div>
    <p class='muted' style='margin:10px 0 0;font-size:.82rem'>Tổng ${all.length} câu hỏi · đang hiển thị ${L.length} · câu đã dùng trong bài có người làm chỉ sửa được độ khó và mức Bloom.</p>
    ${groups.length?tables:`<div class='empty'>${all.length?'Không có câu hỏi nào khớp bộ lọc.':'Ngân hàng chưa có câu hỏi.'}</div>`}
  </section>${trashPanel(c,['Câu hỏi'])}`;
}
function editQ(i){
  const c=selected(),q=i<0?null:c.bank[i],lock=q&&qLocked(c,q),cm=codeMap(c);
  const kd=[{k:'d',label:'Độ khó',val:q?DF[q.diff]:DFV[1],sel:DFV},{k:'b',label:'Mức Bloom',val:q?q.bloom:BL[2],sel:BL}];
  const full=[{k:'c',label:'Nội dung',val:q?q.content:'',area:true},{k:'t',label:'Loại câu hỏi',val:q?QT[q.type]:QTV[0],sel:QTV},{k:'o',label:'Phương án (mỗi dòng một phương án; Đúng/Sai có sẵn hai phương án)',val:q?q.opts.join(NL):'',area:true},{k:'a',label:'Đáp án đúng (số thứ tự phương án, nhiều đáp án cách nhau dấu phẩy; Đúng/Sai: 1 = Đúng, 2 = Sai)',val:q&&q.ans!=null?[].concat(q.ans).map(x=>x+1).join(','):''},{k:'g',label:'Mục tiêu (không chọn = câu tổng hợp, không sinh bằng chứng học tập)',chk:objLabels(c).map(o=>o.label),val:q?objLabels(c).filter(o=>q.objs.includes(o.j)).map(o=>o.label):[]}];
  openDlg({title:q?'Sửa câu hỏi':'Thêm câu hỏi',text:lock?'Câu hỏi đã dùng trong bài kiểm tra có người làm: chỉ sửa được độ khó và mức Bloom. Muốn đổi nội dung, hãy tạo câu hỏi mới thay thế.':'',fields:lock?kd:full.concat(kd),ok:v=>{
    if(lock){q.diff=DFK[DFV.indexOf(v.d)];q.bloom=v.b;q.upd=stamp();toast('Đã lưu độ khó và mức Bloom');return null}
    const content=v.c.trim(),type=QTK[QTV.indexOf(v.t)];let opts=[],ans=null;
    if(!content)return 'Câu hỏi phải có nội dung.';
    if(isObjT(type)){
      opts=type==='TRUE_FALSE'?['Đúng','Sai']:v.o.split(NL).map(x=>x.trim()).filter(Boolean);
      if(opts.length<2)return 'Câu trắc nghiệm cần ít nhất 2 phương án.';
      const nums=v.a.split(',').map(x=>parseInt(x,10)-1).filter(x=>!isNaN(x));
      if(!nums.length||nums.some(n=>n<0||n>=opts.length))return 'Thiếu đáp án đúng hoặc đáp án nằm ngoài danh sách phương án.';
      if(type!=='MULTIPLE_CHOICE'&&nums.length!==1)return 'Loại câu này chỉ có một đáp án đúng.';
      ans=type==='MULTIPLE_CHOICE'?[...new Set(nums)]:nums[0];
    }
    const objs=v.g.map(l=>OBJL(c)[l]).filter(x=>x!=null);
    const o={content,type,opts,ans,objs,diff:DFK[DFV.indexOf(v.d)],bloom:v.b,upd:stamp()};
    if(q){Object.assign(q,o);normQ(c,q)}else{const nq=Object.assign({id:'C'+(QID++),src:'MANUAL'},o);normQ(c,nq);c.bank.push(nq);asgHookAdd(c,nq)}
    toast(q?'Đã lưu câu hỏi':'Đã thêm câu hỏi vào ngân hàng (nguồn: tự soạn)');return null}});
}
function delQ(i){
  const c=selected(),q=c.bank[i],inQ=c.quiz.qs.some(x=>x.qid===q.id);
  openDlg({title:'Xóa câu hỏi?',text:'Câu hỏi ẩn khỏi ngân hàng nên không chọn được cho bài kiểm tra mới.'+(inQ?' Câu hỏi vẫn được giữ nguyên trong bài kiểm tra hiện có.':''),danger:true,okLabel:'Xóa câu hỏi',ok:()=>{
    q.del=true;c.trash.unshift({type:'Câu hỏi',name:q.content,note:'Ẩn khỏi ngân hàng; vẫn nằm trong bài kiểm tra đã có',objIdx:[],at:stamp()});toast('Đã xóa mềm câu hỏi');return null}});
}
/* --- Bài tập: dựng, xuất bản, lượt làm, chấm tay (US-T06, T13, T14, T15) --- */
const quizErr=(v,minAtt)=>{
  const d=parseInt(v.d,10),a=parseInt(v.a,10);
  if(!v.n.trim())return 'Bài tập phải có tiêu đề.';
  if(!(d>0))return 'Thời lượng phải lớn hơn 0.';
  if(!/^\d+$/.test(String(v.a).trim()))return 'Hãy nhập số lần làm tối đa, là số nguyên từ 1 trở lên. Mỗi bài kiểm tra phải được cấu hình số lần làm trước khi xuất bản.';
  if(!(a>=1))return 'Số lần làm tối đa phải từ 1 trở lên.';
  if(a<(minAtt||0))return 'Không đặt thấp hơn số lượt đã làm của học sinh ('+minAtt+' lượt).';
  if(!okD(v.o)||!okD(v.x))return 'Thời gian mở và đóng cần đúng dạng dd/mm/yyyy.';
  if(dmy(v.x,23,59)<=dmy(v.o,0,0))return 'Thời gian đóng phải sau thời gian mở.';
  return null;
};
function newQuiz(){
  const c=selected();
  openDlg({title:'Tạo bài tập',text:'Bài mới ở trạng thái nháp, học sinh chưa thấy.',fields:[{k:'n',label:'Tiêu đề',val:''},{k:'p',label:'Phạm vi',val:'Cả lớp',sel:['Cả lớp','Một chủ đề','Một bài học']},{k:'d',label:'Thời lượng (phút)',val:'15'},{k:'a',label:'Số lần làm tối đa (bắt buộc, số nguyên từ 1 trở lên)',val:''},{k:'o',label:'Mở từ ngày (dd/mm/yyyy)',val:'01/11/2026'},{k:'x',label:'Đóng hết ngày (dd/mm/yyyy)',val:'15/11/2026'}],ok:v=>{
    const e=quizErr(v);if(e)return e;
    c.students.forEach(s=>{s.attOld=(s.attOld||[]).concat([s.atts]);s.atts=[];s.att={used:0,last:0,best:null,real:null,cur:null}});
    c.quiz={name:v.n.trim(),scope:v.p,status:'Nháp',dur:+v.d,open:v.o.trim(),close:v.x.trim(),qs:[],deleted:false};c.maxAtt=+v.a;toast('Đã tạo bài kiểm tra nháp');return null}});
}
function editQuiz(){
  const c=selected(),q=c.quiz,used=Math.max(...c.students.map(s=>s.att.used));
  openDlg({title:'Sửa bài kiểm tra',text:'Lượt đang làm giữ hạn đã chốt khi bắt đầu, nên rút ngắn thời lượng hoặc thời gian đóng chỉ ảnh hưởng các lượt bắt đầu sau đó.',fields:[{k:'n',label:'Tiêu đề',val:q.name},{k:'d',label:'Thời lượng (phút)',val:q.dur},{k:'a',label:'Số lần làm tối đa (không thấp hơn '+used+')',val:c.maxAtt},{k:'o',label:'Mở từ ngày (dd/mm/yyyy)',val:q.open},{k:'x',label:'Đóng hết ngày (dd/mm/yyyy)',val:q.close}],ok:v=>{
    const e=quizErr(v,used);if(e)return e;
    const sh=+v.d<q.dur||dmy(v.x,23,59)<dmy(q.close,23,59);
    q.name=v.n.trim();q.dur=+v.d;c.maxAtt=+v.a;q.open=v.o.trim();q.close=v.x.trim();q.upd=stamp();
    toast(sh?'Đã lưu. Lượt đang làm giữ hạn đã chốt; thông số mới áp dụng cho lượt bắt đầu sau.':'Đã lưu bài kiểm tra');return null}});
}
function togglePubQ(){
  const c=selected(),q=c.quiz;
  if(q.status==='Nháp'){if(!q.qs.length){toast('Bài tập chưa có câu hỏi nên không xuất bản được.');return}if(!(c.maxAtt>=1)){toast('Chưa xuất bản được: hãy cấu hình số lần làm tối đa cho bài kiểm tra (nút Sửa).');return}q.status='Đã xuất bản';notifyClass(c,'NEW_ASSESSMENT_PUBLISHED','Bài tập mới: '+q.name,{page:'assessments',c,ref:q});toast('Đã xuất bản bài kiểm tra và gửi thông báo cho '+c.students.length+' học sinh')}
  else{if(hasAtt(c)){toast('Bài đã có lượt làm nên không hủy xuất bản được.');return}q.status='Nháp';toast('Đã đưa bài kiểm tra về nháp')}
  q.upd=stamp();render();
}
function addQ(){
  const c=selected(),q=c.quiz,av=c.bank.filter(b=>!b.del&&!q.qs.some(x=>x.qid===b.id)),lab=b=>b.id+' · '+b.content.slice(0,60);
  if(hasAtt(c)){toast('Bài đã có người làm, không sửa được danh sách câu hỏi.');return}
  if(!av.length){toast('Ngân hàng không còn câu hỏi nào để thêm.');return}
  openDlg({title:'Thêm câu hỏi vào bài',fields:[{k:'q',label:'Câu hỏi',val:lab(av[0]),sel:av.map(lab)},{k:'w',label:'Trọng số điểm',val:'1'}],ok:v=>{
    const b=av.find(x=>lab(x)===v.q),w=parseFloat(String(v.w).replace(',','.'));
    if(!b)return 'Hãy chọn một câu hỏi.';if(!(w>0))return 'Trọng số phải lớn hơn 0.';
    q.qs.push({qid:b.id,w});return null}});
}
function rmQ(i){const c=selected();if(hasAtt(c)){toast('Bài đã có người làm, không sửa được danh sách câu hỏi.');return}c.quiz.qs.splice(i,1);render()}
function attemptsPanel(c){
  const mx=qMax(c),rows=[];
  c.students.forEach((s,si)=>{
    const o=offOf(c,s);
    if(!s.atts.length){if(!pendOnly)rows.push(`<tr><td class='student'>${esc(s.name)}</td><td colspan='4' class='muted'>Chưa làm bài</td><td></td></tr>`);return}
    s.atts.forEach((t,k)=>{

function gradeAtt(si,k){

    Q.forEach((x,i)=>{t.sc[x.qid]=ns[i];t.fb[x.qid]=String(v['f'+i]).trim()});
    if(Q.every(x=>t.sc[x.qid]!=null)){completeAttempt(c,s,t);toast('Lượt làm đã chấm xong; mức nắm vững đã được tính lại.')}

/* US-T04: tiến độ nộp (trang Bài tập theo dõi) và bảng chấm (trang Chấm điểm) */
/* --- Chấm điểm: lưu điểm và nhận xét qua hộp thoại (không còn ô nhập rải trong bảng) --- */
function applyGrade(c,a,s,si,v,fb){
  if(a.aid==null)a.aid='n'+Date.now();
  const key='A'+a.aid,before=s.mastery.slice(),gb=s.gaps.map(g=>g.status),sub=a.subs[si];
  sub.score=v;sub.fb=fb;sub.gradedBy=acctName();

function genAI(L,r,k){
  const o=r.objs[k%r.objs.length],g=r.c.goals[o],types=['SINGLE_CHOICE','TRUE_FALSE','MULTIPLE_CHOICE','SHORT_ANSWER'];
  const type=r.type==='AUTO'?types[k%4]:r.type,base={obj:o,type,opts:[],ans:null,rs:'PENDING_REVIEW',diff:r.diff==='AUTO'?DFK[k%3]:r.diff,bloom:r.bloom==='AUTO'?BL[(k+1)%BL.length]:r.bloom};
  const n='(AI) Câu '+(k+1)+': ';
  if(type==='SINGLE_CHOICE')return Object.assign(base,{content:n+'Phát biểu nào đúng nhất về “'+g+'” trong bài “'+L.name+'”?',opts:optsOf({ans:k%3}),ans:k%3});
  if(type==='TRUE_FALSE')return Object.assign(base,{content:n+'Nhận định sau đúng hay sai: “'+g+'” là nội dung cốt lõi của bài “'+L.name+'”.',opts:['Đúng','Sai'],ans:0});
  if(type==='MULTIPLE_CHOICE')return Object.assign(base,{content:n+'Chọn tất cả phát biểu đúng liên quan đến “'+g+'”.',opts:['Phát biểu đúng thứ nhất','Phát biểu sai','Phát biểu đúng thứ hai','Phát biểu không liên quan'],ans:[0,2]});
  if(type==='SHORT_ANSWER')return Object.assign(base,{content:n+'Nêu ngắn gọn ý chính của mục tiêu “'+g+'”.'});
  return Object.assign(base,{content:n+'Trình bày và lấy ví dụ minh họa cho “'+g+'”.'});
}
function validAI(lo,o){
  if(!o.content||!o.content.trim()||!lo.includes(o.obj))return false;
  if(isObjT(o.type)){
    if(!o.opts||o.opts.length<2||o.ans==null)return false;
    const a=[].concat(o.ans);
    if(!a.length||a.some(x=>typeof x!=='number'||x<0||x>=o.opts.length))return false;
    if(o.type!=='MULTIPLE_CHOICE'&&a.length!==1)return false;
  }
  return true;
}
function finishAI(r){
  if(r.status!=='PROCESSING')return;
  if(r.mode==='FAIL'){r.status='FAILED';r.err='Dịch vụ AI không phản hồi (mô phỏng lỗi).'}
  else{
    const lo=r.lesson.objs.map(o=>o.idx);let drop=0;
    for(let k=0;k<r.qty;k++){
      const o=genAI(r.lesson,r,k);
      if(r.mode==='INVALID'){if(k%4===3)o.obj=999;else if(k%4===1&&isObjT(o.type))o.ans=null}
      if(validAI(lo,o)){o.id=++AIOID;o.req=r;r.outs.push(o)}else drop++;
    }
    r.drop=drop;
    if(r.outs.length)r.status='COMPLETED';else{r.status='FAILED';r.err='Không có câu nào hợp lệ sau khi kiểm tra.'}
  }
  notify(r.status==='COMPLETED'?'AI_GENERATION_COMPLETED':'AI_GENERATION_FAILED',r.status==='COMPLETED'?'AI đã tạo xong '+r.outs.length+' câu hỏi nháp cho bài “'+r.lesson.name+'” ('+r.c.id+')':'Yêu cầu AI thất bại: '+r.err,r,r.teacher);
  if(logged&&role==='T')render();
}

function parseClassId(name){
  const m=/^([0-9]{1,2})([A-Z][0-9]{1,2})$/.exec(String(name||'').trim().toUpperCase());
  if(!m)return null;
  const g=parseInt(m[1],10);
  return (g>=1&&g<=12)?{id:m[1]+m[2],grade:g}:null;
}

  openDlg({title:'Đưa '+esc(s.name)+' ra khỏi lớp?',text:'Học sinh không còn thấy nội dung học tập của lớp. Bằng chứng, mức nắm vững, bài nộp và lượt làm bài đã ghi nhận được giữ nguyên.',danger:true,okLabel:'Đưa ra khỏi lớp',ok:()=>{
    c.assignments.concat(c.trash.filter(t=>t.ref).map(t=>t.ref)).forEach(a=>{a.subs.splice(i,1);a.submitted=a.subs.filter(x=>x.has).length;a.graded=a.subs.filter(x=>x.score!=null).length});
    c.students.splice(i,1);c.left.push({s,at:stamp()});c.count=c.students.length;stuIdx=0;toast('Đã đưa học sinh ra khỏi lớp; kết quả học tập vẫn được giữ.');return null}});
}
function students(){
  const c=selected();
  return `<section class='panel' aria-labelledby='h-students'><div class='row between'><span style='flex:1'></span><button class='btn' onclick='addStudents()'>${ic('plus',16)}Thêm học sinh</button></div>${c.students.length?`<div class='tablewrap'><table><thead><tr><th scope='col' style='width:56px;text-align:center'>STT</th><th scope='col' style='text-align:center'>Học sinh</th><th scope='col' style='text-align:center'>Email</th><th scope='col' style='text-align:center'>Trạng thái</th><th scope='col'><span class='sr'>Thao tác</span></th></tr></thead><tbody>${c.students.map((s,i)=>{const d=s.mastery.some(v=>v!=null),m=sAvg(s);return `<tr><td class='stt'>${i+1}</td><td class='student'>${esc(s.name)}</td><td>${esc(s.email)}${(ACCT[s.email]||{}).mustChange?` <span class='pill plain'>Chưa đặt mật khẩu riêng</span>`:''}</td><td>${!d?`<span class='pill plain'>Chưa có dữ liệu</span>`:m<.5?`<span class='pill need'>${ic('alert',14)}Cần hỗ trợ</span>`:`<span class='pill prog'>${ic('trend',14)}Đang học</span>`}</td><td><button class='btn light' onclick='removeStudent(${i})' aria-label='Đưa ${esc(s.name)} ra khỏi lớp'>Đưa ra khỏi lớp</button></td></tr>`}).join('')}</tbody></table></div>`:`<div class='empty'>Lớp chưa có học sinh. Chọn “Thêm học sinh” để bắt đầu.</div>`}</section>${c.addLog.length?`<section class='panel'><h2 style='font-size:15px'>Kết quả thêm học sinh gần nhất</h2><p class='lead'>Hãy gửi email và mật khẩu mặc định cho từng học sinh. Mỗi học sinh tự đặt mật khẩu riêng ở lần đăng nhập đầu; giáo viên không xem được mật khẩu riêng đó.</p>${c.addLog.map(addLogLine).join('')}</section>`:''}${c.left.length?`<section class='panel'><h2 style='font-size:15px'>Đã ra khỏi lớp</h2><p class='lead'>Kết quả học tập vẫn được giữ trong cơ sở dữ liệu.</p>${c.left.map(x=>`<div class='item'><div><b>${esc(x.s.name)}</b><div class='muted'>${esc(x.s.email)} · ${x.at}</div></div></div>`).join('')}</section>`:''}`;

/* --- US-T02A, T02: chủ đề, bài học, mục tiêu, tài liệu chung --- */
function goalsIn(c){
  if(mFil[0]==='L'&&+mFil.slice(1)>=c.lessonsData.length)mFil='all';
  if(mFil[0]==='T'&&!c.topics.some(t=>t.id===mFil.slice(1)))mFil='all';
  return c.goals.map((_,j)=>j).filter(j=>{const l=lessonOf(c,j);if(mFil==='all')return true;if(mFil==='del')return !l;if(!l)return false;if(mFil[0]==='T')return l.tid===mFil.slice(1);return c.lessonsData.indexOf(l)===+mFil.slice(1)});
}
function filterBar(c){
  const del=c.trash.some(t=>t.type==='Bài học'),op=(v,t)=>`<option value='${v}' ${mFil===v?'selected':''}>${esc(t)}</option>`;
  return `<div class='selectbox' style='max-width:360px;margin-bottom:12px'><label for='mf'>Lọc theo chủ đề hoặc bài học</label><select id='mf' onchange='mFil=this.value;render()'>${op('all','Tất cả mục tiêu')}${c.topics.map(t=>op('T'+t.id,'Chủ đề: '+t.title)).join('')}${c.lessonsData.map((l,i)=>op('L'+i,'Bài học: '+l.name)).join('')}${del?op('del','Bài học đã xóa'):''}</select></div>`;
}
function courseDocs(c){
  return `<section class='panel' aria-labelledby='h-cd'><div class='row between'><h2 id='h-cd' style='font-size:15px'>Tài liệu chung của lớp</h2><button class='btn light' onclick='pickCourseFile(-1)'>${ic('plus',16)}Đính kèm tài liệu</button></div><p class='muted' style='margin:4px 0 0'>Tối đa 50 MB · ${ALLOWED.join(', ').toUpperCase()}</p>${c.cres.map((r,ri)=>`<div class='row between' style='padding:5px 0'><span>${esc(r.name)} <span class='muted'>· ${fsize(r.size)}</span></span><span class='row'><button class='btn light' onclick='pickCourseFile(${ri})'>Thay tệp</button><button class='btn light' onclick='delCourseFile(${ri})'>Xóa</button></span></div>`).join('')}</section>`;
}
function pickCourseFile(ri){
  const inp=document.createElement('input');inp.type='file';
  inp.onchange=()=>{
    const f=inp.files[0];if(!f)return;const c=selected(),ext=f.name.split('.').pop().toLowerCase();
    if(f.size>52428800){toast('Tệp '+fsize(f.size)+' vượt giới hạn 50 MB, bị từ chối.');return}
    if(!ALLOWED.includes(ext)){toast('Định dạng .'+ext+' không được phép. Cho phép: '+ALLOWED.join(', ')+'.');return}
    const r={name:f.name,size:f.size,blob:f};if(ri>=0)c.cres[ri]=r;else c.cres.push(r);render();toast('Đã lưu tài liệu chung của lớp');
  };
  inp.click();
}
function delCourseFile(ri){
  const c=selected(),r=c.cres[ri];
  openDlg({title:'Xóa tài liệu chung?',text:esc(r.name)+' sẽ không còn tải được đối với học sinh.',danger:true,okLabel:'Xóa tài liệu',ok:()=>{c.trash.unshift({type:'Tài liệu',name:r.name,note:'Tài liệu chung của lớp; học sinh không còn tải được',objIdx:[],at:stamp()});c.cres.splice(ri,1);toast('Đã xóa mềm tài liệu');return null}});
}

/* --- Trang Bài học và mục tiêu: khối chủ đề → bài học → mục tiêu --- */
function lessonsPage(){
  const c=selected();
  const head=`<section class='panel' style='padding:18px 22px'><div class='row between' style='flex-wrap:wrap;gap:10px'><div><h2 style='margin:0'>Khóa học Tin học · ${esc(c.id)}</h2><div class='muted' style='margin-top:4px'>${c.topics.length} chủ đề · ${c.lessonsData.length} bài học · ${c.goals.length} mục tiêu học tập${c.topicDel?' · chủ đề đang bị xóa mềm':''}</div></div><button class='btn' onclick='newTopic()'>${ic('plus',16)}Tạo chủ đề</button></div></section>`;
  const objs=(l,li)=>l.objs.length?`<div class='tablewrap'><table><thead><tr><th scope='col'>Mã</th><th scope='col'>Mục tiêu học tập</th><th scope='col'>Bằng chứng</th><th scope='col'>Nắm vững TB lớp</th><th scope='col'><span class='sr'>Thao tác</span></th></tr></thead><tbody>${l.objs.map((o,oi)=>{const v=c.students.map(s=>s.mastery[o.idx]).filter(x=>x!=null);return `<tr><td><span class='codebadge'>${esc(o.code)}</span></td><td style='min-width:200px'>${esc(o.desc)}</td><td>${evCount(c,o.idx)}</td><td>${v.length?pct(mean(v))+'%':'<span class="muted">Chưa có dữ liệu</span>'}</td><td><span class='row' style='flex-wrap:nowrap'><button class='btn light mini' onclick='editObj(${li},${oi})' aria-label='Sửa mục tiêu ${esc(o.code)}'>Sửa</button><button class='btn light mini' onclick='delObj(${li},${oi})' aria-label='Xóa mục tiêu ${esc(o.code)}'>Xóa</button></span></td></tr>`}).join('')}</tbody></table></div>`:`<div class='muted' style='padding:2px 0'>Chưa có mục tiêu nào ở bài học này.</div>`;
  const res=(l,li)=>l.res.length?l.res.map((r,ri)=>`<div class='row between' style='padding:5px 0'><span style='min-width:0'><b style='font-size:.8125rem'>${esc(r.name)}</b> <span class='muted'>· ${fsize(r.size)}</span></span><span class='row' style='flex-wrap:nowrap'><button class='btn light mini' onclick='pickFile(${li},${ri})'>Thay</button><button class='btn light mini' onclick='delRes(${li},${ri})'>Xóa</button></span></div>`).join(''):`<div class='muted' style='font-size:.8125rem'>Chưa có tài liệu nào.</div>`;
  const lesson=(l,li)=>`<details class='lesblk' ${l.status==='Nháp'?'':'open'} style='border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0;background:var(--fill)'>
<summary class='row between' style='cursor:pointer'><span class='row' style='gap:8px;min-width:0'><span class='dot ${l.status==='Nháp'?'draft':''}' aria-hidden='true'></span><b>${esc(l.name)}</b><span class='pill ${l.status==='Nháp'?'plain':'good'}'>${l.status}</span><span class='muted'>${l.objs.length} mục tiêu · ${l.res.length} tài liệu</span></span></summary>
<details class='dotmenu'><summary class='btn light mini' aria-label='Thao tác cho bài học ${esc(l.name)}' aria-haspopup='true'>${ic('more',16)}</summary><div class='dotmenu-pop' role='menu'><button class='mitem' role='menuitem' onclick='mclose(this);addObj(${li})'>Thêm mục tiêu</button><button class='mitem' role='menuitem' onclick='mclose(this);pickFile(${li},-1)'>Đính kèm tài liệu</button><button class='mitem' role='menuitem' onclick='mclose(this);togglePub(${li})'>${l.status==='Nháp'?'Xuất bản':'Hủy xuất bản'}</button><button class='mitem' role='menuitem' onclick='mclose(this);editLesson(${li})'>Sửa bài học</button><button class='mitem' role='menuitem' onclick='mclose(this);delLesson(${li})'>Xóa bài học</button></div></details>
<div class='muted' style='margin:6px 0'>${esc(l.desc||'Chưa có mô tả')}${l.upd?' · sửa gần nhất '+esc(l.upd):''}</div>
<div class='row lesacts' style='margin:0 0 10px'><button class='btn light mini' onclick='addObj(${li})'>${ic('plus',13)}Thêm mục tiêu</button><button class='btn light mini' onclick='pickFile(${li},-1)'>Đính kèm tài liệu</button><button class='btn light mini' onclick='togglePub(${li})'>${l.status==='Nháp'?'Xuất bản':'Hủy xuất bản'}</button><button class='btn light mini' onclick='editLesson(${li})'>Sửa bài học</button><button class='btn light mini' onclick='delLesson(${li})'>Xóa bài học</button></div>
${objs(l,li)}
<div style='margin-top:10px'><div class='muted' style='font:600 .71875rem/1.2 var(--font-head);letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px'>Tài liệu của bài học</div>${res(l,li)}</div>
</details>`;
  const topic=(t,ti)=>{
    const Ls=c.lessonsData.map((l,li)=>({l,li})).filter(x=>x.l.tid===t.id);
    return `<section class='panel' style='padding:16px 20px' aria-labelledby='tp-${ti}'><div class='row between' style='flex-wrap:wrap;gap:8px'><div style='min-width:0'><div class='muted' style='font:600 .71875rem/1.2 var(--font-head);letter-spacing:.04em;text-transform:uppercase'>Chủ đề ${ti+1}</div><h2 id='tp-${ti}' style='margin:3px 0 0'>${esc(t.title)}</h2><div class='muted' style='margin-top:3px'>${Ls.length} bài học · ${Ls.reduce((n,x)=>n+x.l.objs.length,0)} mục tiêu</div></div><span class='pill ${t.status==='Nháp'?'plain':'good'}'>${t.status}</span></div>
<div class='row' style='margin:10px 0 2px'><button class='btn light mini' onclick='newLesson(${ti})'>${ic('plus',13)}Thêm bài học</button><button class='btn light mini' onclick='editTopic(${ti})'>Sửa chủ đề</button><button class='btn light mini' onclick='togTopic(${ti})'>${t.status==='Nháp'?'Xuất bản':'Về nháp'}</button><button class='btn light mini' onclick='moveTopic(${ti},-1)'>Lên</button><button class='btn light mini' onclick='moveTopic(${ti},1)'>Xuống</button><button class='btn light mini' onclick='delTopic(${ti})'>Xóa chủ đề</button></div>
${Ls.length?Ls.map(x=>lesson(x.l,x.li)).join(''):`<div class='empty'>Chủ đề chưa có bài học nào. Thêm bài học để bắt đầu xây dựng mục tiêu.</div>`}</section>`;
  };
  const docs=`<section class='panel' aria-labelledby='h-cd'><div class='row between'><h2 id='h-cd'>Tài liệu chung của lớp (${c.cres.length})</h2><button class='btn light' onclick='pickCourseFile(-1)'>${ic('plus',16)}Đính kèm tài liệu chung</button></div>${c.cres.length?c.cres.map((r,ri)=>`<div class='item'><div style='min-width:0'><b>${esc(r.name)}</b><div class='muted'>${fsize(r.size)}</div></div><span class='row' style='flex-wrap:nowrap'><button class='btn light' onclick='pickCourseFile(${ri})'>Thay tệp</button><button class='btn light' onclick='delCourseFile(${ri})'>Xóa</button></span></div>`).join(''):`<div class='empty'>Chưa có tài liệu chung của lớp.</div>`}</section>`;
  return head+c.topics.map((t,ti)=>topic(t,ti)).join('')+docs+trashPanel(c,['Bài học','Tài liệu','Chủ đề','Mục tiêu']);
}
function newTopic(){
  const c=selected();
  openDlg({title:'Tạo chủ đề',text:'Chủ đề mới ở trạng thái nháp; học sinh chưa thấy cho đến khi xuất bản.',okLabel:'Tạo chủ đề',fields:[{k:'t',label:'Tiêu đề',val:''},{k:'d',label:'Mô tả (không bắt buộc)',val:'',area:true}],ok:v=>{
    if(!v.t.trim())return 'Chủ đề không có tiêu đề thì không lưu được.';
    c.topics.push({id:'T'+(TID++),title:v.t.trim(),desc:v.d.trim(),status:'Nháp'});syncTopic(c);toast('Đã tạo chủ đề (nháp)');return null}});
}
function editTopic(ti){
  const c=selected(),t=c.topics[ti];
  openDlg({title:'Sửa chủ đề',fields:[{k:'t',label:'Tiêu đề',val:t.title},{k:'d',label:'Mô tả',val:t.desc||'',area:true}],ok:v=>{
    if(!v.t.trim())return 'Chủ đề không có tiêu đề thì không lưu được.';t.title=v.t.trim();t.desc=v.d.trim();syncTopic(c);toast('Đã lưu chủ đề');return null}});
}
function togTopic(ti){const c=selected(),t=c.topics[ti];t.status=t.status==='Nháp'?'Đã xuất bản':'Nháp';toast(t.status==='Nháp'?'Đã hủy xuất bản; học sinh không còn thấy chủ đề và các bài học bên trong.':'Đã xuất bản chủ đề');render()}
function moveTopic(ti,d){const c=selected(),j=ti+d;if(j<0||j>=c.topics.length)return;const t=c.topics[ti];c.topics[ti]=c.topics[j];c.topics[j]=t;syncTopic(c);focusId='pageTitle';render()}
function delTopic(ti){
  const c=selected(),t=c.topics[ti],Ls=c.lessonsData.filter(l=>l.tid===t.id),n=Ls.reduce((s,l)=>s+l.objs.reduce((m,o)=>m+evCount(c,o.idx),0),0);
  openDlg({title:'Xóa chủ đề “'+esc(t.title)+'”?',text:'Chủ đề còn '+Ls.length+' bài học'+(n?' và '+n+' bằng chứng học tập':'')+'. Học sinh không còn thấy chủ đề và các bài học bên trong; bằng chứng, mức nắm vững vẫn được giữ, gợi ý liên quan hết hiệu lực.',danger:true,okLabel:'Xóa chủ đề',ok:()=>{
    Ls.forEach(l=>{trashLesson(c,l);c.lessonsData.splice(c.lessonsData.indexOf(l),1)});
    c.trash.unshift({type:'Chủ đề',name:t.title,note:'Chủ đề và các bài học bên trong không còn hiển thị cho học sinh',objIdx:[],at:stamp()});
    c.topics.splice(ti,1);syncTopic(c);LOG.unshift('Xóa chủ đề “'+t.title+'” ('+c.id+'): gợi ý liên quan chuyển sang hết hiệu lực');toast('Đã xóa mềm chủ đề');return null}});
}
function newLesson(ti){
  const c=selected(),t=c.topics[ti];
  openDlg({title:'Tạo bài học trong “'+esc(t.title)+'”',text:'Bài học mới ở trạng thái nháp và thuộc đúng chủ đề này. Bài học chưa có mục tiêu thì không xuất bản được.',okLabel:'Tạo bài học',fields:[{k:'n',label:'Tiêu đề',val:''},{k:'d',label:'Mô tả',val:'',area:true},{k:'g',label:'Mục tiêu học tập (mỗi dòng: MÃ | mô tả, ví dụ LO10 | Nhận biết địa chỉ IP)',val:'',area:true}],ok:v=>{
    if(!v.n.trim())return 'Bài học phải có tiêu đề.';
    const seen=new Set(),list=[];
    const lines=v.g.split(NL).map(x=>x.trim()).filter(Boolean);
    for(let k=0;k<lines.length;k++){
      const ln=lines[k],p=ln.indexOf('|'),code=(p<0?ln:ln.slice(0,p)).trim().toUpperCase(),d=p<0?'':ln.slice(p+1).trim();
      if(!code||!d)return 'Dòng '+(k+1)+': nhập theo dạng MÃ | mô tả.';
      if(seen.has(code))return 'Mã '+esc(code)+' bị trùng trong cùng bài học.';
      seen.add(code);list.push([code,d]);
    }
    const l={name:v.n.trim(),desc:v.d.trim(),status:'Nháp',goals:[],res:[],objs:[],tid:t.id,upd:stamp()};
    list.forEach(x=>l.objs.push({code:x[0],desc:x[1],idx:addGoal(c,x[1])}));
    c.lessonsData.push(l);toast('Đã tạo bài học (nháp) với '+l.objs.length+' mục tiêu');return null}});
}
function addObj(li){
  const c=selected(),l=c.lessonsData[li];
  openDlg({title:'Thêm mục tiêu cho “'+esc(l.name)+'”',okLabel:'Thêm mục tiêu',fields:[{k:'c',label:'Mã mục tiêu',val:''},{k:'d',label:'Mô tả',val:'',area:true}],ok:v=>{
    const code=v.c.trim().toUpperCase();
    if(!code||!v.d.trim())return 'Mã và mô tả không được để trống.';
    if((l.objs||[]).some(o=>String(o.code||'').toUpperCase()===code))return 'Bài học này đã có mã '+esc(code)+': mỗi mã dùng một lần trong bài học.';
    const jj=addGoal(c,v.d.trim());reviveGoal(c,jj);l.objs.push({code,desc:v.d.trim(),idx:jj});l.upd=stamp();toast('Đã thêm mục tiêu; chưa có bằng chứng nên hiển thị “Chưa có dữ liệu”.');return null}});
}
function studentResourceKind(r){
  const ext=String(r.name||'').split('.').pop().toLowerCase();
  if(['mp4','mov','webm','m4v','avi'].includes(ext))return 'Video';
  if(['ppt','pptx','key'].includes(ext))return 'Slide';
  if(['png','jpg','jpeg','gif','webp'].includes(ext))return 'Hình ảnh';
  return 'Tài liệu';
}
function studentResourcePreview(r){
  if(studentResourceKind(r)!=='Video'||!r.blob)return '';
  if(!r.studentVideoUrl)r.studentVideoUrl=URL.createObjectURL(r.blob);
  return `<video class='student-resource-video' controls playsinline preload='metadata' src='${r.studentVideoUrl}' aria-label='Video học tập: ${esc(r.name)}'></video>`;
}
function lessonStu(c,l,li){
  const nObj=(l.objs||[]).length;
  return `<div class='student-lesson' id='ls-${li}'>
    <button type='button' class='student-lesson-head' data-lesson='${li}' onclick="stuOpenLesson(${li})" aria-label="Mở bài ${esc(l.name)}"><span class='student-lesson-name'>${esc(l.name)}</span>${nObj?`<span class='muted' style='flex:none;font-size:12px'>${nObj} mục tiêu</span>`:''}${ic('arrow',17)}</button>

function doLogin(e,p){

  sess={email:em,role:a.role==='TEACHER'?'T':'S',t:Date.now()};role=sess.role;logged=true;authErr='';authMsg='';authEmail='';
  if(cl){current=cl.id;page='lessons'}else{page='overview';const vc=visClasses();if(!vc.some(x=>x.id===current)&&vc[0])current=vc[0].id}
  taking=false;stuLessonView=null;stuLessonTab='goals';folderTopicId=null;folderLessonName=null;folderModule='goals';focusId='pageTitle';render();window.scrollTo(0,0);

function doForgot(){
  const em=(document.getElementById('em').value||'').trim().toLowerCase();authEmail=em;
  if(supabaseClient&&authMode==='forgot'&&!sess?.backend&&!ACCT[em]){
    supabaseClient.auth.resetPasswordForEmail(em,{redirectTo:location.href.split('#')[0]}).then(({error})=>{authMode='login';authErr=error?'Không gửi được email đặt lại mật khẩu: '+backendErrorText(error):'';authMsg=error?'':'Nếu email tồn tại, Supabase đã gửi hướng dẫn đặt lại mật khẩu.';render()});return;
  }
  mailFor='';if(ACCT[em]&&!ACCT[em].deleted){sendReset(em,false);mailFor=em}
  authMode='login';authErr='';authMsg='Nếu email tồn tại trong hệ thống, đường dẫn đặt lại mật khẩu đã được gửi. Đường dẫn có hiệu lực '+RESET_MIN+' phút.';render();

function doReset(){
  const n=document.getElementById('np').value,n2=document.getElementById('np2').value;
  if(backendRecovery&&supabaseClient){if(n.length<PW_MIN){authErr='Mật khẩu mới phải có ít nhất '+PW_MIN+' ký tự.';render();return}if(n!==n2){authErr='Hai lần nhập mật khẩu không khớp.';render();return}backendBusy=true;authErr='';render();supabaseClient.auth.updateUser({password:n}).then(async({error})=>{backendBusy=false;if(error){authErr='Không cập nhật được mật khẩu: '+backendErrorText(error);render();return}backendRecovery=false;await supabaseClient.auth.signOut();logged=false;sess=null;role='T';authMode='login';authEmail='';authMsg='Đã cập nhật mật khẩu. Hãy đăng nhập lại.';render()});return}
  const t=tokRec();
  if(!t||t.used||simNow()>t.exp){authMode='login';authTok=null;authMsg='';mailFor='';authErr='Mã đặt lại không đúng, đã dùng hoặc đã hết hạn. Hãy gửi lại yêu cầu mới.';render();return}
  if(n.length<PW_MIN){authErr='Mật khẩu mới phải có ít nhất '+PW_MIN+' ký tự.';render();return}
  if(n!==n2){authErr='Hai lần nhập mật khẩu không khớp.';render();return}
  ACCT[t.email].pw=hashPw(n);ACCT[t.email].mustChange=false;dropSetpwNotif(t.email);mailFor='';t.used=true;authTok=null;authMode='login';authErr='';authEmail=t.email;authMsg='Đã đặt mật khẩu. Hãy đăng nhập bằng mật khẩu mới.';render();
}

function loginBgImageUrl(raw){
  const u=new URL(raw),host=u.hostname.toLowerCase();if(!['http:','https:'].includes(u.protocol))throw new Error('protocol');
  if((host==='pexels.com'||host.endsWith('.pexels.com'))&&!host.startsWith('images.')){
    const m=u.pathname.match(/-(\d+)\/?$/);if(!m)throw new Error('pexels-page');
    return 'https://images.pexels.com/photos/'+m[1]+'/pexels-photo-'+m[1]+'.jpeg?auto=compress&cs=tinysrgb&w=1920';
  }
  if((host==='unsplash.com'||host.endsWith('.unsplash.com'))&&!host.startsWith('images.'))throw new Error('unsplash-page');
  return u.href;
}
function applyLoginBgUrl(){

function uploadLoginBg(file){
  if(!file)return;if(!/^image\/(png|jpeg|webp|gif)$/i.test(file.type)){loginBgStatus('Hãy chọn ảnh PNG, JPG, WEBP hoặc GIF.');return}
  if(file.size>15*1024*1024){loginBgStatus('Ảnh tải lên cần nhỏ hơn 15 MB.');return}
  const reader=new FileReader();reader.onerror=()=>loginBgStatus('Không đọc được tệp ảnh.');
  reader.onload=()=>{const img=new Image();img.onerror=()=>loginBgStatus('Tệp này không phải ảnh hợp lệ.');img.onload=()=>{
    try{const maxW=1920,maxH=1200,scale=Math.min(1,maxW/img.naturalWidth,maxH/img.naturalHeight),w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale)),canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const cx=canvas.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(img,0,0,w,h);storeLoginBackground(canvas.toDataURL('image/jpeg',.84))}
    catch(e){loginBgStatus('Không thể xử lý ảnh này. Hãy thử PNG, JPG hoặc WEBP khác.')}
  };img.src=String(reader.result||'')};reader.readAsDataURL(file)
}

function openAccount(){
  const a=acctRec(),av=avOf();
  const curTheme=(AV_THEMES.find(x=>x[0]===(av.theme||'default'))||AV_THEMES[0])[1];
  openDlg({
    title:'Tài khoản của bạn',
    okLabel:'Lưu thay đổi',
    text:`<span style='display:flex;align-items:center;gap:12px'>${avatarHtml(true)}<span><b style='font-size:14px'>${esc(a.name||sess.email)}</b><br><span class='muted'>${esc(sess.email)}</span></span></span>`
      +`<span style='display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0'><button type='button' class='btn light' data-noicon onclick='changePw()'>Đổi mật khẩu</button>`
      +(av.photo?`<button type='button' class='btn light' data-noicon onclick='clearAvatar()'>Xoá ảnh đại diện</button>`:'')
      +(layer4BackgroundData()?`<button type='button' class='btn light' data-noicon onclick='clearLayer4Background()'>Xóa ảnh nền layer 4</button>`:'')+`</span>`
      +`<span class='muted' style='display:block;font-size:12px;margin:10px 0 0'>Email đăng nhập không thay đổi được. Phiên tự hết hạn sau ${SESS_IDLE} phút không hoạt động.</span>`,
    fields:[
      {k:'n',label:'Tên hiển thị',val:a.name||''},
      {k:'av',label:'Màu ảnh đại diện',sel:AV_THEMES.map(x=>x[1]),val:curTheme},
      {k:'ph',label:'Tải ảnh đại diện lên (tệp ảnh, tối đa 2 MB)',file:true,accept:'image/*'},
      {k:'bg',label:'Ảnh nền cho layer 4 (tối đa 2 MB)',file:true,accept:'image/*'}
    ].concat(role==='T'?[{k:'aik',label:'Khoá API Gemini',val:(a.aiKey||''),pw:true}]:[]),
    ok:v=>{
      const nm=String(v.n||'').trim();
      if(nm.length<2)return 'Tên hiển thị phải có ít nhất 2 ký tự.';
      if(nm.length>60)return 'Tên hiển thị tối đa 60 ký tự.';
      const f=v.ph_f,bg=v.bg_f;
      if(f){
        if(!/^image\//.test(f.type||''))return 'Ảnh đại diện phải là tệp hình ảnh.';
        if(f.size>2*1024*1024)return 'Ảnh đại diện vượt giới hạn 2 MB.';
      }
      if(bg){
        if(!/^image\//.test(bg.type||''))return 'Ảnh nền phải là tệp hình ảnh.';
        if(bg.size>2*1024*1024)return 'Ảnh nền vượt giới hạn 2 MB.';
      }
      const cur=acctRec(),theme=AV_KEYS[AV_THEMES.findIndex(x=>x[1]===v.av)]||'default';
      cur.name=nm;cur.avatar=Object.assign({},cur.avatar||{},{theme});
      if(role==='T')cur.aiKey=String(v.aik||'').trim();
      if(f){
        const rd=new FileReader();
        rd.onload=()=>{cur.avatar=Object.assign({},cur.avatar||{},{photo:rd.result});toast('Đã cập nhật ảnh đại diện.');render()};
        rd.onerror=()=>{toast('Không đọc được tệp ảnh. Thông tin khác đã được lưu.')};
        rd.readAsDataURL(f);
      }
      if(bg){
        const rdBg=new FileReader();
        rdBg.onload=()=>{
          try{localStorage.setItem(layer4BackgroundKey(),String(rdBg.result||''));applyLayer4Background();toast('Đã cập nhật ảnh nền layer 4.')}
          catch(e){toast('Không lưu được ảnh nền trong trình duyệt. Hãy dùng ảnh nhỏ hơn.')}
        };
        rdBg.onerror=()=>toast('Không đọc được tệp ảnh nền.');
        rdBg.readAsDataURL(bg);
      }
      toast('Đã cập nhật thông tin tài khoản.');
      return null;
    }
  });
}

function simAns(c, q, ok, i) {

function csvRows(text){
  const s=String(text).replace(/^\ufeff/,''),first=(s.split(/\r?\n/)[0]||'');
  const d=first.indexOf(',')>=0?',':(first.indexOf(';')>=0?';':(first.indexOf('\t')>=0?'\t':','));

  for(let i=0;i<s.length;i++){const ch=s[i];
    if(q){if(ch==='"'){if(s[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;
    else if(ch===d){r.push(cur);cur=''}
    else if(ch==='\n'){r.push(cur);rows.push(r);r=[];cur=''}
    else if(ch!=='\r')cur+=ch}
  if(cur!==''||r.length){r.push(cur);rows.push(r)}

}

/* ===== Đợt 10: luyện tập có chủ đích =====
   Học sinh làm bài tập (không tính bài kiểm tra) và luyện tập lại cho đến khi đạt yêu cầu của bài học
   thì bài học kế tiếp mới mở. Giáo viên cấu hình: điều kiện áp dụng, điểm trung bình bài tập tối thiểu,
   mức nắm vững tối thiểu cho từng mục tiêu. Cấu hình có 3 tầng: lớp → bài học → mục tiêu. */
P.lock='<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>';
P.grading='<rect x="4.5" y="4" width="15" height="17" rx="3.5"/><path d="M9 4V3h6v1"/><path d="M8.6 12.6l2.5 2.5 4.6-5.1"/>';
P.pause='<rect x="6.5" y="5" width="4" height="14" rx="1.4"/><rect x="13.5" y="5" width="4" height="14" rx="1.4"/>';
P.submit='<path d="M4 12.5l5 5L20 6.5"/>';
const PMODE={both:'Cả hai điều kiện',avg:'Chỉ điểm trung bình bài tập',mas:'Chỉ mức nắm vững'};
const PMODEK=Object.keys(PMODE),PMODEV=PMODEK.map(k=>PMODE[k]);
function PR(c){return c.prac||(c.prac={on:false,mode:'both',avg:70,mas:70})}
classes.forEach(PR);
(classes.find(c=>c.id==='10A1')||classes[0]).prac.on=true;   /* lớp mẫu để xem ngay cơ chế */

/* --- Quy tắc tính --- */
const pAvgMin=(c,l)=>l.pa!=null?l.pa:PR(c).avg;
const pMasMin=(c,l,o)=>o.pm!=null?o.pm:(l.pm!=null?l.pm:PR(c).mas);
function pOrder(c){const r=[];c.topics.filter(t=>t.status==='Đã xuất bản').forEach(t=>c.lessonsData.filter(l=>l.tid===t.id&&l.status==='Đã xuất bản').forEach(l=>r.push(l)));return r}
/* Bài tập thuộc bài học: gắn với mục tiêu của bài học, hoặc phạm vi đặt đúng bài học đó. Bài tập không tính. */
function pAsgs(c,l){return c.assignments.filter(a=>a.status==='Đã xuất bản'&&scopeLive(c,a)&&((a.objs||[]).some(j=>l.objs.some(o=>o.idx===j))||(a.scope&&a.scope.type==='lesson'&&a.scope.ref===l)))}
/* Mức nắm vững chỉ từ bằng chứng của bài tập (cùng công thức giảm theo thời gian), bỏ bằng chứng bài kiểm tra */
function pMas(s,j){let w=0,t=0;(s.ev[j]||[]).forEach(x=>{if(x.src!=='Bài tập')return;const k=Math.pow(.5,(today-x.day)/HL);w+=k*x.s;t+=k});return t?w/t:null}
function pCrit(c,s,l){
  const P0=PR(c),si=c.students.indexOf(s),it=[];
  if(P0.mode!=='mas'){
    const A=pAsgs(c,l);
    if(A.length){
      const g=A.filter(a=>a.subs[si]&&a.subs[si].score!=null),v=g.length?mean(g.map(a=>a.subs[si].score/a.max)):null,need=pAvgMin(c,l);
      it.push({k:'avg',done:g.length,total:A.length,v,need,ok:g.length===A.length&&v+1e-9>=need/100});
    }
  }
  if(P0.mode!=='avg')l.objs.forEach(o=>{const m=pMas(s,o.idx),need=pMasMin(c,l,o);it.push({k:'mas',o,m,need,ok:m!=null&&m+1e-9>=need/100})});
  return it;
}
const pWaived=(s,l)=>!!(s.waive&&s.waive.has(l));
/* Bài học không có yêu cầu nào áp dụng thì coi như đạt, để học sinh không bị kẹt */
const pDone=(c,s,l)=>pWaived(s,l)||pCrit(c,s,l).every(x=>x.ok);
function pBlock(c,s,l){
  if(!PR(c).on)return null;
  for(const p of pOrder(c)){if(p===l)return null;if(!pDone(c,s,p))return p}
  return null;
}
const pLesOfAsg=(c,a)=>pOrder(c).filter(l=>pAsgs(c,l).includes(a));
function pAsgBlock(c,s,a){
  if(!PR(c).on)return null;
  const L=pLesOfAsg(c,a);if(!L.length||L.some(l=>!pBlock(c,s,l)))return null;
  return pBlock(c,s,L[0]);
}
function pCanRedo(c,s,a){
  const b=a.subs[c.students.indexOf(s)];
  if(!PR(c).on||!b||!b.has||b.score==null||!(a.maxTries>=1)||pTriesOf(b)>=pMax(a,b))return false;
  return pLesOfAsg(c,a).some(l=>!pBlock(c,s,l)&&!pDone(c,s,l));
}
const pTriesOf=b=>b?(b.tries||(b.has?1:0)):0;
/* Số lượt tối đa của từng học sinh = lượt cơ bản của bài tập (cả lớp) + lượt giáo viên cấp thêm riêng cho em đó (b.extra) */
const pMax=(a,b)=>(a.maxTries>=1?a.maxTries:0)+((b&&b.extra)||0);
const pPrevTxt=(a,h)=>h.score==null?'chưa chấm':h.score+'/'+a.max;
const pHist=(a,b)=>b&&b.has?`<div class='muted' style='margin-top:6px'>Đã dùng ${pTriesOf(b)}/${pMax(a,b)} lượt làm${b.extra?' (gồm '+b.extra+' lượt giáo viên cấp thêm)':''}${b.hist&&b.hist.length?' · các lần trước: '+b.hist.map(h=>pPrevTxt(a,h)).join(' → '):''}</div>`:'';
const pTry=(a,b)=>b&&b.hist&&b.hist.length?` <span class='muted'>(lần ${pTriesOf(b)}/${pMax(a,b)} · lần trước ${pPrevTxt(a,b.hist[b.hist.length-1])})</span>`:'';
function pRedoBtn(c,s,a,i){
  const b=a.subs[c.students.indexOf(s)];
  if(pCanRedo(c,s,a))return `<button type='button' class='btn student-redo-cta' data-noicon='1' onclick='openAssignmentMode(${i})'>${ic('play',16)}<span>${b.redo?'Tiếp tục · chọn trò chơi':'Chọn trò chơi luyện tập'} · còn ${pMax(a,b)-pTriesOf(b)} lượt</span></button>`;
  if(PR(c).on&&b&&b.has&&b.score!=null&&pTriesOf(b)>=pMax(a,b)&&pLesOfAsg(c,a).some(l=>!pBlock(c,s,l)&&!pDone(c,s,l)))return `<span class='muted'>Em đã dùng hết ${pMax(a,b)} lượt làm bài này. Hãy nhờ giáo viên hỗ trợ.</span>`;
  return '';
}
function pStuck(c,s,l){const si=c.students.indexOf(s),A=pAsgs(c,l);return A.length>0&&A.every(a=>{const b=a.subs[si];return b&&b.has&&b.score!=null&&pTriesOf(b)>=pMax(a,b)})}
const pLockedAsg=(a,i,blk)=>`<div class='item' id='as-${i}' tabindex='-1' style='display:block'><div class='row between'><div><span class='row' style='gap:6px;align-items:center'>${ic('lock',16)}<b>${esc(a.name)}</b></span><div class='muted'>Bài tập thuộc bài học chưa mở. Em cần đạt yêu cầu luyện tập của bài “${esc(blk.name)}” trước.</div></div><span class='pill plain'>Chưa mở</span></div></div>`;

/* ===== Bài tập hai loại: QUIZ (bộ câu hỏi) và FILE (nộp tệp / văn bản) =====
   QUIZ: giáo viên dựng danh sách câu hỏi (ngân hàng, soạn mới, AI) có thứ tự và điểm từng câu. Khi học sinh bắt đầu,
   hệ thống chụp lại ĐỦ các câu theo ĐÚNG thứ tự đó. Câu trắc nghiệm tự chấm, câu tự luận / trả lời ngắn do giáo viên chấm.
   Bằng chứng học tập ghi theo từng mục tiêu từ điểm các câu thuộc mục tiêu đó. Luyện tập lại = làm lại toàn bộ bộ câu hỏi. */
const asgIsQ=a=>a.kind==='QUIZ';
const asgWork=a=>a.subs.some(b=>b&&(b.has||b.redo));
const asgSum=a=>+((a.qs||[]).reduce((n,x)=>n+x.w,0)).toFixed(2);
const objLabels=c=>{const all=[];c.lessonsData.forEach(l=>(l.objs||[]).forEach(o=>all.push({code:o.code,j:o.idx,lesson:l.name})));

function survivalSetAnswer(qi,v){const R=rdR();if(!R)return;R.feedback=R.feedback||{};delete R.feedback[qi];rdSet(qi,v);survivalSync(R)}
function survivalChoose(qi,oi){survivalSetAnswer(qi,oi);render()}
function survivalToggle(qi,oi){const R=rdR();if(!R)return;const id=R.qs[qi].id,r=R.ans[id]||[];R.ans[id]=r.includes(oi)?r.filter(x=>x!==oi):r.concat([oi]);R.feedback=R.feedback||{};delete R.feedback[qi];rdTouch(qi);render()}
function survivalAnswerLabel(q,v){if(v==null)return '';if(q.type==='MULTIPLE_CHOICE')return (v||[]).map(i=>q.opts[i]).join(' · ');return q.opts&&q.opts[v]!=null?q.opts[v]:String(v)}
function survivalSync(R){
  if(!R)return;const done=R.qs.filter(q=>rdAnswered(q,R.ans[q.id])).length,total=R.qs.length,p=total?Math.round(done/total*100):0,correct=Object.values(R.feedback||{}).filter(x=>x&&x.ok).length;

}
function survivalAnswerState(q,v){if(!q)return 'Chọn đáp án để tiếp tục.';if(q.type==='MULTIPLE_CHOICE')return Array.isArray(v)&&v.length?v.length+' lựa chọn đã đánh dấu':'Chọn một hoặc nhiều lựa chọn';if(q.type==='SHORT_ANSWER'||q.type==='ESSAY')return String(v||'').trim()?'Câu trả lời đã được lưu':'Nhập câu trả lời để nhận phản hồi';return v==null?'Chưa chọn đáp án':'Đáp án đã được lưu'}
function survivalCheck(){
  const c=redo&&redo.c,s=redo&&redo.s,R=rdR();if(!R)return;
  const qi=R.gameIndex||0,q=R.qs[qi],v=R.ans[q.id];if(!rdAnswered(q,v)){toast('Hãy trả lời câu hỏi trước khi kiểm tra.');return}
  R.feedback=R.feedback||{};if(R.feedback[qi])return;

  const ok=autoScore(source,1,v)===1;

}
function survivalFinish(){
  const R=rdR();if(!R){toast('Không tìm thấy lượt chơi đang mở.');return}
  const missing=[];R.qs.forEach((q,i)=>{if(!rdAnswered(q,R.ans[q.id]))missing.push(i)});
  if(missing.length){R.miss=missing;R.gameIndex=missing[0];render();toast('Còn câu chưa trả lời. Đã đưa em tới câu '+(missing[0]+1)+'.');return}
  try{rdSubmit()}catch(e){console.error('survivalFinish failed',e);toast('Chưa thể kết thúc lượt chơi. Hãy thử lại; câu trả lời vẫn được giữ.');}
}
function survivalMove(dir){
  const R=rdR();if(!R)return;const i=Number.isInteger(R.gameIndex)?R.gameIndex:0;
  if(dir<0){R.gameIndex=Math.max(0,i-1);render();return}
  const q=R.qs[i];if(!rdAnswered(q,R.ans[q.id])){toast('Trả lời câu này trước khi đi tiếp.');return}
  if(!(R.feedback||{})[i]){toast('Bấm “Kiểm tra & nhận gợi ý” để nhận phản hồi cho chặng này.');return}
  if(i>=R.qs.length-1){survivalFinish();return}R.gameIndex=i+1;render();
}
function survivalRevise(){const R=rdR();if(!R)return;delete (R.feedback||{})[R.gameIndex||0];render()}

/* đổi tên bài tập: bật/tắt nút Giao bài tập mà không cần vẽ lại toàn trang */
function abNameTick(v){const b=document.getElementById('ab-giao')||document.querySelector('.asgbar .btn:last-child');if(b&&b.tagName==='BUTTON')b.disabled=!String(v).trim()}
/* tick mục tiêu cho bài nộp tệp (mục tiêu quyết định bằng chứng học tập) */
function asgObjPick(j){
  const c=selected(),a=asgCur(c);if(!a)return;
  a.objs=a.objs||[];
  const i=a.objs.indexOf(j);if(i>=0)a.objs.splice(i,1);else a.objs.push(j);
  a.objs.sort((x,y)=>x-y);a.upd=stamp();render();
}
function objPick(c,a){return `<div class='ab-objs'><div class='muted' style='font-size:.8125rem;margin:12px 0 6px'>Mục tiêu bài đo</div>${c.goals.map((gl,j)=>`<label class='objrow'><input type='checkbox' ${(a.objs||[]).includes(j)?'checked':''} onchange='asgObjPick(${j})'><span><b>${codeOf(c,j)||'Mục tiêu '+(j+1)}</b> ${esc(gl)}</span></label>`).join('')}</div>`}
/* bộ lọc câu hỏi được áp lại sau mỗi lần vẽ để giữ nguyên trạng thái khi tick câu */

window.render=function(){_rd0();if(document.querySelector('.qgrp'))asgApplyFilters()};
/* trình tạo bài tập đã được chèn ngay dưới nút (+) bên trong assignmentsPage(),
   nên không bọc lại ở đây (trước đây bọc thêm khiến nó bị đẩy lên trên dải tab). */

/* --- Học sinh: bài học bị khóa, bảng yêu cầu --- */
function pRow(head,sub,ok){return `<div class='row between' style='padding:6px 0'><span>${head}<div class='muted'>${sub}</div></span><span class='pill ${ok?'good':'prog'}'>${ic(ok?'check':'trend',14)}${ok?'Đạt':'Chưa đạt'}</span></div>`}
function pStuCheck(c,s,l){
  const it=pCrit(c,s,l);if(!it.length)return '';
  const ok=pDone(c,s,l),w=pWaived(s,l),O=pOrder(c),nx=O[O.indexOf(l)+1];
  const rows=it.map(x=>x.k==='avg'
    ?pRow('<b>Điểm trung bình bài tập</b>','Đã chấm '+x.done+'/'+x.total+' bài · điểm trung bình hiện tại '+(x.v==null?'chưa có':pct(x.v)+'%')+' · yêu cầu ≥ '+x.need+'%',x.ok)
    :pRow('<b>'+esc(x.o.code)+'</b> '+esc(x.o.desc),'Mức nắm vững yêu cầu ≥ '+x.need+'% · hiện tại: '+(x.m==null?'chưa có dữ liệu':TIER[tier(x.m)].label),x.ok)).join('');
  const stuck=!ok&&pStuck(c,s,l);
  const msg=stuck?'Em đã dùng hết lượt làm các bài tập của bài này mà chưa đạt yêu cầu. Hãy nhờ giáo viên hỗ trợ.':ok?(w?'Giáo viên đã cho em đi tiếp.':'Em đã đạt yêu cầu luyện tập.')+(nx?' Bài “'+esc(nx.name)+'” đã mở.':''):'Em cần đạt các yêu cầu dưới đây để '+(nx?'mở bài “'+esc(nx.name)+'”':'hoàn thành luyện tập bài này')+'. Làm bài tập, đọc nhận xét rồi luyện tập lại cho đến khi đạt.';
  return `<div style='margin-top:12px;padding-top:10px;border-top:1px solid var(--line)'><div class='row between'><b style='font-size:13px'>Luyện tập có chủ đích</b><span class='pill ${ok?'good':'prog'}'>${ok?'Đã đạt':'Đang luyện'}</span></div><p class='muted' style='margin:4px 0 6px'>${msg}</p>${rows}${ok||stuck?'':`<div class='row' style='margin-top:8px'><button class='btn light' onclick="setPage('assignments')">Đến bài tập</button></div>`}</div>`;
}
const _ls0=lessonStu;
window.lessonStu=function(c,l,li){
  const s=me();
  if(!s||!PR(c).on)return _ls0(c,l,li);
  const blk=pBlock(c,s,l);
  if(blk)return `<div class='item' id='ls-${li}' tabindex='-1' style='display:block'><div class='row between'><span class='row' style='gap:6px;align-items:center'>${ic('lock',16)}<b>${esc(l.name)}</b></span><span class='pill plain'>Chưa mở</span></div><div class='muted'>Em cần đạt yêu cầu luyện tập của bài “${esc(blk.name)}” để mở bài này.</div></div>`;
  return _ls0(c,l,li);
};

/* --- Giáo viên: cấp thêm lượt làm bài tập cho riêng từng học sinh (không đổi số lượt của cả lớp) --- */
const XTRY_MAX=10;
function triesPanel(c){
  const ai=Math.min(gradeAi,c.assignments.length-1),a=c.assignments[ai];if(!a)return '';
  const own=owns(c),base=a.maxTries>=1?a.maxTries:0;
  const nEx=a.subs.filter(b=>b&&b.extra).length;
  const rows=c.students.map((s,si)=>{
    const b=a.subs[si]||{},used=pTriesOf(b),mx=pMax(a,b),ex=b.extra||0,free=ex-Math.max(0,used-base);
    const lg=(b.xlog||[]).slice(-2).map(x=>`<div class='muted' style='font-size:12px'>${x.n>0?'+':''}${x.n} lượt · ${esc(x.by)}, ${esc(x.at)}${x.r?' · '+esc(x.r):''}</div>`).join('');
    return `<tr><td class='student'>${esc(s.name)}</td><td>${used}</td><td>${base||'–'}${ex?` <span class='pill prog'>+${ex} cấp thêm</span>`:''}</td><td><b>${Math.max(0,mx-used)}</b>${lg}</td><td>${own?`<span class='row' style='flex-wrap:nowrap'><button class='btn light' onclick='grantTries(${ai},${si})' aria-label='Cấp thêm lượt cho ${esc(s.name)}'>Cấp thêm lượt</button>${free>0?`<button class='btn light' onclick='revokeTries(${ai},${si})' aria-label='Thu hồi lượt chưa dùng của ${esc(s.name)}'>Thu hồi</button>`:''}</span>`:''}</td></tr>`}).join('');
  return `<section class='panel' aria-labelledby='h-xt'><h2 id='h-xt'>Lượt làm bài của từng học sinh</h2><p class='lead'>Bài tập đang chọn: <b>${esc(a.name)}</b> · số lượt cơ bản của cả lớp: ${base||'chưa cấu hình'}${nEx?' · '+nEx+' học sinh được cấp thêm riêng':''}. Cấp thêm lượt chỉ áp dụng cho học sinh được chọn, số lượt của cả lớp không thay đổi (đổi số lượt của cả lớp ở mục Quản lý bài tập, nút Sửa).</p>${c.students.length?`<div class='tablewrap'><table><thead><tr><th scope='col'>Học sinh</th><th scope='col'>Đã dùng</th><th scope='col'>Lượt của lớp</th><th scope='col'>Còn lại</th><th scope='col'><span class='sr'>Thao tác</span></th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class='empty'>Lớp chưa có học sinh.</div>`}${PR(c).on?'':note('Lượt làm lại chỉ được dùng khi lớp bật “Luyện tập có chủ đích” (mục Bài học và mục tiêu). Lượt cấp thêm vẫn được lưu, nhưng học sinh chưa luyện tập lại được khi chế độ này đang tắt.')}</section>`;
}
function grantTries(ai,si){
  const c=selected();if(pDenied(c))return;
  const a=c.assignments[ai],s=c.students[si],b=a&&a.subs[si];if(!a||!s||!b)return;
  openDlg({title:'Cấp thêm lượt cho '+esc(s.name),text:'Bài “'+esc(a.name)+'”. Chỉ áp dụng cho học sinh này; số lượt của cả lớp ('+(a.maxTries>=1?a.maxTries:'chưa cấu hình')+') không đổi. Hiện tại: đã dùng '+pTriesOf(b)+'/'+pMax(a,b)+' lượt'+(b.extra?' (gồm '+b.extra+' lượt đã cấp thêm)':'')+'.',okLabel:'Cấp thêm lượt',fields:[{k:'n',label:'Số lượt cấp thêm (số nguyên từ 1 đến '+XTRY_MAX+')',val:'1'},{k:'r',label:'Lý do (không bắt buộc)',val:'',area:true}],ok:v=>{
    const t=String(v.n).trim();
    if(!/^\d+$/.test(t)||+t<1)return 'Số lượt cấp thêm phải là số nguyên từ 1 trở lên.';
    const n=+t;
    if(!c.assignments.includes(a)||!c.students.includes(s))return 'Bài tập hoặc học sinh không còn trong lớp.';
    if((b.extra||0)+n>XTRY_MAX)return 'Tổng lượt cấp thêm cho một học sinh ở một bài tập tối đa '+XTRY_MAX+' (hiện đã cấp '+(b.extra||0)+').';
    b.extra=(b.extra||0)+n;(b.xlog=b.xlog||[]).push({n,r:v.r.trim(),by:acctName(),at:stamp()});
    LOG.unshift('Cấp thêm '+n+' lượt làm “'+a.name+'” cho '+s.name+' ('+c.id+'): tổng lượt của em '+pMax(a,b)+'; lượt của cả lớp giữ nguyên '+a.maxTries);
    notify('EXTRA_TRY_GRANTED','Giáo viên đã cấp thêm '+n+' lượt làm bài tập “'+a.name+'” cho em',{page:'assignments',c,ref:a},s.email);
    toast('Đã cấp thêm '+n+' lượt cho '+s.name+'. Số lượt của cả lớp không đổi.');return null}});
}
function revokeTries(ai,si){
  const c=selected();if(pDenied(c))return;
  const a=c.assignments[ai],s=c.students[si],b=a&&a.subs[si];if(!a||!s||!b)return;
  const base=a.maxTries>=1?a.maxTries:0,free=(b.extra||0)-Math.max(0,pTriesOf(b)-base);
  if(free<=0){toast('Không còn lượt cấp thêm chưa dùng để thu hồi.');return}
  openDlg({title:'Thu hồi lượt cấp thêm?',text:'Thu hồi '+free+' lượt cấp thêm chưa dùng của '+esc(s.name)+' ở bài “'+esc(a.name)+'”. Các lượt em đã dùng được giữ nguyên.',danger:true,okLabel:'Thu hồi '+free+' lượt',ok:()=>{
    const f2=(b.extra||0)-Math.max(0,pTriesOf(b)-base);
    if(f2<=0)return 'Không còn lượt chưa dùng để thu hồi.';
    b.extra=(b.extra||0)-f2;if(!b.extra)delete b.extra;
    (b.xlog=b.xlog||[]).push({n:-f2,r:'Thu hồi lượt chưa dùng',by:acctName(),at:stamp()});
    LOG.unshift('Thu hồi '+f2+' lượt cấp thêm của '+s.name+' ở “'+a.name+'” ('+c.id+')');
    toast('Đã thu hồi '+f2+' lượt chưa dùng của '+s.name+'.');return null}});
}

/* --- Giáo viên: cấu hình và theo dõi --- */
const pDenied=c=>{if(owns(c))return false;toast('Bị từ chối: lớp này không do bạn phụ trách.');return true};
function pCfg(){
  const c=selected();if(pDenied(c))return;const P0=PR(c);
  openDlg({title:'Cấu hình luyện tập có chủ đích',text:'Khi bật, học sinh phải đạt yêu cầu của bài học hiện tại mới mở được bài kế tiếp. Chỉ bài tập được tính; bài kiểm tra không tính. Mỗi bài học và mỗi mục tiêu có thể đặt yêu cầu riêng.',okLabel:'Lưu cấu hình',fields:[
    {k:'on',label:'Trạng thái',val:P0.on?'Bật':'Tắt',sel:['Bật','Tắt']},
    {k:'m',label:'Điều kiện áp dụng',val:PMODE[P0.mode],sel:PMODEV},
    {k:'a',label:'Điểm trung bình bài tập tối thiểu của mỗi bài học (%)',val:String(P0.avg)},
    {k:'s',label:'Mức nắm vững tối thiểu của mỗi mục tiêu (%)',val:String(P0.mas)}],ok:v=>{
    const a=parseInt(v.a,10),m=parseInt(v.s,10);
    if(!(a>=1&&a<=100)||String(a)!==v.a.trim())return 'Điểm trung bình tối thiểu phải là số nguyên từ 1 đến 100.';
    if(!(m>=1&&m<=100)||String(m)!==v.s.trim())return 'Mức nắm vững tối thiểu phải là số nguyên từ 1 đến 100.';
    P0.on=v.on==='Bật';P0.mode=PMODEK[PMODEV.indexOf(v.m)];P0.avg=a;P0.mas=m;
    LOG.unshift('Luyện tập có chủ đích ('+c.id+'): '+(P0.on?'bật':'tắt')+' · '+PMODE[P0.mode]+' · điểm trung bình ≥ '+a+'% · nắm vững ≥ '+m+'%');
    toast(P0.on?'Đã bật luyện tập có chủ đích cho lớp '+c.id+'.':'Đã tắt luyện tập có chủ đích; mọi bài học được mở.');return null}});
}
function pLes(li){
  const c=selected();if(pDenied(c))return;const l=c.lessonsData[li];
  openDlg({title:'Yêu cầu của bài học “'+esc(l.name)+'”',text:'Để trống ô nào thì dùng cấu hình chung của lớp (điểm trung bình ≥ '+PR(c).avg+'%, nắm vững ≥ '+PR(c).mas+'%).',okLabel:'Lưu yêu cầu',fields:[
    {k:'a',label:'Điểm trung bình bài tập tối thiểu của bài học (%)',val:l.pa!=null?String(l.pa):''},
    {k:'s',label:'Mức nắm vững tối thiểu mặc định của các mục tiêu trong bài (%)',val:l.pm!=null?String(l.pm):''},
    {k:'o',label:'Mục tiêu có yêu cầu riêng: mỗi dòng “mã | %”. Mã trong bài: '+l.objs.map(o=>o.code).join(', '),val:l.objs.filter(o=>o.pm!=null).map(o=>o.code+' | '+o.pm).join(NL),area:true}],ok:v=>{
    const rd=t=>{t=t.trim();if(!t)return null;const n=parseInt(t,10);return n>=1&&n<=100&&String(n)===t?n:NaN};
    const a=rd(v.a),s0=rd(v.s);
    if(Number.isNaN(a))return 'Điểm trung bình phải là số nguyên từ 1 đến 100 hoặc để trống.';
    if(Number.isNaN(s0))return 'Mức nắm vững mặc định phải là số nguyên từ 1 đến 100 hoặc để trống.';
    const ov=new Map();
    for(const ln of v.o.split(NL).map(x=>x.trim()).filter(Boolean)){
      const p=ln.split(/[|\s]+/).filter(Boolean),code=(p[0]||'').toUpperCase(),n=rd(p[1]||'');
      const o=l.objs.find(x=>x.code.toUpperCase()===code);
      if(!o)return 'Mục tiêu '+esc(code)+' không thuộc bài học này.';
      if(n==null||Number.isNaN(n)||p.length!==2)return 'Dòng “'+esc(ln)+'” cần đúng dạng “mã | %” với % từ 1 đến 100.';
      if(ov.has(o))return 'Không đặt trùng yêu cầu cho '+esc(code)+'.';
      ov.set(o,n);
    }
    l.pa=a;l.pm=s0;l.objs.forEach(o=>{o.pm=ov.has(o)?ov.get(o):null});l.upd=stamp();
    toast('Đã lưu yêu cầu luyện tập của bài học.');return null}});
}
function pWaive(si){
  const c=selected();if(pDenied(c))return;const s=c.students[si],l=pOrder(c).find(x=>!pDone(c,s,x));if(!l)return;

function pUnwaive(si){

    s.waive=new Set();LOG.unshift('Luyện tập có chủ đích ('+c.id+'): thu hồi việc cho đi tiếp của '+s.name);toast('Đã thu hồi.');return null}});
}
function pReq(c,l){
  const P0=PR(c),r=[];
  if(P0.mode!=='mas'){const n=pAsgs(c,l).length;r.push(n?'Điểm trung bình '+n+' bài tập ≥ '+pAvgMin(c,l)+'%':'Chưa có bài tập gắn với bài học')}
  if(P0.mode!=='avg')r.push(l.objs.length?l.objs.map(o=>esc(o.code)+' ≥ '+pMasMin(c,l,o)+'%').join(', '):'Chưa có mục tiêu');
  return r.join('<br>');
}
function pCell(c,s,l){
  if(pBlock(c,s,l))return `<span class='pill plain'>${ic('lock',14)}Chưa mở</span>`;
  if(pDone(c,s,l))return `<span class='pill good'>${ic('check',14)}Đạt</span>`+(pWaived(s,l)?`<div class='muted'>Được cho đi tiếp</div>`:'');
  const it=pCrit(c,s,l),av=it.find(x=>x.k==='avg'),bad=it.filter(x=>x.k==='mas'&&!x.ok).length,stuck=pStuck(c,s,l);
  const d=[av?'TB '+(av.v==null?'–':pct(av.v)+'%')+' · '+av.done+'/'+av.total+' bài':'',bad?bad+' mục tiêu chưa đạt':''].filter(Boolean).join(' · ');
  return `<span class='pill ${stuck?'need':'prog'}'>${ic(stuck?'alert':'trend',14)}${stuck?'Hết lượt làm':'Đang luyện'}</span>${d?`<div class='muted'>${d}</div>`:''}`;

function pPanels(c){
  const P0=PR(c),O=pOrder(c),own=owns(c);

  if(!P0.on||!O.length||!c.students.length)return cfg;
  const prog=`<section class='panel' aria-labelledby='h-pp'><h2 id='h-pp'>Tiến độ luyện tập của học sinh</h2><p class='lead'>Số liệu tính từ bài tập đã chấm; bài đang chờ chấm lại vẫn tính theo lần chấm gần nhất.</p><div class='tablewrap'><table><thead><tr><th scope='col'>Học sinh</th>${O.map(l=>`<th scope='col'>${esc(l.name)}</th>`).join('')}<th scope='col'><span class='sr'>Thao tác</span></th></tr></thead><tbody>${c.students.map((s,si)=>{const cur=O.find(l=>!pDone(c,s,l));return `<tr><td class='student'>${esc(s.name)}</td>${O.map(l=>`<td>${pCell(c,s,l)}</td>`).join('')}<td>${own?`<span class='row'>${cur?`<button class='btn light' onclick='pWaive(${si})' aria-label='Cho ${esc(s.name)} đi tiếp'>Cho đi tiếp</button>`:''}${s.waive&&s.waive.size?`<button class='btn light' onclick='pUnwaive(${si})' aria-label='Thu hồi cho ${esc(s.name)}'>Thu hồi</button>`:''}</span>`:''}</td></tr>`}).join('')}</tbody></table></div></section>`;

function rubricLocked(a){return (a.subs||[]).some(b=>b&&b.has)}
function rubricDefaults(a){
  const names=['Nội dung & độ chính xác','Lập luận / vận dụng','Minh chứng & sản phẩm','Cấu trúc & trình bày'];
  const desc=['Kiến thức chính xác, đáp ứng yêu cầu đề bài.','Phân tích, lập luận hoặc vận dụng kiến thức phù hợp.','Ví dụ, nguồn dẫn hoặc sản phẩm có chất lượng và phù hợp.','Bố cục rõ ràng, diễn đạt dễ hiểu, trình bày cẩn thận.'];
  const ratios=[.4,.3,.2,.1];return names.map((name,i)=>({name,max:+(a.max*ratios[i]).toFixed(2),description:desc[i]}));
}
function rubricEditor(i){
  const a=selected().assignments[i];
  if(!a||asgIsQ(a)){toast('Rubric chỉ áp dụng cho bài tự luận hoặc bài nộp dự án.');return}
  if(rubricLocked(a)){toast('Rubric đã khóa vì đã có học sinh nộp bài.');return}
  const base=(a.rubric&&a.rubric.length?a.rubric:rubricDefaults(a)).slice(0,5),rows=Array.from({length:5},(_,i)=>base[i]||{name:'',max:'',description:''});
  const fields=[];
  rows.forEach((r,j)=>fields.push(
    {k:'n'+j,label:'Tiêu chí '+(j+1)+' · tên',val:r.name||''},
    {k:'m'+j,label:'Tiêu chí '+(j+1)+' · điểm tối đa',val:r.max==null?'':r.max},
    {k:'d'+j,label:'Tiêu chí '+(j+1)+' · mô tả (không bắt buộc)',val:r.description||'',area:true}
  ));
  openDlg({title:'Rubric chấm điểm · '+esc(a.name),text:'Tạo từ 2–5 tiêu chí. Tổng điểm tối đa của các tiêu chí phải đúng bằng '+a.max+' điểm. Có thể xóa rubric bằng cách để trống toàn bộ tiêu chí. Rubric sẽ khóa sau khi có bài nộp đầu tiên.',fields,ok:v=>{
    const next=[];
    for(let j=0;j<5;j++){
      const name=String(v['n'+j]||'').trim(),raw=String(v['m'+j]||'').trim().replace(',','.'),description=String(v['d'+j]||'').trim();
      if(!name&&!raw&&!description)continue;
      if(!name||!raw)return 'Tiêu chí '+(j+1)+': cần có cả tên và điểm tối đa.';
      const max=Number(raw);if(!Number.isFinite(max)||max<=0)return 'Điểm tối đa của tiêu chí '+(j+1)+' phải lớn hơn 0.';
      next.push({name,max,description});
    }
    if(next.length===1)return 'Rubric cần ít nhất 2 tiêu chí; hoặc để trống toàn bộ để bỏ rubric.';
    if(next.length&&Math.abs(next.reduce((t,x)=>t+x.max,0)-Number(a.max))>.011)return 'Tổng điểm tối đa rubric ('+next.reduce((t,x)=>t+x.max,0)+') phải bằng điểm tối đa bài tập ('+a.max+').';
    const seen=new Set();for(const r of next){const k=r.name.toLocaleLowerCase();if(seen.has(k))return 'Tên tiêu chí bị trùng: '+r.name+'.';seen.add(k)}
    a.rubric=next;a.rubricUpdated=stamp();toast(next.length?'Đã lưu rubric với '+next.length+' tiêu chí.':'Đã bỏ rubric.');return null
  }});
}
function rubricGradeFields(a,b){
  const r=a.rubric||[],saved=b&&b.rubricScores||[];
  return r.flatMap((x,i)=>{const old=saved[i]||{};return [
    {k:'rp'+i,label:esc(x.name)+' · điểm (0–'+x.max+')',val:old.score==null?'':old.score},
    {k:'rc'+i,label:esc(x.name)+' · nhận xét (không bắt buộc)',val:old.comment||'',area:true}
  ]});
}
function rubricRead(v,a){
  const out=[];let total=0;
  (a.rubric||[]).forEach((r,i)=>{
    const raw=String(v['rp'+i]==null?'':v['rp'+i]).trim().replace(',','.');
    if(raw==='')return;
    const score=Number(raw);if(!Number.isFinite(score)||score<0||score>r.max)return;
    total+=score;out.push({name:r.name,max:r.max,score,comment:String(v['rc'+i]||'').trim()});
  });
  if(out.length!==(a.rubric||[]).length)return {error:'Hãy nhập điểm cho từng tiêu chí rubric.'};
  for(let i=0;i<out.length;i++)if(out[i].score>(a.rubric[i].max+1e-9)||out[i].score<0)return {error:'Điểm tiêu chí “'+a.rubric[i].name+'” phải từ 0 đến '+a.rubric[i].max+'.'};
  return {total:Math.round(total*100)/100,scores:out};
}
function rubricPreviewHtml(a){
  if(!a.rubric||!a.rubric.length)return '';
  return `<details class='rubric-preview'><summary>Tiêu chí chấm · ${a.rubric.length} tiêu chí · ${esc(a.max)} điểm</summary><div class='rubric-preview-list'>${a.rubric.map(r=>`<div><b>${esc(r.name)}</b><span>Tối đa ${esc(r.max)} điểm</span>${r.description?`<small>${esc(r.description)}</small>`:''}</div>`).join('')}</div></details>`;
}
function rubricResultHtml(b){
  if(!b||!b.rubricScores||!b.rubricScores.length)return '';
  return `<section class='rubric-result' aria-label='Điểm theo tiêu chí'><b class='rubric-result-title'>Chi tiết rubric</b>${b.rubricScores.map(r=>`<div class='rubric-result-row'><span><b>${esc(r.name)}</b>${r.comment?`<small>${esc(r.comment)}</small>`:''}</span><strong>${esc(r.score)} / ${esc(r.max)}</strong></div>`).join('')}</section>`;
}

  a2.subs[idxName('Lê Thu Hà')].score=8;

/* ===== AI chấm bài trước, giáo viên xác nhận =====
   Luồng: học sinh nộp → AI tự chấm điểm từng câu + viết nhận xét → giáo viên chỉ
   xem lại, sửa nếu muốn rồi bấm “Xác nhận”. Điểm chỉ được ghi vào bằng chứng học tập
   sau khi giáo viên xác nhận; giáo viên vẫn có thể tự chấm tay nếu muốn. */

/* tách từ khóa có nghĩa từ một câu tiếng Việt */
function aiKeys(txt){
  return String(txt||'').toLowerCase()
    .replace(/[.,;:!?()"'“”‘’/\\\-–—]/g,' ')
    .split(/\s+/)
    .map(w=>w.replace(/^(và|của|các|những|một|cho|trong|được|là|với|khi|để|theo|từ|ra|vào|như|nhưng|hoặc|có|không)$/,''))
    .filter(w=>w.length>=4);
}
/* tỉ lệ khớp từ khóa giữa câu trả lời và mục tiêu mà câu hỏi đo */
function aiMatch(answer,goal){
  const ks=aiKeys(goal),txt=' '+String(answer||'').toLowerCase()+' ';
  if(!ks.length)return 0;
  const hit=ks.filter(k=>txt.indexOf(k)>=0).length;
  return hit/ks.length;
}
/* AI ước lượng điểm + nhận xét cho một câu trả lời tự luận / trả lời ngắn */
function aiAssessSubj(c,q,item,answer){
  const ans=String(answer||'').trim();
  const goalName=(q.objs||[]).map(j=>c.goals[j]).filter(Boolean).join('; ');
  if(!ans)return {got:0,fb:'Bỏ trống câu này.'+(goalName?' Cần trả lời nội dung: '+goalName+'.':'')};
  const m=aiMatch(ans,goalName),len=ans.length;
  let frac=0.3+0.45*m+0.25*Math.min(1,len/220);
  if(q.type==='SHORT_ANSWER')frac=Math.min(frac+0.05,1);
  frac=Math.max(0.15,Math.min(1,frac));
  const got=Math.max(0.5,Math.round(item.w*frac*2)/2);
  let fb;
  if(frac>=0.85)fb='Trả lời đúng trọng tâm'+(goalName?' (“'+goalName+'”)':'')+', diễn đạt rõ.';
  else if(frac>=0.6)fb='Đã nêu được ý chính'+(goalName?' của “'+goalName+'”':'')+', nên bổ sung ví dụ hoặc giải thích thêm.';
  else fb='Còn thiếu ý quan trọng'+(goalName?' so với “'+goalName+'”':'')+'; cần trình bày rõ hơn và thêm ví dụ.';
  if(len<40)fb+=' Câu trả lời còn ngắn.';
  return {got:Math.min(got,item.w),fb};
}
/* AI chấm một bài nộp: trả về điểm từng câu, điểm tổng và nhận xét tổng quát */
function aiReview(c,a,b){
  const per=[],isQ=asgIsQ(a);
  if(isQ){
    (b.qa||[]).forEach((x,i)=>{
      const q=qOf(c,(a.qs||[])[i]?(a.qs[i].qid):null)||{};
      const w=x.w||1,objs=x.objs||[];
      if(isObjT(x.t)){
        const bq=qOf(c,(a.qs||[])[i]?(a.qs[i].qid):null);
        const corr=bq?autoScore(bq,w,rdAnsVal(x,bq)):null;
        const full=corr!=null&&corr>=w;
        const right=bq?(bq.opts||[]).map((o,k)=>[].concat(bq.ans).includes(k)?o:null).filter(Boolean).join(', '):'';
        per.push({got:corr==null?0:corr,fb:full?'Chọn đúng đáp án.':('Chưa đúng'+(right?'; đáp án đúng: '+right:'')+'.')+(objs.length?' Ôn lại: '+objs.map(j=>c.goals[j]).join('; ')+'.':'')});
      }else{
        per.push(aiAssessSubj(c,{objs,type:x.t},x,x.a));
      }
    });
  }else{
    const goals=(a.objs||[]).map(j=>c.goals[j]).filter(Boolean).join('; ');
    const m=aiMatch(b.text||'',goals),len=String(b.text||'').length;
    let frac=0.35+0.45*m+0.2*Math.min(1,len/400);
    frac=Math.max(0.2,Math.min(1,frac));
    const sc=Math.round(a.max*frac*10)/10;
    const words=String(b.text||'').split(/\s+/).filter(Boolean).length;
    per.push({got:sc,fb:'Chấm theo yêu cầu đề bài'+(goals?' (“'+goals+'”)':'')+' · bài làm '+words+' từ'+(b.file?' · có tệp đính kèm':'')+'.'});
  }
  const tw=isQ?per.reduce((n,x,i)=>n+(b.qa[i]?.w||1),0):a.max;
  const tg=per.reduce((n,x)=>n+x.got,0);
  const score=isQ?Math.round(tg/Math.max(tw,1)*a.max*10)/10:tg;
  /* nhận xét tổng quát: điểm mạnh / cần cải thiện theo mục tiêu */
  const byGoal={};
  if(isQ)(b.qa||[]).forEach((x,i)=>{const p=per[i],w=x.w||1;(x.objs||[]).forEach(j=>{const e=byGoal[j]||(byGoal[j]=[0,0]);e[0]+=p.got/((x.objs||[]).length);e[1]+=w/((x.objs||[]).length)})});
  const rates=Object.keys(byGoal).map(j=>({j:+j,r:byGoal[j][0]/Math.max(byGoal[j][1],1)}));
  const strong=rates.filter(x=>x.r>=0.75).map(x=>c.goals[x.j]);
  const weak=rates.filter(x=>x.r<0.6).map(x=>c.goals[x.j]);
  const pctScore=Math.round(score/a.max*100);
  let fb=(pctScore>=85?'Bài làm tốt':pctScore>=60?'Bài làm đạt yêu cầu':'Bài làm còn yếu')+': '+score+'/'+a.max+' điểm ('+pctScore+'%).';
  if(strong.length)fb+=' Nắm chắc: '+strong.slice(0,2).join('; ')+'.';
  if(weak.length)fb+=' Cần cải thiện: '+weak.slice(0,2).join('; ')+'.';
  if(isQ){const blank=(b.qa||[]).filter(x=>!String(x.a||'').trim()).length;if(blank)fb+=' Còn '+blank+' câu bỏ trống.'}
  return {score,fb,per,at:stamp(),by:'AI'};
}
function rdAnsVal(item,bq){
  if(!bq)return null;
  const t=String(item.a==null?'':item.a).trim();
  if(!isObjT(bq.type))return t;
  const opts=bq.opts||[];
  if(bq.type==='MULTIPLE_CHOICE'){const arr=[];opts.forEach((o,k)=>{if(t.split(' · ').indexOf('✓ '+o)>=0||t.indexOf(o)>=0)arr.push(k)});return arr.length?arr:t}
  const k=opts.findIndex(o=>t.indexOf(o)>=0);
  return k>=0?k:t;
}
/* chạy AI cho một bài nộp */
function aiGradeOne(c,ai,si,silent){
  const a=c.assignments[ai],b=a.subs[si];
  if(!b||!b.has)return false;
  b.ai=aiReview(c,a,b);

/* ghi kết quả đã xác nhận vào bài nộp + bằng chứng học tập */
function applyConfirm(c,ai,si,val){

    (b.qa||[]).forEach((x,i)=>{x.got=val.per[i]==null?x.got:val.per[i];if(val.pfb&&val.pfb[i]!=null)x.fb=val.pfb[i]});
    if(!asgFinal(c,ai,si)){
      const tw=(b.qa||[]).reduce((n,x)=>n+(x.w||1),0),tg=(b.qa||[]).reduce((n,x)=>n+(x.got||0),0);

  }else{
    const key='A'+a.aid,before=s.mastery.slice();
    b.score=val.score;b.fb=val.fb||'';
    (a.objs||[]).forEach(j=>{if(!s.ev[j])s.ev[j]=[];const r=b.score/a.max,x=s.ev[j].find(e=>e.key===key);
      if(x){x.s=r;x.day=today}else s.ev[j].push({s:r,day:today,src:'Bài tập',key});recalcPair(s,j)});

  }
  b.gradeSource='AI';b.gradedBy=acctName();b.confirmedAt=stamp();
  recalcClass(c);a.graded=a.subs.filter(x=>x.score!=null).length;
}

function parseObjectivesText(text,l){

  String(text==null?'':text).replace(/\r/g,'').split('\n').forEach((raw,i)=>{
    const line=objCleanLine(raw);if(!line)return;
    const k=nz(line);

    let code='',desc=line;
    const m=/^([^,;|\t]{1,26})\s*[,;|\t]\s*(.+)$/.exec(line);

    if(desc.length<6){err.push('Dòng '+(i+1)+': “'+line.slice(0,40)+'…” quá ngắn nên bị bỏ qua.');return}
    if(seen.has(nz(desc))){warn.push('Dòng '+(i+1)+': trùng nội dung với mục tiêu phía trên nên bị bỏ qua.');return}
    if(code&&used.has(code)){const nc=objNextCode(used);warn.push('Dòng '+(i+1)+': mã '+code+' đã có trong bài học, đổi thành '+nc+'.');code=nc}

  });
