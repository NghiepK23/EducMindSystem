     .replace(/^[ivxlcIVXLC]{1,4}[.)]\s+/,'').replace(/^[a-zA-Z][.)]\s*/,'');
  t=t.replace(/^(?:hoc sinh|hs|sinh vien|sau bai hoc,?\s*hoc sinh|sau khi hoc xong,?\s*hoc sinh)\s*[:,-]?\s*/i,'');
  return t.replace(/\s+/g,' ').trim();
}
function objAIBullet(raw){
  return /^\s*(?:[-–—•*+·▪●○]|\(?\d{1,2}[.)]|\(?[a-zđ][.)]|\(?[ivxlc]{1,4}[.)])\s+/i.test(String(raw||''));
}
/* Tách một dòng dài thành nhiều mục tiêu (dùng khi nhiều mục bị dồn 1 dòng) */
function objAISplit(line){
  const parts=[];let buf='';
  const chunks=String(line).replace(/\s*;\s*/g,'; ').split(/(?<=[;.])\s+/);
  if(chunks.length<2)return [line];
  chunks.forEach(ch=>{
    const k=nz(objAIClean(ch));
    const marker=/^\s*(\(?\d{1,2}[.)]|[-–—•·*+]|[a-zđ]\s*[.)])\s+/i.test(ch);
    const subject=/^(hoc sinh|hs|sinh vien|sau bai hoc)\b/.test(k);
    const startsNew=marker||subject;
    if(buf&&startsNew){parts.push(buf.trim());buf=ch}
    else buf=buf?buf+' '+ch:ch;
  });
  if(buf)parts.push(buf.trim());
  return parts.filter(p=>nz(p).length>=6);
}
/* Lấy các mục tiêu trong một vùng dòng */
function objAITake(block){
  const out=[];let cur='';
  const push=()=>{const t=String(cur).replace(/\s+/g,' ').replace(/[;.,]+$/,'').trim();if(t&&nz(t).length>=6)out.push(t);cur=''};
  block.forEach(raw=>{
    const bullet=objAIBullet(raw),line=objAIClean(raw),k=nz(line);
    if(!k)return;
    if(OBJAI_SUB.test(k)&&k.length<70){push();return}
    /* dòng mở đầu kiểu hoạt động / thiết bị / thời gian: bỏ, ngắt mục đang ghép */
    const subjNoise=OBJAI_NOISE.test(k)&&!(/^(hoc sinh|hs|giao vien|gv)\b/.test(k)&&OBJAI_VS.test(k.slice(0,60))&&!OBJAI_ACT.test(k));
    if(subjNoise){push();return}
    if(k.replace(/[^a-z0-9]/g,'').length<6){push();return}
    const verb=objAIIsVerb(k);
    /* mục tiêu mở bằng dấu “:” thì các gạch đầu dòng bên dưới là ý của chính nó */
    if(cur&&bullet&&/[:;]\s*$/.test(cur)){cur+=' '+line;return}
    const curOpen=!!cur&&!/[.;!?]$/.test(cur);
    const lower=/^[a-zà-ỹđ]/.test(String(raw).trim());
    if(cur&&!bullet&&curOpen&&nz(cur).length<260&&(lower||!verb)){cur+=' '+line;return}   /* dòng bị ngắt giữa câu */
    if(cur&&(bullet||verb))push();
    if(!cur&&!bullet&&!verb)return;                                             /* dòng không phải mục tiêu */
    if(bullet||verb){push();cur=line}                                           /* dòng nối tiếp nhưng câu đã đóng → bỏ */
  });
  push();
  const flat=[];
  out.forEach(t=>{objAISplit(t).forEach(x=>flat.push(x))});
  const seen=new Set(),res=[];
  flat.map(t=>t.replace(/\s+/g,' ').replace(/^[,;.\-–—\s]+|[,;.\s]+$/g,'').trim())
      .filter(t=>nz(t).length>=8)
      .forEach(t=>{
        let c=objAIClean(t);
        if(!c)return;
        /* bỏ mã mục tiêu ở đầu câu: “MT1:”, “LO01.”, “Mục tiêu 2:” … */
        c=c.replace(/^(?:mt|lo|mt|m|o)\s*\d{1,3}\s*[.:)-]\s*/i,'').replace(/^muc tieu\s*\d{1,3}\s*[.:)-]\s*/i,'').trim();
        if(!c)return;
        /* bỏ chủ ngữ “Học sinh” ở đầu câu cho gọn */
        const kc=nz(c);
        const sub=/^(hoc sinh|hs|sinh vien|sau bai hoc,? hoc sinh|sau khi hoc xong,? hoc sinh)\s*[,:-]?\s*/.exec(kc);
        if(sub&&nz(c.slice(sub[0].length)).length>=8)c=c.slice(sub[0].length);
        c=c.replace(/\s+/g,' ').trim();
        if(!c)return;
        c=c[0].toUpperCase()+c.slice(1);
        const key=nz(c);
        if(seen.has(key))return;
        seen.add(key);res.push(c);
      });
  return res;
}
function objAIScore(items){
  let s=0;
  items.forEach(t=>{
    const k=nz(t);
    if(objAIIsVerb(k))s+=2;
    if(k.length>=15&&k.length<=200)s+=1;
    if(/^(nang luc|pham chat|kien thuc|thai do|hoat dong)/.test(k))s-=2;
  });
  return s;
}
/* ====== Bộ máy chính: trả về {found, lines, note} ====== */
function objAIExtract(text){
  const raw=String(text==null?'':text).replace(/\r/g,'').split('\n')
    .map(s=>String(s).replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim()).filter(Boolean);
  if(!raw.length)return {found:false,lines:[],note:'empty'};
  const lines=raw.map(s=>({raw:s,k:nz(objAIClean(s)),head:objAIIsHeadLine(s),stop:OBJAI_STOP.test(nz(s).replace(/^[^a-z0-9]+/,''))}));
  /* 1. Thử từng “vùng mục tiêu”: bắt đầu ở tiêu đề/dòng mở, dừng ở phần kế tiếp */
  const cands=[];
  lines.forEach((L,i)=>{
    const isHead=objAIIsHeadLine(L.raw);
    const isOpen=OBJAI_OPEN.test(nz(objAIClean(L.raw)));
    if(!isHead&&!isOpen)return;
    const block=[];let gap=0;
    const startLevel=objAILevel(L.raw)||1;
    for(let j=i+1;j<lines.length;j++){
      const N=lines[j],nk=nz(N.raw).replace(/^[^a-z0-9]+/,'');
      if(objAIIsHeadLine(N.raw))break;
      /* Hết mục cùng cấp hoặc cấp trên (II., 2., PHẦN…) là hết phần mục tiêu */
      const lv=objAILevel(N.raw);
      const isSub=OBJAI_SUB.test(nk)&&nk.length<70;
      if(lv&&lv<=startLevel&&!isSub&&!objAIStartsVerb(N.raw))break;
      /* “Đánh giá được …”, “Vận dụng được …” là mục tiêu chứ không phải tiêu đề phần */
      const objShape=objAIStartsVerb(N.raw)&&/(^|\s)duoc(\s|$)/.test(nk);
      const isStop=OBJAI_STOP.test(nk)&&!objShape&&(nk.length<70||!objAIIsVerb(objAIClean(N.raw)));
      if(isStop){
        /* Dòng chặn mềm (Sản phẩm, Khởi động, Phiếu học tập…) thường xen giữa
           các dòng của bảng giáo án: bỏ qua vài dòng rồi đọc tiếp.
           Tiêu đề phần lớn (Nội dung, Tiến trình, Thiết bị…) thì dừng hẳn. */
        if(OBJAI_HARD.test(nk)&&objAITake(block).length)break;
        if(++gap>3)break;
        continue;
      }
      if(objAIBullet(N.raw)||objAIIsVerb(nz(objAIClean(N.raw))))gap=0;else if(++gap>4)break;
      block.push(N.raw);
      if(block.length>60)break;
    }
    const items=objAITake(block);
    if(!items.length)return;
    /* ưu tiên vùng nằm sớm trong văn bản, vùng có tiêu đề rõ ràng */
    const pos=i/Math.max(1,lines.length);
    const score=objAIScore(items)+(isHead?4:1)+Math.max(0,3-pos*4);
    cands.push({start:i,items,head:isHead,open:isOpen,score});
  });
  cands.sort((a,b)=>b.score-a.score);
  if(cands.length&&cands[0].items.length){
    const best=cands[0];
    return {found:!!(best.head||best.open),lines:best.items.slice(0,40),note:'section'};
  }
  /* 2. Không thấy tiêu đề: quét toàn văn, ưu tiên dòng có dấu đầu dòng + động từ */
  const bullets=raw.filter(s=>objAIBullet(s)&&objAIIsVerb(nz(objAIClean(s))));
  const pool=bullets.length?bullets:raw.filter(s=>objAIIsVerb(nz(objAIClean(s))));
  const items=objAITake(pool);
  return {found:false,lines:items.slice(0,40),note:'scan'};
}
/* Đường dùng chung với giao diện hiện tại */
function planObjectiveLines(text){
  const R=objAIExtract(text);
  return {found:R.found,lines:R.lines,note:R.note};
}

const OBJAI_SYS='Bạn là trợ lý soạn bài cho giáo viên phổ thông Việt Nam. Nhiệm vụ: đọc giáo án và chỉ trích ra MỤC TIÊU BÀI HỌC (yêu cầu cần đạt của cả bài). Trả lời bằng JSON đúng schema, không thêm lời bình.';
const OBJAI_ASK=[
  'Trích xuất MỤC TIÊU BÀI HỌC (yêu cầu cần đạt của cả bài) từ giáo án dưới đây.',
  'Quy tắc bắt buộc:',

  '2. KHÔNG lấy mục tiêu của từng hoạt động, nhiệm vụ, câu hỏi, sản phẩm học tập, thiết bị, nội dung hay tiến trình dạy học.',
  '3. Giữ nguyên câu chữ tiếng Việt, không thêm số thứ tự, không giải thích, không rút gọn làm mất ý.',
  '4. Nếu một mục tiêu có các ý sau dấu hai chấm thì giữ nguyên toàn bộ các ý đó trong CÙNG một mục tiêu.',
  '5. Nếu giáo án chia Về kiến thức / Về năng lực / Về phẩm chất thì lấy mục tiêu của cả ba nhóm.',
  '6. Tối đa 12 mục tiêu, mỗi mục tiêu là một chuỗi. Không có mục tiêu nào thì trả về {"objectives": []}.',
  '',
  'Định dạng trả về: {"objectives": ["...", "..."]}',
  '',
  'NỘI DUNG GIÁO ÁN:',
  '---'
].join('\n');
function objAIParseModelJSON(raw){
  const t=String(raw||'').replace(/```[a-z]*/gi,'');
  const o=/\[[\s\S]*\]/.exec(t), b=/\{[\s\S]*\}/.exec(t);
  let arr=null;
  try{ if(b){const j=JSON.parse(b[0]);if(j&&Array.isArray(j.objectives))arr=j.objectives} }catch(e){}
  if(!arr)try{ if(o)arr=JSON.parse(o[0]) }catch(e){}
  if(!Array.isArray(arr))return null;
  const out=[];
  arr.forEach(x=>{
    const t=typeof x==='string'?x:String((x&&(x.noi_dung||x.text||x.desc||x.name))||'');
    const c=t.replace(/\s+/g,' ').replace(/^[-–—•·*\d.)\s]+/,'').trim();
    if(nz(c).length>=8&&!out.some(y=>nz(y)===nz(c)))out.push(c);
  });
  return out.length?out.slice(0,20):null;
}
async function objAIGemini(text){
  const key=objAIKey();
  if(!key||typeof fetch!=='function')return null;
  const ctl=typeof AbortController!=='undefined'?new AbortController():null;
  const timer=ctl?setTimeout(()=>{try{ctl.abort()}catch(e){}},OBJAI.timeout||25000):null;
  try{
    const body={
      systemInstruction:{parts:[{text:OBJAI_SYS}]},
      contents:[{role:'user',parts:[{text:OBJAI_ASK+'\n'+String(text).slice(0,14000)}]}],
      generationConfig:{
        temperature:0.1,
        responseMimeType:'application/json',
        responseSchema:{type:'OBJECT',properties:{objectives:{type:'ARRAY',items:{type:'STRING'}}},required:['objectives']}
      }
    };
    const res=await fetch(OBJAI.endpoint+encodeURIComponent(OBJAI.model)+':generateContent',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-goog-api-key':key},
      body:JSON.stringify(body),
      signal:ctl?ctl.signal:undefined
    });
    if(!res.ok)return null;
    const j=await res.json();
    const parts=((j&&j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]);
    const raw=parts.map(p=>p&&p.text?p.text:'').join('');
    return objAIParseModelJSON(raw);
  }catch(e){return null}
  finally{if(timer)clearTimeout(timer)}
}
/* Điều phối: Gemini trước, lỗi/không có khóa thì dùng bộ máy trong trang */
async function planObjectiveLinesSmart(text){
  const viaAI=await objAIGemini(text);
  if(viaAI&&viaAI.length){OBJAI.used='gemini';return {found:true,lines:viaAI,note:'gemini'}}
  OBJAI.used='local';
  return objAIExtract(text);
}

/* Bộ đọc văn bản thuần cho .docx/.txt/.xlsx (dùng lại bộ giải nén Office của trang) */
function docxLines(z){
  const b=z.get('word/document.xml');
  if(!b)throw new Error('Tệp Word không có phần nội dung đọc được.');
  const out=[];
  String(new TextDecoder().decode(b)).replace(/<w:p(?:\s[^>]*)?>([\s\S]*?)<\/w:p>/g,(m,body)=>{const t=xjoin(body);if(t)out.push(t);return m});
  return out;
}
/* Đọc .docx theo thứ tự thật: đoạn văn và từng ô của bảng (mỗi ô một dòng).
   Giáo án thường nằm trong bảng nhiều cột; gộp ô theo hàng sẽ làm mất cấu trúc mục tiêu. */
function docxFlowLines(z){
  const b=z.get('word/document.xml');
  if(!b)return [];
  const x=new TextDecoder().decode(b),out=[];
  const re=/<w:tbl>[\s\S]*?<\/w:tbl>|<w:p(?:\s[^>]*)?>[\s\S]*?<\/w:p>/g;
  let m;
  while((m=re.exec(x))){
    const chunk=m[0];
    if(chunk.indexOf('<w:tbl')===0){
      chunk.replace(/<w:tr(?:\s[^>]*)?>([\s\S]*?)<\/w:tr>/g,(mr,tr)=>{
        tr.replace(/<w:tc(?:\s[^>]*)?>([\s\S]*?)<\/w:tc>/g,(mc,tc)=>{
          const inner=[];
          tc.replace(/<w:p(?:\s[^>]*)?>([\s\S]*?)<\/w:p>/g,(mp,pb)=>{const t=xjoin(pb);if(t)inner.push(t);return mp});
          if(!inner.length){const t=xjoin(tc);if(t)inner.push(t)}
          inner.forEach(l=>out.push(l));
          return mc;
        });
        out.push('');
        return mr;
      });
    }else{
      const t=xjoin(chunk);
      if(t)out.push(t);
    }
  }
  return out;
}
/* Văn bản để trích xuất mục tiêu từ tệp giáo án */
async function objPlanFileText(f){
  const ext=(String(f.name).split('.').pop()||'').toLowerCase();
  if(ext==='docx'){
    const z=await unzipBuf(await f.arrayBuffer());
    const fl=docxFlowLines(z);
    return fl.join('\n')||docxTableLines(z)||docxLines(z).join('\n');
  }
  if(ext==='xlsx'||ext==='xls'||ext==='csv'){
    const rows=await readRows(f);
    return rows.map(r=>(r||[]).map(x=>String(x==null?'':x).trim()).filter(Boolean).join(' | ')).filter(Boolean).join('\n');
  }
  if(ext==='txt'||ext==='md')return new TextDecoder('utf-8').decode(await f.arrayBuffer());
  throw new Error('Chỉ đọc được .docx, .txt, .csv hoặc .xlsx.');
}
function docxTableLines(z){
  let rows=[];
  try{rows=docxRows(z)||[]}catch(e){rows=[]}
  if(!rows.length)return '';
  return rows.map(r=>(r||[]).map(x=>String(x==null?'':x).trim()).filter(Boolean).join(', ')).filter(Boolean).join('\n');
}
async function objLinesFromFile(f){
  const ext=(String(f.name).split('.').pop()||'').toLowerCase();
  if(ext==='docx'){
    const z=await unzipBuf(await f.arrayBuffer()),t=docxTableLines(z);
    return t||docxLines(z).join('\n');
  }
  if(ext==='xlsx'||ext==='xls'||ext==='csv'){
    const rows=await readRows(f);
    return rows.map(r=>(r||[]).map(x=>String(x==null?'':x).trim()).filter(Boolean).join(', ')).filter(Boolean).join('\n');
  }
  if(ext==='txt'||ext==='md'){
    return new TextDecoder('utf-8').decode(await f.arrayBuffer());
  }
  throw new Error('Chỉ đọc được .docx, .txt, .csv hoặc .xlsx.');
}

function objImpModal(title,inner,mode,count){

      `<div class='seg seg-wide' role='tablist' aria-label='Cách tải mục tiêu lên' style='margin-top:10px'>${tabs.map(([k,label])=>`<button type='button' role='tab' data-m='${k}' aria-selected='${mode===k}' onclick="objImpSetMode('${k}')">${label}</button>`).join('')}</div>`+
      `<div id='objImpBody'>${inner}</div>`+

      `</div>`;

  }

}

function asgPlanOpts(correct,pool){
  const k=nz(correct),out=[];
  (pool||[]).forEach(x=>{if(out.length<3&&nz(x)!==k&&!out.some(y=>nz(y)===nz(x)))out.push(x)});
  ['Không có nội dung này trong bài học','Nội dung của một bài học khác','Không liên quan tới yêu cầu cần đạt','Chỉ là hoạt động ngoài giờ lên lớp'].forEach(x=>{
    if(out.length<3&&nz(x)!==k&&!out.some(y=>nz(y)===nz(x)))out.push(x);
  });
  const all=[correct].concat(out);
  const rot=all.length?(String(correct).length%all.length):0;
  const mixed=all.slice(rot).concat(all.slice(0,rot));
  return {opts:mixed,ans:mixed.findIndex(x=>nz(x)===k)};
}
function planFacts(text,l){
  const out=[],seen=new Set(),objLines=new Set(planObjectiveLines(text).lines.map(nz));
  String(text==null?'':text).replace(/\r/g,'').split('\n').forEach(raw=>{
    const t=objCleanLine(raw);if(!t||objLines.has(nz(t)))return;
    const m=/^(.{3,70}?)\s*[:–—]\s*(.{12,160})$/.exec(t);
    if(!m)return;
    const term=m[1].trim(),def=m[2].trim();
    if(/^(muc tieu|noi dung|hoat dong|thoi gian|thiet bi|tai lieu|phuong phap|hinh thuc)/.test(nz(term)))return;
    const k=nz(def);if(seen.has(k))return;seen.add(k);
    out.push({term,def});
  });
  return out;
}
function planBestObj(objs,text){
  const w=nz(text).split(/[^a-z0-9]+/).filter(x=>x.length>2);
  let best=0,score=-1;
  objs.forEach((o,i)=>{const t=nz(o.desc);let s=0;w.forEach(x=>{if(t.indexOf(x)>=0)s++});if(s>score){score=s;best=i}});
  return best;
}
function asgPlanMake(){
  const c=selected(),l=asgPlanLesson(c);
  if(!l||!asgPlan)return;
  const n=Math.max(1,Math.min(20,parseInt((asgPlan.n||'6'),10)||6));
  let objs=(asgPlan.objs||[]).map(o=>({code:o.code,desc:o.desc,idx:objGoalIndex(c,o.desc)}));
  if(!objs.length)objs=(l.objs||[]).map(o=>({code:o.code,desc:c.goals[o.idx]||'',idx:o.idx})).filter(o=>o.desc);
  if(!objs.length){toast('Bài học chưa có mục tiêu nào. Hãy trích xuất từ giáo án hoặc thêm mục tiêu trước.');return}
  const facts=planFacts(String(asgPlan.text||''),l);
  const pool=facts.map(f=>f.def).concat(objs.map(o=>o.desc));
  const allObjTexts=c.lessonsData.flatMap(x=>(x.objs||[]).map(o=>c.goals[o.idx]||'')).filter(Boolean);
  const diff=asgPlan.diff||'MEDIUM';
  const factStem=[
    t=>'Theo giáo án bài “'+l.name+'”, nội dung nào sau đây đúng với “'+t+'”?',
    t=>'Trong giáo án bài “'+l.name+'”, “'+t+'” được hiểu là:'
  ];
  const objStem=[
    ()=>'Nội dung nào sau đây là yêu cầu cần đạt của bài “'+l.name+'”?',
    code=>'Mục tiêu '+code+' của bài “'+l.name+'” yêu cầu học sinh:'
  ];
  const F=facts.map((f,i)=>{
    const pick=asgPlanOpts(f.def,pool.filter(d=>nz(d)!==nz(f.def)));
    const k=planBestObj(objs,f.term+' '+f.def);
    return {content:factStem[i%factStem.length](f.term),type:'SINGLE_CHOICE',opts:pick.opts,ans:pick.ans,objs:[objs[k].idx],diff,bloom:'Hiểu'};
  });
  const O=[];
  objs.forEach((o,i)=>{
    const pick=asgPlanOpts(o.desc,allObjTexts.filter(x=>nz(x)!==nz(o.desc)).concat(['Không có nội dung này trong bài học','Nội dung của một bài học khác']));
    O.push({content:objStem[i%objStem.length](o.code),type:'SINGLE_CHOICE',opts:pick.opts,ans:pick.ans,objs:[o.idx],diff,bloom:'Nhớ'});
  });
  const qs=[];let a=0,b=0,guard=0;
  while(qs.length<n&&(a<F.length||b<O.length)&&guard++<200){
    if(a<F.length&&(qs.length%2===0||b>=O.length))qs.push(F[a++]);
    else if(b<O.length)qs.push(O[b++]);
    else qs.push(F[a++]);
  }
  asgPlan.qs=qs;
  render();
  toast(qs.length?('Đã soạn '+qs.length+' câu hỏi đề xuất. Duyệt rồi bấm “Dùng các câu này”.'):'Chưa soạn được câu nào — giáo án quá ngắn.');
}

/* Thêm mục tiêu cho bài học đang mở: chỉ cần Mã (bắt buộc) và Nội dung (bắt buộc) */
function folderAddObjective(){
  const c=selected(),{l}=folderResolve(c);
  if(!l){toast('Hãy mở một bài học trước.');return}
  const used=new Set((l.objs||[]).map(o=>String(o.code||'').toUpperCase()));
  let n=1;while(used.has('LO'+String(n).padStart(2,'0')))n++;
  openDlg({title:'Thêm mục tiêu cho “'+esc(l.name)+'”',
    text:'Mã mục tiêu và nội dung đều bắt buộc. Mỗi mã dùng một lần trong bài học.',
    okLabel:'Thêm mục tiêu',
    fields:[{k:'c',label:'Mã mục tiêu',val:'LO'+String(n).padStart(2,'0'),hint:'Ví dụ: LO01, LO02…'},{k:'d',label:'Nội dung mục tiêu',val:'',area:true}],
    ok:v=>{
      const code=String(v.c||'').trim().toUpperCase(),d=String(v.d||'').trim();
      if(!code)return 'Mã mục tiêu không được để trống.';
      if(!d)return 'Nội dung mục tiêu không được để trống.';
      if((l.objs||[]).some(o=>String(o.code||'').toUpperCase()===code))return 'Bài học này đã có mã '+esc(code)+': mỗi mã dùng một lần trong bài học.';
      l.objs.push({code,desc:d,idx:addGoal(c,d)});l.upd=stamp();
      toast('Đã thêm mục tiêu '+code+'.');return null}});
}
/* Sửa một mục tiêu của bài học: đổi mã, đổi nội dung. Câu hỏi, bài tập, điểm đã ghi nhận giữ nguyên liên kết. */
function objEdit(i){
  const c=selected(),{l}=folderResolve(c);
  const o=l&&(l.objs||[])[i];if(!o)return;
  const oldCode=String(o.code||codeOf(c,o.idx)).toUpperCase(),oldDesc=c.goals[o.idx]||o.desc||'';
  openDlg({title:'Sửa mục tiêu '+esc(oldCode),
    text:'Đổi mã hoặc nội dung. Câu hỏi, bài tập và điểm đã ghi nhận vẫn giữ nguyên liên kết với mục tiêu này.',
    okLabel:'Lưu thay đổi',
    fields:[{k:'c',label:'Mã mục tiêu',val:oldCode,hint:'Mỗi mã dùng một lần trong bài học.'},{k:'d',label:'Nội dung mục tiêu',val:oldDesc,area:true}],
    ok:v=>{
      const code=String(v.c||'').trim().toUpperCase(),d=String(v.d||'').trim();
      if(!code)return 'Mã mục tiêu không được để trống.';
      if(!d)return 'Nội dung mục tiêu không được để trống.';
      if((l.objs||[]).some(x=>x!==o&&String(x.code||'').toUpperCase()===code))return 'Bài học này đã có mã '+esc(code)+': mỗi mã dùng một lần trong bài học.';
      if(code!==oldCode){
        o.code=code;
        (c.bank||[]).forEach(q=>{
          if(!(q.objs||[]).includes(o.idx))return;
          if(!(q.objCodes||[]).some(x=>String(x).toUpperCase()===oldCode))return;
          q.objCodes=q.objCodes.map(x=>String(x).toUpperCase()===oldCode?code:x);
        });
      }
      if(d!==oldDesc){
        o.desc=d;
        const shared=c.lessonsData.some(x=>x!==l&&(x.objs||[]).some(z=>z.idx===o.idx));
        if(!shared&&nz(c.goals[o.idx]||'')===nz(oldDesc)){c.goals[o.idx]=d}
        else{
          const from=o.idx;
          o.idx=addGoal(c,d);
          (c.bank||[]).forEach(q=>{
            if(!(q.objs||[]).includes(from))return;
            if(!(q.objCodes||[]).some(x=>String(x).toUpperCase()===oldCode))return;
            q.objs=q.objs.map(j=>j===from?o.idx:j);
          });
        }
      }
      l.upd=stamp();render();toast('Đã cập nhật mục tiêu '+code+'.');return null;
    }});
}
/* Xoá mục tiêu khỏi bài học: chỉ bỏ liên kết, giữ mục tiêu chung của lớp, điểm, bằng chứng và câu hỏi để không phần nào bị lỗi */
function objDel(i){
  const c=selected(),{l}=folderResolve(c);
  const o=l&&(l.objs||[])[i];if(!o)return;
  const code=String(o.code||codeOf(c,o.idx)).toUpperCase(),desc=c.goals[o.idx]||o.desc||'';
  const nQ=(c.bank||[]).filter(q=>!q.del&&(q.objs||[]).includes(o.idx)).length
    ,nA=(c.assignments||[]).filter(a=>a.status==='Đã xuất bản'&&(a.objs||[]).includes(o.idx)).length;
  openDlg({title:'Xoá mục tiêu '+esc(code)+'?',danger:true,okLabel:'Xoá mục tiêu',
    text:'Mục tiêu “'+esc(desc)+'” sẽ không còn trong bài học này.'+(nQ||nA?' Hiện có '+nQ+' câu hỏi trong ngân hàng và '+nA+' bài tập đã xuất bản gắn với mục tiêu này.':'')+' Điểm, bằng chứng và câu hỏi liên quan vẫn được giữ, chỉ mục tiêu là ẩn khỏi bài học — các phần khác không bị lỗi và có thể thêm lại mục tiêu bất cứ lúc nào.',
    ok:()=>{
      l.objs.splice(i,1);
      c.trash.unshift({type:'Mục tiêu',name:code+' · '+desc,ref:null,note:'Điểm, bằng chứng và câu hỏi liên quan vẫn được giữ',objIdx:[o.idx],at:stamp()});
      l.upd=stamp();render();toast('Đã xoá mục tiêu '+code+' khỏi bài học. Điểm và câu hỏi liên quan vẫn được giữ.');return null;
    }});
}

function previewRes(id){
  const r=RESREG[id];if(!r)return;
  const real=!!r.blob;
  const box=document.getElementById('resPreviewBox');
  if(!box){toast('Không tìm thấy khu vực xem trước.');return}
  // Toggle: bấm tên file đang được preview → tắt
  if(box.dataset.previewId===id){
    const oldUrl=box.dataset.previewUrl;
    if(oldUrl)URL.revokeObjectURL(oldUrl);
    box.innerHTML='';
    delete box.dataset.previewId;
    delete box.dataset.previewUrl;
    return;
  }
  const ext=String(r.name||'').split('.').pop().toLowerCase();
  // Link: mở tab mới
  if(r.type==='link'){window.open(r.url,'_blank');return}
  if(!real){box.innerHTML=`<div class='folder-empty'>Tệp chưa có nội dung thật để xem trước.</div>`;return}
  // Thu hồi URL cũ nếu đang preview file khác, reset trạng thái
  const oldUrl=box.dataset.previewUrl;
  if(oldUrl)URL.revokeObjectURL(oldUrl);
  box.dataset.previewId=id;
  box.dataset.previewUrl='';
  box.innerHTML='';
  // Chỉ preview ảnh và video phổ biến, các định dạng khác tải xuống
  if(['jpg','jpeg','png','gif','webp'].includes(ext)){
    const url=URL.createObjectURL(r.blob);box.dataset.previewUrl=url;
    box.innerHTML=`<div class='res-preview'><div style='font-weight:600;margin-bottom:6px'>${esc(r.name)}</div><img src='${url}' style='max-width:100%;max-height:320px;border:1px solid var(--line);border-radius:10px'><div class='row' style='margin-top:8px;gap:8px'><button class='btn light' onclick='dlRes("${resId(r)}")'>${ic('download',16)}<span>Tải xuống</span></button></div></div>`;
    setTimeout(()=>{if(box.dataset.previewUrl===url)URL.revokeObjectURL(url);},60000);return;
  }
  if(['mp4','mov','webm','m4v','avi'].includes(ext)){
    const url=URL.createObjectURL(r.blob);box.dataset.previewUrl=url;
    box.innerHTML=`<div class='res-preview'><div style='font-weight:600;margin-bottom:6px'>${esc(r.name)}</div><video controls playsinline src='${url}' style='max-width:100%;max-height:320px;border:1px solid var(--line);border-radius:10px'></video><div class='row' style='margin-top:8px;gap:8px'><button class='btn light' onclick='dlRes("${resId(r)}")'>${ic('download',16)}<span>Tải xuống</span></button></div></div>`;
    setTimeout(()=>{if(box.dataset.previewUrl===url)URL.revokeObjectURL(url);},60000);return;
  }
  // Các định dạng khác (pdf, doc, docx, xlsx, pptx, cpp, zip,…): tải xuống
  dlRes(id);
}

/* Icon theo loại file đính kèm */
function fileIcon(ext){
  const img=['jpg','jpeg','png','gif','webp'];
  const vid=['mp4','mov','webm','m4v','avi'];
  const pdf=['pdf'];
  const doc=['doc','docx'];
  const xls=['xls','xlsx'];
  const ppt=['ppt','pptx'];
  const code=['c','cpp','h','hpp','js','ts','py','java','php','rb','go','rs','swift','kt','cs','sh','bat','sql','html','htm','css','json','xml','csv','md','txt','log','ini','yaml','yml','toml'];
  if(img.includes(ext))return 'file-image';
  if(vid.includes(ext))return 'file-video';
  if(pdf.includes(ext))return 'file-pdf';
  if(doc.includes(ext))return 'file-text';
  if(xls.includes(ext))return 'file-spreadsheet';
  if(ppt.includes(ext))return 'file-presentation';
  if(code.includes(ext))return 'file-code';
  return 'file';
}

  </section>`;
}


/* ===== Nút (+) Thêm tài liệu: mở menu 2 lựa chọn (tải tệp lên / thêm liên kết) ===== */
let resMenuEl=null;
function resMenuClose(){
  if(!resMenuEl)return;
  resMenuEl.remove();resMenuEl=null;
  const b=document.querySelector('.add-res-btn');if(b)b.setAttribute('aria-expanded','false');
  document.removeEventListener('mousedown',resMenuOutside,true);
  document.removeEventListener('keydown',resMenuKey,true);
  window.removeEventListener('scroll',resMenuClose,true);
  window.removeEventListener('resize',resMenuClose);
}
function resMenuOutside(e){if(resMenuEl&&!resMenuEl.contains(e.target)&&!(e.target.closest&&e.target.closest('.add-res-btn')))resMenuClose()}
function resMenuKey(e){if(e.key==='Escape'){resMenuClose();const b=document.querySelector('.add-res-btn');if(b)b.focus()}}
function folderResMenu(ev){
  if(ev){ev.preventDefault();ev.stopPropagation()}
  if(resMenuEl){resMenuClose();return}
  const btn=ev&&ev.currentTarget;
  const el=document.createElement('div');
  el.className='resmenu';el.setAttribute('role','menu');el.setAttribute('aria-label','Thêm tài liệu');
  el.innerHTML=`<button type='button' role='menuitem' onclick="resMenuClose();document.getElementById('resFile').click()">${ic('upload',16)}<span><b>Tải tệp lên</b><small>Tệp từ máy · tối đa ${'50'} MB</small></span></button>
    <button type='button' role='menuitem' onclick="resMenuClose();folderAddLink()">${ic('link',16)}<span><b>Thêm liên kết</b><small>Dán địa chỉ URL (YouTube, trang web…)</small></span></button>`;
  document.body.appendChild(el);
  /* đặt menu ngay dưới nút, luôn nằm trong khung nhìn */
  const r=btn?btn.getBoundingClientRect():{left:16,right:16,bottom:80};
  const w=Math.min(280,window.innerWidth-24);
  el.style.width=w+'px';
  let left=Math.min(Math.max(12,r.right-w),window.innerWidth-w-12);
  let top=r.bottom+8;
  const h=el.offsetHeight||112;
  if(top+h>window.innerHeight-12)top=Math.max(12,r.top-h-8);
  el.style.left=left+'px';el.style.top=top+'px';
  resMenuEl=el;
  btn&&btn.setAttribute('aria-expanded','true');
  const first=el.querySelector('button');if(first)first.focus({preventScroll:true});
  setTimeout(()=>{
    document.addEventListener('mousedown',resMenuOutside,true);
    document.addEventListener('keydown',resMenuKey,true);
    window.addEventListener('scroll',resMenuClose,true);
    window.addEventListener('resize',resMenuClose);
  },0);
}

function folderResPick(file){
  if(!file)return;
  const c=selected(),{l}=folderResolve(c);
  if(!l){toast('Hãy mở một bài học trước.');return}
  const ext=file.name.split('.').pop().toLowerCase();
  if(file.size>52428800){toast('Tệp '+fsize(file.size)+' vượt giới hạn 50 MB, bị từ chối.');return}
  if(!ALLOWED.includes(ext)){toast('Định dạng .'+ext+' không được phép. Cho phép: '+ALLOWED.join(', ')+'.');return}
  l.res=l.res||[];
  l.res.push({name:file.name,size:file.size,blob:file});
  l.upd=stamp();render();toast('Đã đính kèm tài liệu');
}

function folderAddLink(){
  const c=selected(),{l}=folderResolve(c);
  if(!l){toast('Hãy mở một bài học trước.');return}
  openDlg({title:'Thêm liên kết',text:'Nhập địa chỉ trang web (YouTube, trò chơi…). Học sinh bấm vào sẽ mở liên kết ngay.',okLabel:'Thêm liên kết',fields:[{k:'n',label:'Tên hiển thị',val:'Liên kết tham khảo'},{k:'u',label:'Địa chỉ URL',val:'https://'}],ok:v=>{
    const name=String(v.n||'').trim(),url=String(v.u||'').trim();

/* Danh sách bài tập của MỘT bài học — dùng chung cho màn chấm và ô tìm kiếm */
function gradeWorks(c,t,l){
  const works=c.assignments.map((a,i)=>({kind:'asg',i,label:a.name,meta:'Bài tập'})).filter(w=>folderScopeInfo(c,c.assignments[w.i].scope,t,l));
  if(!c.quiz.deleted&&folderScopeInfo(c,c.quiz.scope,t,l))works.push({kind:'quiz',i:0,label:c.quiz.name,meta:'Bài tập'});
  /* Mở từ thông báo: đưa đúng bài cần chấm vào danh sách kể cả khi phạm vi của nó là “Cả lớp”. */
  if(gradeForce==='quiz'&&!c.quiz.deleted&&!works.some(w=>w.kind==='quiz'))works.push({kind:'quiz',i:0,label:c.quiz.name,meta:'Bài tập'});
  if(typeof gradeForce==='number'&&c.assignments[gradeForce]&&!works.some(w=>w.kind==='asg'&&w.i===gradeForce))works.unshift({kind:'asg',i:gradeForce,label:c.assignments[gradeForce].name,meta:'Bài tập'});
  return works;
}
function folderGrading(c,t,l){
  const works=gradeWorks(c,t,l);
  if(!works.some(w=>w.kind===grItemType))grItemType=works[0]?.kind||'asg';
  let sel=works.find(w=>w.kind===grItemType&&(w.kind==='asg'?w.i===gradeAi:true))||works[0];
  if(!sel)return `<section class='panel'><h2>Chấm điểm & Kết quả</h2><div class='folder-empty'>Bài học này chưa có bài tập hoặc bài kiểm tra cần chấm.</div></section>`;
  if(sel.kind==='asg')gradeAi=sel.i;
  const a=sel.kind==='asg'?c.assignments[sel.i]:null,isQ=sel.kind==='quiz';
  const select=`<div class='row grade-tools'><button type='button' class='btn light icon-only grp-btn' data-iconified='1' aria-haspopup='dialog' aria-label='Tìm và chọn bài tập hoặc bài kiểm tra để chấm · đang chọn: ${esc(sel.label)}' title='Tìm và chọn bài để chấm điểm, xem kết quả' onclick='grPickOpen()'>${ic('search',18)}</button></div>`;
  if(grTab!=='mark'&&grTab!=='result')grTab='mark';
  const tabs=`<div class='seg seg-wide' role='tablist' aria-label='Chấm điểm và kết quả của bài đang chọn'><button role='tab' aria-selected='${grTab==='mark'}' onclick="grTabSet('mark')">Chấm điểm</button><button role='tab' aria-selected='${grTab==='result'}' onclick="grTabSet('result')">Kết quả</button></div>`;
  if(grTab==='result'){
    if(isQ)return `<section class='panel' aria-label='Kết quả · ${esc(sel.label)}'>${select}${tabs}${attemptsPanel(c)}</section>`;
    const rows=c.students.map((s,i)=>{const b=a.subs[i]||{};return `<tr><td class='student'>${esc(s.name)}</td><td>${b.has?'<span class="pill prog">Đã nộp</span>':'<span class="pill plain">Chưa nộp</span>'}</td><td>${b.score==null?'–':`<b>${b.score}/${a.max}</b>`}</td><td>${pTriesOf(b)}</td><td>${esc(b.fb||'–')}</td></tr>`}).join('');
    return `<section class='panel' aria-label='Kết quả · ${esc(a.name)}'>${select}${tabs}<div class='tablewrap'><table><thead><tr><th>Học sinh</th><th>Trạng thái</th><th>Điểm</th><th>Lượt làm</th><th>Nhận xét</th></tr></thead><tbody>${rows}</tbody></table></div></section>${triesPanel(c)}`;
  }
  if(isQ)return `<section class='panel' aria-label='Phân tích bài kiểm tra · ${esc(sel.label)}'>${select}${tabs}${anSection(c,'quiz',0)}</section>`;
  return `<section class='panel' aria-label='Chấm điểm · ${esc(a.name)}'>${select}${tabs}${grList(c,sel.i,a)}</section>`;
}

let grpOv=null;

function grPickFilter(q){
  if(!grpOv)return;

  [...grpOv.querySelectorAll('.grp-item')].forEach(b=>{const hit=!k||(b.dataset.txt||'').indexOf(k)>=0;b.hidden=!hit;if(hit)n++});

function grPickChoose(k){grPickClose();folderGradePick(k)}
function grPickStat(c,w){
  if(w.kind==='quiz'){
    const n=c.students.reduce((t,s)=>t+(s.atts||[]).filter(x=>x.status&&x.status!=='IN_PROGRESS').length,0);
    return n?n+' lượt đã nộp':'chưa có lượt nộp';
  }
  const a=c.assignments[w.i],sub=a.submitted||0,pend=Math.max(0,sub-(a.graded||0));
  return sub?sub+' bài nộp · '+pend+' chờ chấm':'chưa có bài nộp';

function grPickOpen(){
  if(grpOv){grPickClose();return}
  const c=selected(),r=folderResolve(c),t=r.t,l=r.l;
  if(!t||!l){toast('Mở một bài học trước, rồi chọn bài tập hoặc bài kiểm tra cần chấm.');return}
  const works=gradeWorks(c,t,l),cur=works.find(w=>w.kind===grItemType&&(w.kind==='asg'?w.i===gradeAi:true));
  const items=works.map(w=>{

    return `<button type='button' class='grp-item${on?' on':''}' role='option' aria-selected='${on}' data-txt='${esc((w.label+' '+w.meta).toLowerCase())}' onclick="grPickChoose('${w.kind}:${w.i}')"><span class='grp-ic'>${ic(w.kind==='quiz'?'assessments':'assignments',18)}</span><span class='grp-txt'><b>${esc(w.label)}</b><span class='muted'>${esc(w.meta)} · ${esc(grPickStat(c,w))}</span></span>${on?`<span class='pill good'>Đang chọn</span>`:''}</button>`;
  }).join('');
  const ov=document.createElement('div');
  ov.className='ov grp-ov';
  ov.innerHTML=`<div class='dlg grp-dlg' role='dialog' aria-modal='true' aria-labelledby='grp-t'>
    <div class='grp-head'><h2 id='grp-t'>Chọn bài để chấm</h2><button type='button' class='btn light icon-only' data-iconified='1' aria-label='Đóng' onclick='grPickClose()'>${ic('close',16)}</button></div>
    <p class='muted' style='margin:2px 0 0'>Bài học · <b>${esc(l.name)}</b> · ${works.length} bài</p>
    <div class='grp-search'>${ic('search',16)}<input id='grp-find' type='search' autocomplete='off' placeholder='Tìm bài tập, bài kiểm tra…' aria-label='Tìm bài tập hoặc bài kiểm tra trong bài học này' oninput='grPickFilter(this.value)' onkeydown="if(event.key==='Escape')grPickClose()"></div>
    <div class='grp-list' id='grp-list' role='listbox' aria-labelledby='grp-t'>${items||`<div class='folder-empty'>Bài học này chưa có bài tập hay bài kiểm tra nào để chấm.</div>`}</div>
    <div id='grp-empty' class='folder-empty' hidden>Không có bài nào khớp từ khoá.</div>
  </div>`;
  ov.addEventListener('click',e=>{if(e.target===ov)grPickClose()});
  document.body.appendChild(ov);
  grpOv=ov;
  const inp=ov.querySelector('#grp-find');if(inp)inp.focus();
}

function dashboardOpen(module,topicId,lessonName,kind,index,tab){

function dashboardContext(c,scope,module,kind,index,tab){
  const suffix=kind?`, '${kind}', ${index||0}${tab?`, '${tab}'`:''}`:'';
  if(scope&&scope.type==='lesson'&&scope.ref){return `dashboardOpen('${module}','${esc(scope.ref.tid)}','${esc(scope.ref.name)}'${suffix})`}
  if(scope&&scope.type==='topic'){
    const t=c.topics.find(x=>x.id===scope.id),l=t&&c.lessonsData.find(x=>x.tid===t.id);

function iconKeyForButton(b,label){
  if(b.classList.contains('nav')){const k=(b.id||'').replace('nav-','');return ({dashboard:'overview',overview:'lessons',classes:'classes',students:'students'})[k]||k}

  if(/xem|preview|chi tiết|mở|open/.test(t))return 'eye';

function iconifyButtons(){
  document.querySelectorAll('#app button.nav').forEach(b=>{const label=(b.textContent||'').replace(/\s+/g,' ').trim();if(label){b.setAttribute('aria-label',label);b.title=label}});
  const buttons=document.querySelectorAll('#app button.btn, #app button.topic-icon-btn, #app button.chip, #app button.mitem');
  buttons.forEach(b=>{
    if(b.dataset.iconified==='1'||b.hasAttribute('data-noicon'))return;
    if(b.closest('.asg-builder'))return;   /* trình tạo bài tập giữ nhãn chữ cho thao tác chính */
    const raw=(b.textContent||'').replace(/\s+/g,' ').trim();
    if(!raw)return; // cards and choices whose text is their content remain readable
    const accessible=b.getAttribute('aria-label')||raw;
    const tooltip=b.getAttribute('title')||accessible;
    const icon=iconKeyForButton(b,raw);
    if(!P[icon])return;
    b.setAttribute('aria-label',accessible);b.setAttribute('title',tooltip);b.classList.add('icon-only');b.dataset.iconified='1';
    b.innerHTML=ic(icon,18)+`<span class='sr'></span>`;b.querySelector('.sr').textContent=accessible;
  });
}

let trendObjective='0',trendStudent='all',trendWindow='90';
const TREND_COLORS=['#2864dc','#12a37f','#d97706','#8b5cf6','#e04f6f','#0787a7','#7c9b19','#9b55c6'];
function progressRows(c){
  const j=Math.max(0,Math.min(c.goals.length-1,parseInt(trendObjective,10)||0)),limit=trendWindow==='all'?Infinity:parseInt(trendWindow,10)||90;

  return students.map(st=>{const si=c.students.indexOf(st),events=(st.ev[j]||[]).filter(e=>today-e.day<=limit).slice().sort((a,b)=>a.day-b.day);return {s:st,si,j,events,first:events[0]||null,last:events.at(-1)||null,current:st.mastery[j]??null}});
}
function trendDate(day){return new Date(simNow()-(today-day)*86400000).toLocaleDateString('vi-VN')}
function progressChart(rows,c){
  const w=820,h=270,L=48,R=18,T=12,B=35,pw=w-L-R,ph=h-T-B,events=rows.flatMap(x=>x.events);
  if(!events.length)return `<div class='empty'>Chưa có bằng chứng học tập trong khoảng thời gian đã chọn.</div>`;
  const days=events.map(e=>e.day),min=Math.min(...days),max=Math.max(...days),span=Math.max(1,max-min);
  const grid=[0,25,50,75,100].map(v=>{const y=T+(1-v/100)*ph;return `<line x1='${L}' y1='${y}' x2='${w-R}' y2='${y}' stroke='var(--line)' stroke-width='1'/><text x='${L-8}' y='${y+4}' text-anchor='end' fill='var(--muted)' font-size='10'>${v}%</text>`}).join('');
  const lines=rows.map((r,i)=>{if(!r.events.length)return '';const col=TREND_COLORS[r.si%TREND_COLORS.length],pts=r.events.map(e=>({x:L+(e.day-min)/span*pw,y:T+(1-e.s)*ph,e}));const path=pts.map((p,k)=>(k?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');return `<g><path d='${path}' fill='none' stroke='${col}' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round' opacity='.88'/>${pts.map(p=>`<circle cx='${p.x}' cy='${p.y}' r='4' fill='${col}' stroke='var(--surface)' stroke-width='2'><title>${esc(r.s.name)} · ${trendDate(p.e.day)} · ${pct(p.e.s)}% · ${esc(p.e.src||'Bằng chứng')}</title></circle>`).join('')}</g>`}).join('');
  return `<div class='trend-chart-wrap'><svg class='trend-chart' viewBox='0 0 ${w} ${h}' role='img' aria-label='Biểu đồ tiến bộ theo mục tiêu ${esc(c.goals[rows[0].j]||'')}'>${grid}<line x1='${L}' y1='${T+ph}' x2='${w-R}' y2='${T+ph}' stroke='var(--line-strong)'/><text x='${L}' y='${h-8}' fill='var(--muted)' font-size='10'>${trendDate(min)}</text><text x='${w-R}' y='${h-8}' text-anchor='end' fill='var(--muted)' font-size='10'>${trendDate(max)}</text>${lines}</svg></div>`;
}

}

function revisionSnapshot(c){

  const snap={
    topics:(c.topics||[]).map((t,i)=>({key:String(t.id||'topic-'+i),name:t.title,description:t.desc||'',status:t.status||''})),
    lessons:(c.lessonsData||[]).map((l,i)=>({key:String(l.hid||l.id||('lesson-'+i)),name:l.name,description:l.desc||'',status:l.status||'',topic:l.tid||'',objectives:(l.objs||[]).map(o=>({code:o.code,description:o.desc,index:o.idx})),resources:cleanRes(l)})),
    assignments:(c.assignments||[]).map((a,i)=>({key:String(a.aid||'assignment-'+i),name:a.name,description:a.desc||'',status:a.status||'',kind:a.kind||'WRITTEN',scope:revisionScope(c,a.scope),due:a.due||'',lateClose:a.lateClose||'',max:a.max||0,maxTries:a.maxTries||0,gameMode:a.gameMode||'',objectives:a.objs||[],rubric:(a.rubric||[]).map(x=>({name:x.name,max:x.max,description:x.description||''})),questions:(a.qs||[]).map(x=>({qid:x.qid,weight:x.w}))})),

    grades:(c.assignments||[]).flatMap(a=>(a.subs||[]).map((b,i)=>b&&b.has?({key:String(a.aid||a.name)+'|'+String(c.students[i]&&c.students[i].email||i),name:(c.students[i]&&c.students[i].name||'Học sinh')+' · '+a.name,score:b.score==null?null:b.score,feedback:b.fb||'',rubricScores:(b.rubricScores||[]).map(x=>({name:x.name,max:x.max,score:x.score,comment:x.comment||''})),gradedBy:b.gradedBy||'',confirmedAt:b.confirmedAt||''}):null).filter(Boolean)),
    assessmentGrades:(c.students||[]).flatMap(st=>(st.atts||[]).map(t=>({key:String(st.email)+'|'+String(t.n),name:st.name+' · '+(c.quiz&&c.quiz.name||'Bài kiểm tra')+' · lượt '+t.n,status:t.status,total:t.total==null?null:t.total,answers:Object.keys(t.sc||{}).sort().map(k=>({question:k,score:t.sc[k],feedback:t.fb&&t.fb[k]||''}))})))

  return all;
}
function revisionChanges(before,after){
  const keys=new Set([...Object.keys(before||{}),...Object.keys(after||{})]),changes=[];
  keys.forEach(k=>{const b=before&&before[k]?before[k].data:null,a=after&&after[k]?after[k].data:null;if(JSON.stringify(b)!==JSON.stringify(a))changes.push({type:(after&&after[k]||before[k]).type,key:k,name:(after&&after[k]||before[k]).name,before:b,after:a})});
  return changes;
}
function recordRevision(c,action,before,after){
  if(!c)return 0;const changes=revisionChanges(before,after);if(!changes.length)return 0;
  const row={id:revisionId(),classId:c.id,className:c.id,owner:(sess&&sess.email)||c.owner||'',action:String(action||'Cập nhật nội dung'),user:acctName(),at:new Date().toISOString(),changes};
  REVISION_HISTORY.unshift(row);REVISION_HISTORY=REVISION_HISTORY.slice(0,250);
  try{localStorage.setItem(REVISION_KEY,JSON.stringify(REVISION_HISTORY))}catch(e){}
  return changes.length;
}

const _openDlgRevision=openDlg;
openDlg=function(d){
  const c=selected&&selected(),title=String(d&&d.title||''),track=c&&role==='T'&&/(Sửa|Tạo|Thêm|Xóa|Rubric|Chấm|Xác nhận|Xuất bản)/i.test(title)&&typeof d.ok==='function';
  if(track){const before=revisionSnapshot(c),ok=d.ok;d.ok=function(v){const result=ok(v);if(result==null||result===undefined){const after=revisionSnapshot(c);recordRevision(c,title,before,after)}return result}}
  return _openDlgRevision(d);
};
function revisionWrap(name,action){
  const original=window[name];if(typeof original!=='function'||original.__revisionWrapped)return;
  const wrapped=function(...args){const c=selected&&selected(),before=c&&role==='T'?revisionSnapshot(c):null,result=original.apply(this,args);if(before){const after=revisionSnapshot(c);recordRevision(c,action,before,after)}return result};
  wrapped.__revisionWrapped=true;window[name]=wrapped;
}
